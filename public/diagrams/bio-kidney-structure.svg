  <text x="524" y="268" font-family="Arial, sans-serif" font-size="11" fill="#334155">renal pyramids</text>

  <text x="320" y="344" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">blood enters by the renal artery, is filtered, and urine leaves through the pelvis and ureter</text>
