  <path d="M370,218 L345,188 L385,212 Z" fill="#fbbf24" stroke="#b45309" stroke-width="1.5"/>

  <polygon points="235,178 180,178 160,160 130,160 130,196 160,196 180,180 235,180" fill="#fecaca" stroke="#dc2626" stroke-width="1.5"/>
  <text x="176" y="214" font-family="Arial, sans-serif" font-size="11" fill="#991b1b">pelvis</text>
  <line x1="145" y1="180" x2="145" y2="300" stroke="#475569" stroke-width="9"/>
  <line x1="145" y1="180" x2="145" y2="300" stroke="#cbd5e1" stroke-width="5"/>
  <text x="145" y="318" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#334155">ureter</text>

