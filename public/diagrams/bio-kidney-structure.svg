  </defs>
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="26" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#0369a1">The kidney: internal structure</text>

  <ellipse cx="360" cy="185" rx="150" ry="92" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
  <ellipse cx="360" cy="185" rx="118" ry="68" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>

