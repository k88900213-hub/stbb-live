  <text x="70" y="120" font-family="Arial, sans-serif" font-size="11" fill="#991b1b">renal artery</text>
  <line x1="60" y1="240" x2="212" y2="208" stroke="#2563eb" stroke-width="6"/>
  <text x="70" y="260" font-family="Arial, sans-serif" font-size="11" fill="#1e40af">renal vein</text>
  <text x="150" y="150" font-family="Arial, sans-serif" font-size="11" fill="#334155">hilus</text>

  <line x1="360" y1="93" x2="360" y2="60" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="370" y="66" font-family="Arial, sans-serif" font-size="11" fill="#334155">cortex</text>
