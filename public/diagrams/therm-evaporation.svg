<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#64748b"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#c2410c">Evaporation: fast molecules escape the surface</text>
  <g transform="translate(150,90)">
    <rect x="60" y="120" width="300" height="140" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="210" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#075985">liquid</text>
    <g>
      <circle cx="110" cy="200" r="12" fill="#2563eb"/><circle cx="180" cy="220" r="12" fill="#2563eb"/>
      <circle cx="260" cy="200" r="12" fill="#2563eb"/><circle cx="320" cy="220" r="12" fill="#2563eb"/>
    </g>
    <line x1="60" y1="120" x2="360" y2="120" stroke="#0ea5e9" stroke-width="3"/>
    <path d="M130,120 Q120,70 130,30" fill="none" stroke="#c2410c" stroke-width="2.5" marker-end="url(#ar)"/>
    <path d="M250,120 Q245,80 250,50" fill="none" stroke="#c2410c" stroke-width="2.5" marker-end="url(#ar)"/>
    <circle cx="130" cy="15" r="7" fill="#c2410c"/>
    <circle cx="250" cy="40" r="7" fill="#c2410c"/>
    <text x="130" y="0" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#c2410c">fastest molecules escape</text>
  </g>
  <rect x="120" y="260" width="400" height="54" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="320" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#166534">the fast molecules leave, so the average energy of those left falls</text>
  <text x="320" y="302" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#166534">→ the liquid cools · sweating and fanning cool you this way</text>
</svg>
