<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#64748b"/></marker>
    <marker id="arA" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#c2410c"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="26" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#0369a1">Regions of the human brain</text>

  <path d="M120,120 C150,55 260,35 330,55 C380,70 430,95 440,150 C450,205 420,250 365,265 C340,260 305,255 275,265 C230,280 175,270 145,230 C120,195 110,150 120,120 Z" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <line x1="280" y1="255" x2="280" y2="318" stroke="#dc2626" stroke-width="14"/>
  <path d="M305,250 C335,240 380,245 400,265 C410,275 410,295 400,305 C380,315 350,315 330,305" fill="#fecaca" stroke="#dc2626" stroke-width="2"/>
  <path d="M280,150 C300,140 330,140 345,150 C355,170 355,200 345,220 C330,230 300,230 280,220 C270,200 270,170 280,150 Z" fill="none" stroke="#991b1b" stroke-width="2"/>
  <text x="300" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#991b1b">corpus</text>
  <text x="300" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#991b1b">callosum</text>

  <text x="160" y="110" font-family="Arial, sans-serif" font-size="12" fill="#334155">frontal lobe</text>
  <text x="285" y="62" font-family="Arial, sans-serif" font-size="12" fill="#334155">parietal lobe</text>
  <text x="175" y="225" font-family="Arial, sans-serif" font-size="12" fill="#334155">temporal lobe</text>
  <text x="462" y="130" font-family="Arial, sans-serif" font-size="12" fill="#334155">occipital lobe</text>
  <text x="462" y="270" font-family="Arial, sans-serif" font-size="12" fill="#334155">cerebellum</text>
  <text x="300" y="290" font-family="Arial, sans-serif" font-size="12" fill="#334155">pons</text>
  <text x="330" y="318" font-family="Arial, sans-serif" font-size="12" fill="#334155">medulla oblongata</text>
  <text x="330" y="332" font-family="Arial, sans-serif" font-size="12" fill="#334155">(vital centres)</text>
  <circle cx="255" cy="235" r="4" fill="#991b1b"/>
  <text x="200" y="245" font-family="Arial, sans-serif" font-size="11" fill="#334155">hypothalamus</text>

  <text x="320" y="352" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">cerebrum controls thought; cerebellum controls balance; medulla runs the vital functions</text>
