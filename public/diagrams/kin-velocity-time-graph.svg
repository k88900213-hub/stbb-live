<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#c2410c">Velocity-time graphs</text>
  <g transform="translate(70,60)">
    <line x1="0" y1="240" x2="520" y2="240" stroke="#475569" stroke-width="2"/>
    <line x1="0" y1="240" x2="0" y2="20" stroke="#475569" stroke-width="2"/>
    <text x="250" y="262" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#334155">time (s)</text>
    <text x="-10" y="55" transform="rotate(-90,-10,140)" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#334155">velocity (m/s)</text>
    <g stroke="#94a3b8" stroke-width="1">
      <line x1="0" y1="180" x2="520" y2="180"/><line x1="0" y1="120" x2="520" y2="120"/><line x1="0" y1="60" x2="520" y2="60"/>
      <line x1="130" y1="20" x2="130" y2="240"/><line x1="260" y1="20" x2="260" y2="240"/><line x1="390" y1="20" x2="390" y2="240"/>
    </g>
    <line x1="0" y1="240" x2="130" y2="120" stroke="#16a34a" stroke-width="3"/>
    <line x1="130" y1="120" x2="390" y2="120" stroke="#c2410c" stroke-width="3"/>
    <line x1="390" y1="120" x2="520" y2="240" stroke="#dc2626" stroke-width="3"/>
    <rect x="130" y="120" width="260" height="120" fill="#fdba74" opacity="0.3"/>
    <text x="260" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#9a3412">area = displacement</text>
    <text x="30" y="160" font-family="Arial, sans-serif" font-size="12" fill="#16a34a">accelerating</text>
    <text x="180" y="105" font-family="Arial, sans-serif" font-size="12" fill="#c2410c">uniform velocity</text>
    <text x="430" y="115" font-family="Arial, sans-serif" font-size="12" fill="#dc2626">decelerating</text>
  </g>
  <text x="320" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">slope = acceleration · area under the graph = displacement</text>
</svg>
