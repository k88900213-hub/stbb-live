<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <marker id="arA" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#c2410c"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#c2410c">Elasticity and Hooke's law</text>
  <g transform="translate(120,90)">
    <rect x="0" y="0" width="70" height="28" fill="#64748b"/>
    <g stroke="#475569" stroke-width="3">
      <line x1="20" y1="60" x2="35" y2="28"/><line x1="35" y1="28" x2="45" y2="43"/>
      <line x1="45" y1="43" x2="55" y2="28"/><line x1="55" y1="28" x2="62" y2="43"/>
      <line x1="62" y1="43" x2="70" y2="28"/><line x1="70" y1="28" x2="78" y2="43"/>
      <line x1="78" y1="43" x2="86" y2="28"/><line x1="86" y1="28" x2="95" y2="60"/>
    </g>
    <rect x="72" y="60" width="46" height="26" rx="4" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
    <text x="95" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#92400e">mass</text>
    <line x1="95" y1="86" x2="95" y2="120" stroke="#c2410c" stroke-width="2.5" marker-end="url(#arA)"/>
    <text x="120" y="115" font-family="Arial, sans-serif" font-size="12" fill="#c2410c">load F</text>
  </g>
  <g transform="translate(380,70)">
    <line x1="0" y1="180" x2="200" y2="180" stroke="#475569" stroke-width="2"/>
    <line x1="0" y1="180" x2="0" y2="20" stroke="#475569" stroke-width="2"/>
    <text x="100" y="202" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#334155">extension</text>
    <text x="-4" y="30" transform="rotate(-90,-4,110)" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#334155">load</text>
    <line x1="0" y1="180" x2="150" y2="70" stroke="#16a34a" stroke-width="3"/>
    <text x="40" y="150" font-family="Arial, sans-serif" font-size="11" fill="#16a34a">F = kx (straight)</text>
    <path d="M150,70 Q175,58 190,60" fill="none" stroke="#dc2626" stroke-width="3"/>
    <text x="60" y="52" font-family="Arial, sans-serif" font-size="11" fill="#dc2626">elastic limit —</text>
    <text x="60" y="66" font-family="Arial, sans-serif" font-size="11" fill="#dc2626">spring damages</text>
  </g>
  <text x="320" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">extension is proportional to load, up to the elastic limit</text>
</svg>
