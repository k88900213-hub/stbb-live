<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#047857">Alkanes, alkenes and alkynes: single, double and triple bonds</text>

  <g font-family="Arial, sans-serif">
    <text x="120" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">Methane CH₄</text>
    <line x1="120" y1="130" x2="120" y2="95" stroke="#475569" stroke-width="2"/>
    <line x1="120" y1="130" x2="88" y2="112" stroke="#475569" stroke-width="2"/>
    <line x1="120" y1="130" x2="152" y2="112" stroke="#475569" stroke-width="2"/>
    <line x1="120" y1="130" x2="120" y2="162" stroke="#475569" stroke-width="2"/>
    <circle cx="120" cy="130" r="5" fill="#334155"/>
    <circle cx="120" cy="88" r="3.5" fill="#16a34a"/>
    <circle cx="82" cy="109" r="3.5" fill="#16a34a"/>
    <circle cx="158" cy="109" r="3.5" fill="#16a34a"/>
    <circle cx="120" cy="168" r="3.5" fill="#16a34a"/>

    <text x="400" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">Ethane C₂H₆</text>
    <line x1="370" y1="130" x2="430" y2="130" stroke="#475569" stroke-width="2.5"/>
    <line x1="370" y1="130" x2="370" y2="98" stroke="#475569" stroke-width="2"/>
    <line x1="370" y1="130" x2="370" y2="162" stroke="#475569" stroke-width="2"/>
    <line x1="430" y1="130" x2="430" y2="98" stroke="#475569" stroke-width="2"/>
    <line x1="430" y1="130" x2="430" y2="162" stroke="#475569" stroke-width="2"/>
    <circle cx="370" cy="130" r="5" fill="#334155"/>
    <circle cx="430" cy="130" r="5" fill="#334155"/>
    <circle cx="370" cy="92" r="3.5" fill="#16a34a"/>
    <circle cx="370" cy="168" r="3.5" fill="#16a34a"/>
    <circle cx="430" cy="92" r="3.5" fill="#16a34a"/>
    <circle cx="430" cy="168" r="3.5" fill="#16a34a"/>

    <text x="120" y="220" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">Ethene C₂H₄ (alkene)</text>
    <line x1="90" y1="270" x2="150" y2="270" stroke="#475569" stroke-width="2.5"/>
    <line x1="90" y1="270" x2="90" y2="240" stroke="#475569" stroke-width="2"/>
    <line x1="90" y1="270" x2="90" y2="300" stroke="#475569" stroke-width="2"/>
    <line x1="150" y1="270" x2="150" y2="240" stroke="#475569" stroke-width="2"/>
    <line x1="150" y1="270" x2="150" y2="300" stroke="#475569" stroke-width="2"/>
    <line x1="90" y1="272" x2="150" y2="272" stroke="#475569" stroke-width="2"/>
    <circle cx="90" cy="270" r="5" fill="#334155"/>
    <circle cx="150" cy="270" r="5" fill="#334155"/>
    <circle cx="90" cy="234" r="3.5" fill="#16a34a"/>
    <circle cx="90" cy="306" r="3.5" fill="#16a34a"/>
    <circle cx="150" cy="234" r="3.5" fill="#16a34a"/>
    <circle cx="150" cy="306" r="3.5" fill="#16a34a"/>
    <text x="120" y="328" text-anchor="middle" font-size="11.5" fill="#166534">double bond</text>

    <text x="400" y="220" text-anchor="middle" font-size="13" font-weight="bold" fill="#334155">Ethyne C₂H₂ (alkyne)</text>
    <line x1="360" y1="270" x2="440" y2="270" stroke="#475569" stroke-width="2.5"/>
    <line x1="360" y1="270" x2="440" y2="270" stroke="#475569" stroke-width="2"/>
    <line x1="360" y1="270" x2="440" y2="270" stroke="#475569" stroke-width="2"/>
    <line x1="360" y1="270" x2="360" y2="242" stroke="#475569" stroke-width="2"/>
    <line x1="440" y1="270" x2="440" y2="242" stroke="#475569" stroke-width="2"/>
    <circle cx="360" cy="270" r="5" fill="#334155"/>
    <circle cx="440" cy="270" r="5" fill="#334155"/>
    <circle cx="360" cy="236" r="3.5" fill="#16a34a"/>
    <circle cx="440" cy="236" r="3.5" fill="#16a34a"/>
    <text x="400" y="306" text-anchor="middle" font-size="11.5" fill="#166534">triple bond</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="11" fill="#64748b">
    <text x="238" y="140">H = hydrogen</text>
    <circle cx="212" cy="133" r="3.5" fill="#16a34a"/>
    <text x="238" y="158">C = carbon</text>
    <circle cx="211" cy="152" r="4" fill="#334155"/>
  </g>

  <rect x="110" y="338" width="420" height="20" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="320" y="352" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#166534">Alkanes are saturated; alkenes and alkynes are unsaturated and can add atoms.</text>
</svg>
