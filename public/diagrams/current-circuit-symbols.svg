<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#c2410c">Common electric circuit symbols</text>

  <g stroke="#334155" stroke-width="2" fill="none">
    <g>
      <line x1="45" y1="80" x2="72" y2="80"/>
      <line x1="72" y1="70" x2="72" y2="90" stroke-width="5"/>
      <line x1="88" y1="67" x2="88" y2="93"/>
      <line x1="88" y1="80" x2="115" y2="80"/>
      <text x="80" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#334155">cell</text>
      <text x="66" y="105" font-family="Arial, sans-serif" font-size="10" fill="#dc2626">−</text>
      <text x="96" y="105" font-family="Arial, sans-serif" font-size="10" fill="#16a34a">+</text>
    </g>
    <g>
      <line x1="155" y1="80" x2="174" y2="80"/>
      <line x1="174" y1="70" x2="174" y2="90" stroke-width="5"/>
      <line x1="190" y1="67" x2="190" y2="93"/>
      <line x1="202" y1="70" x2="202" y2="90" stroke-width="5"/>
      <line x1="218" y1="67" x2="218" y2="93"/>
      <line x1="218" y1="80" x2="237" y2="80"/>
      <text x="196" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#334155">battery</text>
    </g>
    <g>
      <line x1="265" y1="80" x2="286" y2="80"/>
      <circle cx="300" cy="80" r="14"/>
      <line x1="292" y1="72" x2="308" y2="88"/>
      <line x1="308" y1="72" x2="292" y2="88"/>
      <line x1="314" y1="80" x2="335" y2="80"/>
      <text x="300" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#334155">lamp (bulb)</text>
    </g>
    <g>
      <line x1="375" y1="80" x2="390" y2="80"/>
      <rect x="390" y="68" width="40" height="24"/>
      <line x1="430" y1="80" x2="445" y2="80"/>
      <text x="410" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#334155">resistor</text>
    </g>
    <g>
      <line x1="485" y1="80" x2="500" y2="80"/>
      <rect x="500" y="68" width="40" height="24"/>
      <line x1="540" y1="80" x2="555" y2="80"/>
      <line x1="508" y1="88" x2="532" y2="70" stroke-width="1.5"/>
      <text x="520" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#334155">variable</text>
      <text x="520" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#334155">resistor</text>
    </g>

    <g>
      <line x1="45" y1="220" x2="70" y2="220"/>
      <circle cx="80" cy="220" r="3"/>
      <circle cx="104" cy="220" r="3"/>
      <line x1="78" y1="220" x2="98" y2="205"/>
      <line x1="104" y1="220" x2="115" y2="220"/>
      <text x="80" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#334155">switch (open)</text>
    </g>
    <g>
      <line x1="155" y1="220" x2="177" y2="220"/>
      <circle cx="190" cy="220" r="13"/>
      <line x1="203" y1="220" x2="225" y2="220"/>
      <text x="190" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e40af">A</text>
      <text x="190" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#334155">ammeter</text>
    </g>
    <g>
      <line x1="265" y1="220" x2="287" y2="220"/>
      <circle cx="300" cy="220" r="13"/>
      <line x1="313" y1="220" x2="335" y2="220"/>
      <text x="300" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e40af">V</text>
      <text x="300" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#334155">voltmeter</text>
    </g>
    <g>
      <line x1="375" y1="220" x2="397" y2="220"/>
      <circle cx="410" cy="220" r="13"/>
      <line x1="423" y1="220" x2="445" y2="220"/>
      <text x="410" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e40af">G</text>
      <text x="410" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#334155">galvanometer</text>
    </g>
    <g>
      <line x1="485" y1="220" x2="500" y2="220"/>
      <rect x="500" y="212" width="40" height="16" fill="none"/>
      <line x1="500" y1="220" x2="540" y2="220"/>
      <line x1="540" y1="220" x2="555" y2="220"/>
      <text x="520" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#334155">fuse</text>
    </g>
  </g>

  <rect x="90" y="292" width="460" height="30" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="320" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#166534">Ammeters are connected in series; voltmeters in parallel with the component.</text>
  <text x="320" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#166534">Arrows on wires show conventional current — from positive to negative.</text>

  <text x="320" y="352" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#64748b">Circuit diagrams replace pictures with these standard symbols, so every builder draws the same circuit.</text>
</svg>
