<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#64748b"/></marker>
    <marker id="arA" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#c2410c"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#c2410c">Displacement-time graph of SHM</text>

  <line x1="80" y1="80" x2="80" y2="290" stroke="#475569" stroke-width="2"/>
  <line x1="80" y1="290" x2="600" y2="290" stroke="#475569" stroke-width="2"/>
  <line x1="80" y1="185" x2="600" y2="185" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4"/>
  <text x="52" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#334155">displacement</text>
  <text x="52" y="192" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#475569">mean position</text>
  <text x="620" y="294" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#334155">time</text>

  <path d="M80,185 Q120,185 140,105 T200,185 T260,265 T320,185 T380,105 T440,185 T500,265 T560,185" fill="none" stroke="#c2410c" stroke-width="3"/>
  <circle cx="80" cy="185" r="3" fill="#c2410c"/>
  <circle cx="320" cy="185" r="3" fill="#c2410c"/>
  <circle cx="560" cy="185" r="3" fill="#c2410c"/>

  <line x1="320" y1="185" x2="320" y2="105" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arA)"/>
  <text x="335" y="135" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#dc2626">amplitude A</text>
  <line x1="380" y1="295" x2="440" y2="295" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)"/>
  <text x="410" y="314" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#dc2626">time period T</text>
  <text x="320" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#475569">x = x₀ sin ωt — one complete sine cycle</text>

  <text x="320" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Peak height gives the amplitude; the distance between successive peaks gives the period.</text>
</svg>
