<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#64748b"/></marker>
    <marker id="arA" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#c2410c"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="26" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#0369a1">Mechanism of breathing: inspiration and expiration</text>

  <rect x="60" y="46" width="250" height="252" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="185" y="64" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1e40af">INSPIRATION (air in)</text>
  <g stroke="#475569" stroke-width="2" fill="none">
    <path d="M100,70 Q125,58 150,70"/>
    <path d="M88,95 Q125,84 162,95"/>
    <path d="M78,120 Q125,110 172,120"/>
    <path d="M70,145 Q125,136 180,145"/>
  </g>
  <ellipse cx="108" cy="150" rx="24" ry="36" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
  <ellipse cx="162" cy="150" rx="24" ry="36" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
  <path d="M70,192 Q125,212 180,192" stroke="#c2410c" stroke-width="4" fill="none"/>
  <text x="125" y="234" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#c2410c">diaphragm contracts,</text>
  <text x="125" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#c2410c">flattens and moves down</text>
  <line x1="125" y1="80" x2="125" y2="110" stroke="#c2410c" stroke-width="2.5" marker-end="url(#arA)"/>
  <text x="134" y="98" font-family="Arial, sans-serif" font-size="12" fill="#c2410c">air in</text>
  <text x="70" y="278" font-family="Arial, sans-serif" font-size="12" fill="#334155">ribs and intercostal muscles move up and out; thorax volume increases</text>

  <rect x="330" y="46" width="250" height="252" rx="10" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
  <text x="455" y="64" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#9a3412">EXPIRATION (air out)</text>
  <g stroke="#475569" stroke-width="2" fill="none">
    <path d="M100,90 Q125,80 150,90"/>
    <path d="M88,112 Q125,103 162,112"/>
    <path d="M78,134 Q125,126 172,134"/>
    <path d="M70,156 Q125,148 180,156"/>
  </g>
  <ellipse cx="108" cy="150" rx="24" ry="36" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
  <ellipse cx="162" cy="150" rx="24" ry="36" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
  <path d="M70,145 Q125,112 180,145" stroke="#64748b" stroke-width="4" fill="none"/>
  <text x="125" y="234" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155">diaphragm relaxes,</text>
  <text x="125" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155">rises and domes upward</text>
  <line x1="125" y1="120" x2="125" y2="86" stroke="#64748b" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="134" y="106" font-family="Arial, sans-serif" font-size="12" fill="#334155">air out</text>
  <text x="340" y="278" font-family="Arial, sans-serif" font-size="12" fill="#334155">ribs and intercostal muscles move down and in; thorax volume decreases</text>

  <text x="320" y="332" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">in inspiration the pressure in the lungs falls and air rushes in; in expiration it rises and air is forced out</text>
</svg>
