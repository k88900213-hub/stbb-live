<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#047857">Electron shell capacities follow 2n²</text>

  <g font-family="Arial, sans-serif">
    <rect x="20" y="70" width="140" height="180" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
    <text x="90" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">K shell</text>
    <text x="90" y="114" text-anchor="middle" font-size="12" fill="#166534">n = 1</text>
    <circle cx="76" cy="160" r="6" fill="#eab308"/>
    <circle cx="104" cy="160" r="6" fill="#eab308"/>
    <text x="90" y="220" text-anchor="middle" font-size="28" font-weight="bold" fill="#166534">2</text>

    <rect x="175" y="70" width="140" height="180" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="245" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">L shell</text>
    <text x="245" y="114" text-anchor="middle" font-size="12" fill="#1e40af">n = 2</text>
    <circle cx="267" cy="160" r="6" fill="#eab308"/>
    <circle cx="261" cy="144" r="6" fill="#eab308"/>
    <circle cx="245" cy="138" r="6" fill="#eab308"/>
    <circle cx="229" cy="144" r="6" fill="#eab308"/>
    <circle cx="223" cy="160" r="6" fill="#eab308"/>
    <circle cx="229" cy="176" r="6" fill="#eab308"/>
    <circle cx="245" cy="182" r="6" fill="#eab308"/>
    <circle cx="261" cy="176" r="6" fill="#eab308"/>
    <text x="245" y="220" text-anchor="middle" font-size="28" font-weight="bold" fill="#1e40af">8</text>

    <rect x="330" y="70" width="140" height="180" rx="10" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
    <text x="400" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400e">M shell</text>
    <text x="400" y="114" text-anchor="middle" font-size="12" fill="#92400e">n = 3</text>
    <circle cx="400" cy="126" r="6" fill="#eab308"/>
    <circle cx="400" cy="194" r="6" fill="#eab308"/>
    <circle cx="333" cy="160" r="6" fill="#eab308"/>
    <circle cx="467" cy="160" r="6" fill="#eab308"/>
    <circle cx="353" cy="139" r="6" fill="#eab308"/>
    <circle cx="447" cy="139" r="6" fill="#eab308"/>
    <circle cx="353" cy="181" r="6" fill="#eab308"/>
    <circle cx="447" cy="181" r="6" fill="#eab308"/>
    <circle cx="343" cy="155" r="6" fill="#eab308"/>
    <circle cx="457" cy="155" r="6" fill="#eab308"/>
    <circle cx="343" cy="165" r="6" fill="#eab308"/>
    <circle cx="457" cy="165" r="6" fill="#eab308"/>
    <text x="400" y="220" text-anchor="middle" font-size="28" font-weight="bold" fill="#92400e">18</text>

    <rect x="485" y="70" width="140" height="180" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="555" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#991b1b">N shell</text>
    <text x="555" y="114" text-anchor="middle" font-size="12" fill="#991b1b">n = 4</text>
    <circle cx="555" cy="126" r="6" fill="#eab308"/>
    <circle cx="555" cy="194" r="6" fill="#eab308"/>
    <circle cx="488" cy="160" r="6" fill="#eab308"/>
    <circle cx="622" cy="160" r="6" fill="#eab308"/>
    <circle cx="508" cy="139" r="6" fill="#eab308"/>
    <circle cx="602" cy="139" r="6" fill="#eab308"/>
    <circle cx="508" cy="181" r="6" fill="#eab308"/>
    <circle cx="602" cy="181" r="6" fill="#eab308"/>
    <text x="555" y="220" text-anchor="middle" font-size="28" font-weight="bold" fill="#991b1b">32</text>
  </g>

  <text x="320" y="276" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">2n² = 2, 8, 18, 32 electrons per shell</text>
  <text x="320" y="298" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">M shell can actually hold 18, though it is used first as 8</text>
  <text x="320" y="342" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Shells fill from the nucleus outwards; outer electrons decide chemical behaviour</text>
</svg>
