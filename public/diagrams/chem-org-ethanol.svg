<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#047857">Ethanol: CH₃–CH₂–OH</text>

  <g font-family="Arial, sans-serif">
    <line x1="250" y1="180" x2="330" y2="180" stroke="#475569" stroke-width="2.5"/>
    <line x1="250" y1="180" x2="250" y2="140" stroke="#475569" stroke-width="2"/>
    <line x1="250" y1="180" x2="250" y2="220" stroke="#475569" stroke-width="2"/>
    <line x1="250" y1="180" x2="215" y2="180" stroke="#475569" stroke-width="2"/>
    <line x1="330" y1="180" x2="330" y2="140" stroke="#475569" stroke-width="2"/>
    <line x1="330" y1="180" x2="330" y2="220" stroke="#475569" stroke-width="2"/>
    <line x1="330" y1="180" x2="375" y2="180" stroke="#c2410c" stroke-width="3"/>
    <circle cx="250" cy="180" r="6" fill="#334155"/>
    <circle cx="330" cy="180" r="6" fill="#334155"/>
    <circle cx="250" cy="134" r="3.5" fill="#16a34a"/>
    <circle cx="250" cy="226" r="3.5" fill="#16a34a"/>
    <circle cx="208" cy="180" r="3.5" fill="#16a34a"/>
    <circle cx="330" cy="134" r="3.5" fill="#16a34a"/>
    <circle cx="330" cy="226" r="3.5" fill="#16a34a"/>
    <circle cx="382" cy="180" r="4.5" fill="#dc2626"/>

    <text x="250" y="122" text-anchor="middle" font-size="12" fill="#334155">H</text>
    <text x="250" y="244" text-anchor="middle" font-size="12" fill="#334155">H</text>
    <text x="196" y="184" text-anchor="end" font-size="12" fill="#334155">H</text>
    <text x="330" y="122" text-anchor="middle" font-size="12" fill="#334155">H</text>
    <text x="330" y="244" text-anchor="middle" font-size="12" fill="#334155">H</text>
    <text x="392" y="184" font-size="13" fill="#991b1b" font-weight="bold">H</text>

    <rect x="430" y="120" width="150" height="52" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="505" y="143" text-anchor="middle" font-size="12.5" fill="#991b1b" font-weight="bold">hydroxyl group</text>
    <text x="505" y="161" text-anchor="middle" font-size="12.5" fill="#991b1b">–OH</text>

    <rect x="430" y="185" width="150" height="52" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="505" y="208" text-anchor="middle" font-size="12.5" fill="#1e40af" font-weight="bold">ethyl group</text>
    <text x="505" y="226" text-anchor="middle" font-size="12.5" fill="#1e40af">CH₃CH₂–</text>

    <text x="505" y="272" text-anchor="middle" font-size="12.5" fill="#334155">structural formula:</text>
    <text x="505" y="292" text-anchor="middle" font-size="12.5" fill="#334155" font-weight="bold">CH₃CH₂OH</text>
  </g>

  <rect x="110" y="320" width="420" height="30" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="320" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" fill="#166534">The polar –OH group makes ethanol mix with water and burn with a clean flame.</text>
</svg>
