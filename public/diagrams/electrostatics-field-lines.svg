<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#64748b"/></marker>
    <marker id="arA" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#c2410c"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#c2410c">Electric field lines</text>

  <g transform="translate(110,185)">
    <circle cx="0" cy="0" r="9" fill="#dc2626"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">+</text>
    <g stroke="#c2410c" stroke-width="1.6">
      <line x1="9" y1="0" x2="75" y2="0" marker-end="url(#arA)"/>
      <line x1="-9" y1="0" x2="-75" y2="0" marker-end="url(#arA)"/>
      <line x1="0" y1="9" x2="0" y2="75" marker-end="url(#arA)"/>
      <line x1="0" y1="-9" x2="0" y2="-75" marker-end="url(#arA)"/>
      <line x1="6.4" y1="6.4" x2="53" y2="53" marker-end="url(#arA)"/>
      <line x1="-6.4" y1="6.4" x2="-53" y2="53" marker-end="url(#arA)"/>
      <line x1="6.4" y1="-6.4" x2="53" y2="-53" marker-end="url(#arA)"/>
      <line x1="-6.4" y1="-6.4" x2="-53" y2="-53" marker-end="url(#arA)"/>
    </g>
    <text x="0" y="-95" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#334155">positive charge</text>
    <text x="0" y="-81" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#475569">lines point outward</text>
  </g>

  <g transform="translate(320,185)">
    <circle cx="0" cy="0" r="9" fill="#2563eb"/>
    <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">−</text>
    <g stroke="#2563eb" stroke-width="1.6">
      <line x1="9" y1="0" x2="75" y2="0" marker-end="url(#ar)"/>
      <line x1="-9" y1="0" x2="-75" y2="0" marker-end="url(#ar)"/>
      <line x1="0" y1="9" x2="0" y2="75" marker-end="url(#ar)"/>
      <line x1="0" y1="-9" x2="0" y2="-75" marker-end="url(#ar)"/>
      <line x1="6.4" y1="6.4" x2="53" y2="53" marker-end="url(#ar)"/>
      <line x1="-6.4" y1="6.4" x2="-53" y2="53" marker-end="url(#ar)"/>
      <line x1="6.4" y1="-6.4" x2="53" y2="-53" marker-end="url(#ar)"/>
      <line x1="-6.4" y1="-6.4" x2="-53" y2="-53" marker-end="url(#ar)"/>
    </g>
    <text x="0" y="-95" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#334155">negative charge</text>
    <text x="0" y="-81" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#475569">lines point inward</text>
  </g>

  <g transform="translate(525,185)">
    <circle cx="-35" cy="0" r="9" fill="#dc2626"/>
    <text x="-35" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">+</text>
    <circle cx="35" cy="0" r="9" fill="#2563eb"/>
    <text x="35" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">−</text>
    <g fill="none" stroke="#64748b" stroke-width="1.6">
      <path d="M-26,0 Q0,-40 26,0"/>
      <path d="M-26,0 Q0,-24 26,0"/>
      <path d="M-26,0 Q0,-12 26,0"/>
      <path d="M-26,0 Q0,12 26,0"/>
      <path d="M-26,0 Q0,24 26,0"/>
      <path d="M-26,0 Q0,40 26,0"/>
    </g>
    <text x="0" y="-95" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#334155">dipole</text>
    <text x="0" y="-81" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#475569">lines curve from + to −</text>
  </g>

  <text x="320" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Field lines start on positive charges and end on negative charges; they never cross, and dense lines mean a strong field.</text>
</svg>
