<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#64748b"/></marker>
    <marker id="arA" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#c2410c"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#c2410c">Lenses: convex and concave</text>

  <text x="160" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#334155">Convex lens — converges light</text>
  <line x1="70" y1="180" x2="300" y2="180" stroke="#64748b" stroke-width="1.5"/>
  <path d="M220,90 Q262,180 220,270 Q178,180 220,90 Z" fill="#bfdbfe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="220" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e40af">O</text>

  <line x1="70" y1="130" x2="218" y2="130" stroke="#c2410c" stroke-width="2.5" marker-end="url(#arA)"/>
  <line x1="222" y1="130" x2="300" y2="130" stroke="#c2410c" stroke-width="2.5" marker-end="url(#arA)"/>
  <line x1="70" y1="150" x2="218" y2="150" stroke="#c2410c" stroke-width="2.5" marker-end="url(#arA)"/>
  <line x1="222" y1="150" x2="300" y2="150" stroke="#c2410c" stroke-width="2.5" marker-end="url(#arA)"/>
  <text x="95" y="118" font-family="Arial, sans-serif" font-size="11" fill="#475569">parallel rays</text>
  <text x="255" y="118" font-family="Arial, sans-serif" font-size="11" fill="#475569">all meet at F</text>

  <circle cx="300" cy="180" r="3.5" fill="#c2410c"/>
  <text x="300" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#334155">F</text>
  <circle cx="140" cy="180" r="3.5" fill="#c2410c"/>
  <text x="140" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#334155">F</text>
  <text x="220" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#475569">thicker at the centre</text>
  <text x="180" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#475569">used in cameras, eyes, magnifiers</text>
  <text x="300" y="232" font-family="Arial, sans-serif" font-size="11" fill="#475569">real focus</text>

  <text x="500" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#334155">Concave lens — diverges light</text>
  <line x1="390" y1="180" x2="590" y2="180" stroke="#64748b" stroke-width="1.5"/>
  <path d="M440,110 Q482,180 440,250 Q398,180 440,110 Z" fill="#fecaca" stroke="#dc2626" stroke-width="2.5"/>
  <text x="440" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#991b1b">O</text>

  <line x1="390" y1="130" x2="438" y2="130" stroke="#c2410c" stroke-width="2.5" marker-end="url(#arA)"/>
  <line x1="442" y1="130" x2="560" y2="95" stroke="#c2410c" stroke-width="2.5" marker-end="url(#arA)"/>
  <line x1="390" y1="150" x2="438" y2="150" stroke="#c2410c" stroke-width="2.5" marker-end="url(#arA)"/>
  <line x1="442" y1="150" x2="560" y2="135" stroke="#c2410c" stroke-width="2.5" marker-end="url(#arA)"/>
  <line x1="500" y1="180" x2="470" y2="105" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="500" y1="180" x2="470" y2="139" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 4"/>
  <circle cx="500" cy="180" r="3.5" fill="#c2410c"/>
  <text x="500" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#334155">F</text>
  <text x="415" y="118" font-family="Arial, sans-serif" font-size="11" fill="#475569">parallel rays</text>
  <text x="470" y="100" font-family="Arial, sans-serif" font-size="11" fill="#475569">spread apart</text>
  <text x="440" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#475569">thinner at the centre</text>
  <text x="500" y="232" font-family="Arial, sans-serif" font-size="11" fill="#475569">virtual focus</text>
  <text x="500" y="246" font-family="Arial, sans-serif" font-size="11" fill="#475569">(dashed rays only appear</text>
  <text x="500" y="260" font-family="Arial, sans-serif" font-size="11" fill="#475569">to come from F)</text>

  <rect x="100" y="300" width="440" height="30" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="320" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#166534">O = optical centre — a ray through the centre passes straight through without bending</text>

  <text x="320" y="352" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#64748b">Convex lenses bend parallel rays to a real focus; concave lenses spread them from a virtual focus.</text>
</svg>
