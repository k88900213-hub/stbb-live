<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#64748b"/></marker>
    <marker id="arA" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#c2410c"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="26" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#0369a1">The endocrine glands of the human body</text>

  <circle cx="320" cy="62" r="30" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <rect x="310" y="90" width="20" height="22" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <path d="M268,112 Q240,120 235,160 L235,240 Q235,280 265,285 L375,285 Q405,280 405,240 L405,160 Q400,120 372,112 Q320,130 268,112 Z" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <line x1="300" y1="285" x2="300" y2="318" stroke="#b45309" stroke-width="8"/>
  <line x1="340" y1="285" x2="340" y2="318" stroke="#b45309" stroke-width="8"/>
  <text x="320" y="338" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#334155">lower abdomen (ovaries in female, testes in male)</text>

  <circle cx="320" cy="62" r="5" fill="#dc2626"/>
  <line x1="322" y1="64" x2="400" y2="52" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="404" y="48" font-family="Arial, sans-serif" font-size="12" fill="#334155">pituitary</text>
  <text x="404" y="62" font-family="Arial, sans-serif" font-size="12" fill="#334155">(master gland)</text>

  <ellipse cx="312" cy="120" rx="12" ry="7" fill="#fecaca" stroke="#dc2626" stroke-width="1.5"/>
  <ellipse cx="330" cy="120" rx="12" ry="7" fill="#fecaca" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="342" y1="120" x2="430" y2="112" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="434" y="108" font-family="Arial, sans-serif" font-size="12" fill="#334155">thyroid</text>
  <text x="434" y="122" font-family="Arial, sans-serif" font-size="12" fill="#334155">parathyroids (behind)</text>

  <path d="M250,160 L258,150 L266,160 Z" fill="#fecaca" stroke="#dc2626" stroke-width="1.5"/>
  <path d="M372,160 L380,150 L388,160 Z" fill="#fecaca" stroke="#dc2626" stroke-width="1.5"/>
  <ellipse cx="258" cy="182" rx="12" ry="16" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
  <ellipse cx="380" cy="182" rx="12" ry="16" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
  <line x1="392" y1="168" x2="470" y2="150" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="474" y="146" font-family="Arial, sans-serif" font-size="12" fill="#334155">adrenal</text>
  <text x="474" y="160" font-family="Arial, sans-serif" font-size="12" fill="#334155">glands (on kidneys)</text>

  <path d="M285,215 C305,205 335,205 355,215 C345,228 315,228 285,215 Z" fill="#fecaca" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="357" y1="218" x2="430" y2="218" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="434" y="222" font-family="Arial, sans-serif" font-size="12" fill="#334155">pancreas</text>

  <circle cx="295" cy="280" r="8" fill="#fca5a5" stroke="#dc2626" stroke-width="1.5"/>
  <circle cx="345" cy="280" r="8" fill="#fca5a5" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="353" y1="280" x2="430" y2="295" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="434" y="299" font-family="Arial, sans-serif" font-size="12" fill="#334155">gonads</text>

  <text x="320" y="352" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">endocrine (ductless) glands pour their hormones straight into the blood, which carries them to target tissues</text>
</svg>
