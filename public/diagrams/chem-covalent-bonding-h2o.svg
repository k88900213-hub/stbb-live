<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#047857">Covalent bonding in the water molecule</text>

  <g font-family="Arial, sans-serif">
    <circle cx="320" cy="190" r="30" fill="#fecaca" stroke="#dc2626" stroke-width="2"/>
    <text x="320" y="196" text-anchor="middle" font-size="16" font-weight="bold" fill="#991b1b">O</text>
    <circle cx="245" cy="105" r="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="245" y="111" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">H</text>
    <circle cx="395" cy="105" r="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="395" y="111" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">H</text>

    <line x1="263" y1="166" x2="267" y2="127" stroke="#475569" stroke-width="4"/>
    <line x1="377" y1="166" x2="373" y2="127" stroke="#475569" stroke-width="4"/>
    <circle cx="262" cy="146" r="4" fill="#eab308"/>
    <circle cx="268" cy="146" r="4" fill="#eab308"/>
    <circle cx="376" cy="146" r="4" fill="#eab308"/>
    <circle cx="382" cy="146" r="4" fill="#eab308"/>
    <text x="286" y="128" font-size="12" fill="#047857">shared pair</text>
    <text x="286" y="144" font-size="12" fill="#047857">= covalent bond</text>
    <text x="330" y="128" font-size="12" fill="#047857">shared pair</text>

    <path d="M268,166 A48,48 0 0 1 372,166" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="320" y="238" text-anchor="middle" font-size="13" fill="#475569">bond angle ≈ 104.5°</text>

    <circle cx="352" cy="212" r="4" fill="#eab308"/>
    <circle cx="360" cy="216" r="4" fill="#eab308"/>
    <circle cx="288" cy="212" r="4" fill="#eab308"/>
    <circle cx="280" cy="216" r="4" fill="#eab308"/>
    <circle cx="320" cy="228" r="4" fill="#eab308"/>
    <circle cx="320" cy="236" r="4" fill="#eab308"/>
    <text x="362" y="238" font-size="11" fill="#475569">lone pairs</text>
  </g>

  <text x="320" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">Each hydrogen shares its single electron with oxygen</text>
  <text x="320" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">Oxygen reaches 8, each hydrogen reaches 2</text>
  <text x="320" y="344" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Shared electron pairs are covalent bonds — the glue of the molecule</text>
</svg>
