<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#047857">Acid-base indicators change colour with pH</text>

  <g font-family="Arial, sans-serif">
    <text x="90" y="105" font-size="14" font-weight="bold" fill="#334155">Litmus</text>
    <rect x="250" y="88" width="110" height="34" rx="6" fill="#dc2626" stroke="#991b1b" stroke-width="1.5"/>
    <text x="305" y="110" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold">red in acid</text>
    <rect x="390" y="88" width="110" height="34" rx="6" fill="#2563eb" stroke="#1e40af" stroke-width="1.5"/>
    <text x="445" y="110" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold">blue in base</text>

    <text x="90" y="190" font-size="14" font-weight="bold" fill="#334155">Methyl orange</text>
    <rect x="250" y="173" width="110" height="34" rx="6" fill="#f87171" stroke="#991b1b" stroke-width="1.5"/>
    <text x="305" y="195" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold">red (pH &lt; 4)</text>
    <rect x="390" y="173" width="110" height="34" rx="6" fill="#facc15" stroke="#92400e" stroke-width="1.5"/>
    <text x="445" y="195" text-anchor="middle" font-size="13" fill="#78350f" font-weight="bold">yellow (pH &gt; 4)</text>

    <text x="90" y="275" font-size="14" font-weight="bold" fill="#334155">Phenolphthalein</text>
    <rect x="250" y="258" width="110" height="34" rx="6" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
    <text x="305" y="280" text-anchor="middle" font-size="13" fill="#334155" font-weight="bold">colourless</text>
    <rect x="390" y="258" width="110" height="34" rx="6" fill="#f472b6" stroke="#be185d" stroke-width="1.5"/>
    <text x="445" y="280" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold">pink (pH &gt; 9)</text>
  </g>

  <rect x="110" y="316" width="420" height="30" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="320" y="336" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" fill="#166534">In a titration, choose the indicator that changes colour at the equivalence point.</text>
</svg>
