<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#047857">The reactivity series of metals</text>

  <g font-family="Arial, sans-serif">
    <text x="180" y="52" text-anchor="middle" font-size="12" font-weight="bold" fill="#dc2626">most reactive</text>
    <line x1="290" y1="66" x2="290" y2="314" stroke="#475569" stroke-width="2"/>

    <text x="120" y="92" text-anchor="end" font-size="14" font-weight="bold" fill="#dc2626">K</text>
    <rect x="190" y="80" width="200" height="16" rx="4" fill="#dc2626"/>
    <text x="300" y="92" text-anchor="middle" font-size="11" fill="#334155">potassium</text>

    <text x="120" y="112" text-anchor="end" font-size="14" font-weight="bold" fill="#dc2626">Na</text>
    <rect x="190" y="100" width="185" height="16" rx="4" fill="#ea580c"/>
    <text x="300" y="112" text-anchor="middle" font-size="11" fill="#334155">sodium</text>

    <text x="120" y="132" text-anchor="end" font-size="14" font-weight="bold" fill="#ea580c">Ca</text>
    <rect x="190" y="120" width="170" height="16" rx="4" fill="#f59e0b"/>
    <text x="300" y="132" text-anchor="middle" font-size="11" fill="#334155">calcium</text>

    <text x="120" y="152" text-anchor="end" font-size="14" font-weight="bold" fill="#f59e0b">Mg</text>
    <rect x="190" y="140" width="155" height="16" rx="4" fill="#ca8a04"/>
    <text x="300" y="152" text-anchor="middle" font-size="11" fill="#334155">magnesium</text>

    <text x="120" y="172" text-anchor="end" font-size="14" font-weight="bold" fill="#ca8a04">Al</text>
    <rect x="190" y="160" width="140" height="16" rx="4" fill="#65a30d"/>
    <text x="300" y="172" text-anchor="middle" font-size="11" fill="#334155">aluminium</text>

    <text x="120" y="192" text-anchor="end" font-size="14" font-weight="bold" fill="#65a30d">Zn</text>
    <rect x="190" y="180" width="125" height="16" rx="4" fill="#059669"/>
    <text x="300" y="192" text-anchor="middle" font-size="11" fill="#334155">zinc</text>

    <text x="120" y="212" text-anchor="end" font-size="14" font-weight="bold" fill="#059669">Fe</text>
    <rect x="190" y="200" width="110" height="16" rx="4" fill="#0d9488"/>
    <text x="300" y="212" text-anchor="middle" font-size="11" fill="#334155">iron</text>

    <text x="120" y="232" text-anchor="end" font-size="14" font-weight="bold" fill="#0d9488">Pb</text>
    <rect x="190" y="220" width="95" height="16" rx="4" fill="#0284c7"/>
    <text x="300" y="232" text-anchor="middle" font-size="11" fill="#334155">lead</text>

    <line x1="180" y1="244" x2="300" y2="244" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="320" y="247" font-size="11" fill="#475569">hydrogen level: above reacts with acids</text>

    <text x="120" y="262" text-anchor="end" font-size="14" font-weight="bold" fill="#0284c7">Cu</text>
    <rect x="190" y="250" width="80" height="16" rx="4" fill="#475569"/>
    <text x="300" y="262" text-anchor="middle" font-size="11" fill="#334155">copper</text>

    <text x="120" y="282" text-anchor="end" font-size="14" font-weight="bold" fill="#475569">Ag</text>
    <rect x="190" y="270" width="65" height="16" rx="4" fill="#64748b"/>
    <text x="300" y="282" text-anchor="middle" font-size="11" fill="#334155">silver</text>

    <text x="120" y="302" text-anchor="end" font-size="14" font-weight="bold" fill="#475569">Au</text>
    <rect x="190" y="290" width="50" height="16" rx="4" fill="#94a3b8"/>
    <text x="300" y="302" text-anchor="middle" font-size="11" fill="#334155">gold</text>

    <text x="180" y="328" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">least reactive</text>
  </g>

  <text x="320" y="352" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">The higher a metal in the series, the more eagerly it loses electrons</text>
</svg>
