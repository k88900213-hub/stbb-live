<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#047857"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#047857">Bohr model of a sodium atom (2, 8, 1)</text>

  <g font-family="Arial, sans-serif">
    <circle cx="320" cy="190" r="140" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
    <circle cx="320" cy="190" r="90" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
    <circle cx="320" cy="190" r="44" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>

    <circle cx="320" cy="190" r="16" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="320" y="195" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">11p 12n</text>

    <circle cx="320" cy="146" r="5" fill="#eab308"/>
    <circle cx="320" cy="234" r="5" fill="#eab308"/>

    <circle cx="410" cy="190" r="5" fill="#eab308"/>
    <circle cx="384" cy="126" r="5" fill="#eab308"/>
    <circle cx="320" cy="100" r="5" fill="#eab308"/>
    <circle cx="256" cy="126" r="5" fill="#eab308"/>
    <circle cx="230" cy="190" r="5" fill="#eab308"/>
    <circle cx="256" cy="254" r="5" fill="#eab308"/>
    <circle cx="320" cy="280" r="5" fill="#eab308"/>
    <circle cx="384" cy="254" r="5" fill="#eab308"/>

    <circle cx="180" cy="190" r="5" fill="#eab308"/>
  </g>

  <text x="452" y="106" font-family="Arial, sans-serif" font-size="13" fill="#334155">L shell (8 e⁻)</text>
  <text x="200" y="112" font-family="Arial, sans-serif" font-size="13" fill="#334155">K shell (2 e⁻)</text>
  <text x="98" y="200" font-family="Arial, sans-serif" font-size="13" fill="#334155">M shell</text>
  <text x="98" y="216" font-family="Arial, sans-serif" font-size="13" fill="#334155">(1 e⁻)</text>
  <path d="M196,228 C150,252 150,292 200,312" stroke="#047857" stroke-width="2" fill="none" marker-end="url(#arG)"/>
  <text x="205" y="332" font-family="Arial, sans-serif" font-size="13" fill="#047857">lose 1 e⁻ → Na⁺</text>

  <text x="320" y="354" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">The loosely held outer electron makes sodium highly reactive</text>
</svg>
