<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#c2410c">Power = work done per second</text>
  <g transform="translate(90,80)">
    <line x1="30" y1="220" x2="520" y2="220" stroke="#475569" stroke-width="2"/>
    <line x1="30" y1="220" x2="30" y2="30" stroke="#475569" stroke-width="2"/>
    <text x="270" y="244" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#334155">time (s)</text>
    <text x="12" y="55" transform="rotate(-90,12,140)" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#334155">work (J)</text>
    <g stroke="#94a3b8" stroke-width="1">
      <line x1="30" y1="160" x2="520" y2="160"/><line x1="30" y1="100" x2="520" y2="100"/>
      <line x1="180" y1="30" x2="180" y2="220"/><line x1="330" y1="30" x2="330" y2="220"/><line x1="480" y1="30" x2="480" y2="220"/>
    </g>
    <line x1="30" y1="220" x2="480" y2="60" stroke="#c2410c" stroke-width="3.5"/>
    <text x="330" y="120" font-family="Arial, sans-serif" font-size="12.5" fill="#c2410c">steeper slope = more work per second</text>
    <text x="330" y="138" font-family="Arial, sans-serif" font-size="12.5" fill="#c2410c">= greater power</text>
  </g>
  <rect x="120" y="280" width="400" height="44" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="320" y="308" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#166534">P = W/t · unit watt (W) = J/s · 1 horsepower ≈ 746 W</text>
</svg>
