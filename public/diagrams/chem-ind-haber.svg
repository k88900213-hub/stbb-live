<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#64748b"/></marker>
    <marker id="arA" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#c2410c"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#047857">The Haber process: fixing nitrogen from the air</text>

  <g font-family="Arial, sans-serif">
    <rect x="30" y="100" width="120" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="90" y="128" text-anchor="middle" font-size="12" fill="#1e40af" font-weight="bold">N₂ from air</text>
    <text x="90" y="146" text-anchor="middle" font-size="10.5" fill="#1e40af">78% of the atmosphere</text>

    <rect x="30" y="190" width="120" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="90" y="218" text-anchor="middle" font-size="12" fill="#1e40af" font-weight="bold">H₂ from natural gas</text>
    <text x="90" y="236" text-anchor="middle" font-size="10.5" fill="#1e40af">steam reforming</text>

    <rect x="210" y="145" width="120" height="60" rx="8" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
    <text x="270" y="173" text-anchor="middle" font-size="12" fill="#92400e" font-weight="bold">compressor</text>
    <text x="270" y="191" text-anchor="middle" font-size="10.5" fill="#92400e">200 atm</text>

    <rect x="390" y="145" width="120" height="60" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="450" y="170" text-anchor="middle" font-size="12" fill="#991b1b" font-weight="bold">reactor</text>
    <text x="450" y="188" text-anchor="middle" font-size="10.5" fill="#991b1b">Fe catalyst, 450 °C</text>
    <text x="450" y="202" text-anchor="middle" font-size="10.5" fill="#991b1b">N₂ + 3H₂ ⇌ 2NH₃</text>

    <rect x="520" y="145" width="90" height="60" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
    <text x="565" y="173" text-anchor="middle" font-size="12" fill="#166534" font-weight="bold">condenser</text>
    <text x="565" y="191" text-anchor="middle" font-size="10.5" fill="#166534">NH₃(l) out</text>
  </g>

  <line x1="150" y1="130" x2="208" y2="170" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="150" y1="220" x2="208" y2="190" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="330" y1="175" x2="388" y2="175" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="510" y1="175" x2="518" y2="175" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>

  <path d="M565,145 C565,80 270,80 270,143" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arA)"/>
  <text x="400" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#c2410c">unreacted N₂ and H₂ recycled</text>

  <rect x="110" y="280" width="420" height="34" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="320" y="301" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" fill="#166534">High pressure and the iron catalyst push the equilibrium toward ammonia.</text>

  <rect x="110" y="324" width="420" height="28" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="320" y="343" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" fill="#166534">Removing product continuously pulls the equilibrium forward — Le Chatelier in action.</text>
</svg>
