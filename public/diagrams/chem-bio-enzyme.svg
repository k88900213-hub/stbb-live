<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#64748b"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#047857">Enzymes: the substrate fits the active site</text>

  <rect x="40" y="90" width="150" height="90" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="115" y="142" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1e40af">enzyme</text>
  <path d="M100,180 C100,150 130,150 130,150 C130,150 160,150 160,175" fill="none" stroke="#1e40af" stroke-width="2.5"/>
  <text x="115" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" fill="#1e40af">active site</text>

  <polygon points="205,130 235,130 220,155" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
  <text x="220" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#92400e">substrate</text>

  <line x1="250" y1="135" x2="290" y2="135" stroke="#c2410c" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="270" y="122" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#c2410c">binds</text>

  <rect x="305" y="90" width="150" height="90" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="380" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#991b1b">enzyme–substrate</text>
  <text x="380" y="136" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#991b1b">complex</text>
  <polygon points="340,150 365,150 352,168" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>

  <line x1="470" y1="135" x2="510" y2="135" stroke="#c2410c" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="490" y="122" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#c2410c">product</text>

  <rect x="525" y="100" width="85" height="34" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="567" y="121" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#166534">product</text>
  <rect x="525" y="145" width="85" height="34" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="567" y="166" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#166534">enzyme (reused)</text>

  <rect x="110" y="220" width="420" height="60" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="320" y="244" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" fill="#166534">Lock-and-key: the active site is shaped for one substrate,</text>
  <text x="320" y="264" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" fill="#166534">so enzymes are specific — and unchanged after the reaction.</text>

  <rect x="110" y="300" width="420" height="34" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="320" y="322" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" fill="#166534">Denaturation at high temperature or wrong pH destroys the active site's shape.</text>
</svg>
