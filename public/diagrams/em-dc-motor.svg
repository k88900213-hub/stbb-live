<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#64748b"/></marker>
    <marker id="arA" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#c2410c"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#c2410c">A simple DC motor</text>

  <rect x="90" y="130" width="60" height="110" rx="6" fill="#dc2626"/>
  <text x="120" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">N</text>
  <text x="120" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#ffffff">magnet</text>
  <rect x="490" y="130" width="60" height="110" rx="6" fill="#2563eb"/>
  <text x="520" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">S</text>
  <text x="520" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#ffffff">magnet</text>

  <rect x="250" y="160" width="140" height="60" rx="6" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
  <line x1="250" y1="160" x2="250" y2="220" stroke="#92400e" stroke-width="2"/>
  <line x1="390" y1="160" x2="390" y2="220" stroke="#92400e" stroke-width="2"/>
  <text x="320" y="196" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#92400e">armature coil</text>
  <line x1="290" y1="190" x2="290" y2="130" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="350" y1="190" x2="350" y2="130" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
  <text x="320" y="118" font-family="Arial, sans-serif" font-size="11" fill="#475569">force turns the coil (motor effect)</text>

  <path d="M250,220 L240,250 M250,220 L320,255 M390,220 L400,250 M390,220 L320,255" fill="none" stroke="#475569" stroke-width="3"/>
  <circle cx="320" cy="255" r="10" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <line x1="320" y1="255" x2="320" y2="232" stroke="#475569" stroke-width="2"/>
  <rect x="312" y="226" width="8" height="12" fill="#cbd5e1" stroke="#475569" stroke-width="1"/>
  <text x="320" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#334155">split-ring commutator</text>

  <rect x="298" y="278" width="7" height="22" fill="#94a3b8"/>
  <rect x="335" y="278" width="7" height="22" fill="#94a3b8"/>
  <text x="300" y="318" font-family="Arial, sans-serif" font-size="11" fill="#475569">brushes</text>
  <text x="348" y="318" font-family="Arial, sans-serif" font-size="11" fill="#475569">brushes</text>

  <rect x="255" y="325" width="22" height="10" fill="#dc2626"/>
  <rect x="300" y="325" width="22" height="10" fill="#475569"/>
  <text x="322" y="346" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#334155">to battery</text>

  <rect x="430" y="270" width="150" height="40" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="505" y="286" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#166534">The commutator swaps the</text>
  <text x="505" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#166534">connections every half turn,</text>
  <text x="505" y="314" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#166534">so the coil keeps spinning.</text>

  <text x="320" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">The coil turns in the magnetic field; the split-ring commutator reverses the current each half turn.</text>
</svg>
