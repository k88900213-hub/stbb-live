<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#c2410c">Mass vs weight</text>
  <g transform="translate(80,80)">
    <rect x="0" y="0" width="220" height="210" rx="12" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
    <text x="110" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#92400e">MASS</text>
    <text x="18" y="60" font-family="Arial, sans-serif" font-size="12.5" fill="#334155">· amount of matter (kg)</text>
    <text x="18" y="84" font-family="Arial, sans-serif" font-size="12.5" fill="#334155">· the same everywhere</text>
    <text x="18" y="108" font-family="Arial, sans-serif" font-size="12.5" fill="#334155">· measured with a balance</text>
    <text x="18" y="132" font-family="Arial, sans-serif" font-size="12.5" fill="#334155">· a scalar quantity</text>
    <rect x="255" y="0" width="220" height="210" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="365" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e40af">WEIGHT</text>
    <text x="273" y="60" font-family="Arial, sans-serif" font-size="12.5" fill="#1e293b">· gravitational pull (N)</text>
    <text x="273" y="84" font-family="Arial, sans-serif" font-size="12.5" fill="#1e293b">· changes where g changes</text>
    <text x="273" y="108" font-family="Arial, sans-serif" font-size="12.5" fill="#1e293b">· measured with a spring scale</text>
    <text x="273" y="132" font-family="Arial, sans-serif" font-size="12.5" fill="#1e293b">· a vector (towards Earth)</text>
  </g>
  <text x="320" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#9a3412">W = mg · on the Moon g is 1/6 of Earth's, so weight is 1/6 — mass does not change</text>
</svg>
