<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#64748b"/></marker>
    <marker id="arA" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#c2410c"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="26" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#0369a1">Gas exchange at the alveolus</text>

  <ellipse cx="250" cy="205" rx="82" ry="72" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <ellipse cx="250" cy="205" rx="70" ry="60" fill="none" stroke="#fda4af" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="250" y="208" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#991b1b">air space</text>
  <text x="250" y="226" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#991b1b">(O₂-rich)</text>

  <line x1="120" y1="110" x2="380" y2="110" stroke="#be123c" stroke-width="16"/>
  <ellipse cx="170" cy="110" rx="10" ry="6" fill="#881337"/>
  <ellipse cx="205" cy="110" rx="10" ry="6" fill="#881337"/>
  <ellipse cx="240" cy="110" rx="10" ry="6" fill="#881337"/>
  <ellipse cx="275" cy="110" rx="10" ry="6" fill="#881337"/>
  <ellipse cx="310" cy="110" rx="10" ry="6" fill="#881337"/>
  <ellipse cx="345" cy="110" rx="10" ry="6" fill="#881337"/>
  <text x="250" y="96" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155">pulmonary capillary (red blood cells inside)</text>

  <line x1="252" y1="150" x2="252" y2="116" stroke="#c2410c" stroke-width="2" marker-end="url(#arA)"/>
  <text x="262" y="140" font-family="Arial, sans-serif" font-size="13" fill="#c2410c">O₂ in</text>
  <line x1="302" y1="116" x2="302" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
  <text x="312" y="140" font-family="Arial, sans-serif" font-size="13" fill="#334155">CO₂ out</text>

  <text x="118" y="292" font-family="Arial, sans-serif" font-size="12" fill="#334155">alveolus wall:</text>
  <text x="118" y="308" font-family="Arial, sans-serif" font-size="12" fill="#334155">one cell thick</text>
  <line x1="152" y1="286" x2="190" y2="266" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3"/>

  <text x="352" y="196" font-family="Arial, sans-serif" font-size="12" fill="#334155">surfactant lining</text>
  <text x="352" y="212" font-family="Arial, sans-serif" font-size="12" fill="#334155">stops collapse</text>
  <line x1="348" y1="205" x2="322" y2="205" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3"/>

  <rect x="440" y="56" width="172" height="150" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <ellipse cx="526" cy="112" rx="30" ry="13" fill="#be123c"/>
  <text x="526" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155">red blood cell</text>
  <text x="526" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155">haemoglobin + O₂</text>
  <text x="526" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155">= oxyhaemoglobin</text>

  <text x="320" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">O₂ and CO₂ diffuse across walls that are only one cell thick</text>
</svg>
