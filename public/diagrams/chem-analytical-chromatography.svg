<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#64748b"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#047857">Paper chromatography separates a mixture</text>

  <path d="M80,90 L80,260 Q80,280 100,280 L220,280 Q240,280 240,260 L240,90 Z" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <line x1="100" y1="250" x2="220" y2="250" stroke="#0369a1" stroke-width="2"/>
  <text x="160" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#075985">solvent</text>

  <rect x="140" y="80" width="40" height="180" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <line x1="145" y1="70" x2="145" y2="252" stroke="#475569" stroke-width="1"/>
  <text x="185" y="78" font-family="Arial, sans-serif" font-size="10.5" fill="#334155">solvent</text>
  <text x="185" y="92" font-family="Arial, sans-serif" font-size="10.5" fill="#334155">front</text>

  <g>
    <circle cx="160" cy="150" r="5" fill="#dc2626"/>
    <circle cx="160" cy="175" r="5" fill="#2563eb"/>
    <circle cx="160" cy="200" r="5" fill="#16a34a"/>
  </g>
  <text x="172" y="160" font-family="Arial, sans-serif" font-size="11" fill="#334155">separated components</text>

  <circle cx="160" cy="248" r="6" fill="#7c3aed"/>
  <text x="174" y="252" font-family="Arial, sans-serif" font-size="11" fill="#334155">ink spot (origin)</text>

  <text x="320" y="125" font-family="Arial, sans-serif" font-size="12.5" fill="#475569" font-weight="bold">Rf = distance moved by spot / distance moved by solvent</text>
  <text x="320" y="150" font-family="Arial, sans-serif" font-size="11.5" fill="#64748b">each substance has a characteristic Rf under fixed conditions</text>

  <rect x="300" y="180" width="260" height="70" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="430" y="208" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" fill="#166534">mobile phase = solvent (carries)</text>
  <text x="430" y="228" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" fill="#166534">stationary phase = paper (holds back)</text>

  <rect x="110" y="316" width="420" height="30" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="320" y="336" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" fill="#166534">Components travel at different speeds — more soluble ones move furthest up the paper.</text>
</svg>
