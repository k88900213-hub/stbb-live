<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#64748b"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#c2410c">Distance-time graphs</text>
  <g transform="translate(70,60)">
    <line x1="0" y1="240" x2="520" y2="240" stroke="#475569" stroke-width="2"/>
    <line x1="0" y1="240" x2="0" y2="20" stroke="#475569" stroke-width="2"/>
    <text x="250" y="262" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#334155">time (s)</text>
    <text x="-10" y="55" transform="rotate(-90,-10,140)" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#334155">distance (m)</text>
    <g stroke="#94a3b8" stroke-width="1">
      <line x1="0" y1="180" x2="520" y2="180"/><line x1="0" y1="120" x2="520" y2="120"/><line x1="0" y1="60" x2="520" y2="60"/>
      <line x1="130" y1="20" x2="130" y2="240"/><line x1="260" y1="20" x2="260" y2="240"/><line x1="390" y1="20" x2="390" y2="240"/>
    </g>
    <line x1="0" y1="240" x2="390" y2="30" stroke="#16a34a" stroke-width="3"/>
    <text x="300" y="120" font-family="Arial, sans-serif" font-size="12.5" fill="#16a34a">A: constant speed — straight line</text>
    <polyline points="0,240 130,240 130,120 260,120 260,40 390,40" fill="none" stroke="#c2410c" stroke-width="3" stroke-linejoin="round"/>
    <text x="40" y="300" font-family="Arial, sans-serif" font-size="12.5" fill="#c2410c">B: rest (flat) then motion (steeper = faster)</text>
    <path d="M0,240 Q130,190 260,110 T520,20" fill="none" stroke="#7c3aed" stroke-width="3"/>
    <text x="300" y="320" font-family="Arial, sans-serif" font-size="12.5" fill="#7c3aed">C: accelerating — curve, slope grows</text>
  </g>
  <text x="320" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">slope of the graph = speed</text>
</svg>
