<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#64748b"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#047857">Neutralisation: acid + base → salt + water</text>

  <path d="M90,90 L90,210 Q90,230 110,230 L190,230 Q210,230 210,210 L210,90 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="150" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e40af">HCl</text>
  <g font-family="Arial, sans-serif" font-size="11" fill="#1e40af">
    <circle cx="122" cy="175" r="3" fill="#2563eb"/><text x="130" y="179">H⁺</text>
    <circle cx="168" cy="190" r="3" fill="#2563eb"/><text x="176" y="194">Cl⁻</text>
  </g>
  <text x="150" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" fill="#334155">acid</text>

  <line x1="245" y1="160" x2="290" y2="160" stroke="#c2410c" stroke-width="3" marker-end="url(#ar)"/>
  <text x="268" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" fill="#c2410c" font-weight="bold">mix</text>

  <path d="M310,90 L310,210 Q310,230 330,230 L410,230 Q430,230 430,210 L430,90 Z" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="370" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#991b1b">NaOH</text>
  <g font-family="Arial, sans-serif" font-size="11" fill="#991b1b">
    <circle cx="342" cy="175" r="3" fill="#dc2626"/><text x="350" y="179">Na⁺</text>
    <circle cx="388" cy="190" r="3" fill="#dc2626"/><text x="396" y="194">OH⁻</text>
  </g>
  <text x="370" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" fill="#334155">base</text>

  <line x1="465" y1="160" x2="510" y2="160" stroke="#c2410c" stroke-width="3" marker-end="url(#ar)"/>
  <text x="488" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" fill="#c2410c" font-weight="bold">mix</text>

  <path d="M530,90 L530,210 Q530,230 550,230 L610,230 Q630,230 630,210 L630,90 Z" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="580" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#166534">NaCl + H₂O</text>
  <g font-family="Arial, sans-serif" font-size="11" fill="#166534">
    <circle cx="560" cy="180" r="3" fill="#16a34a"/><text x="568" y="184">salt</text>
    <circle cx="600" cy="198" r="3" fill="#16a34a"/><text x="608" y="202">water</text>
  </g>
  <text x="580" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" fill="#334155">neutral solution</text>

  <rect x="110" y="316" width="420" height="30" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="320" y="336" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" fill="#166534">The essential reaction is H⁺ + OH⁻ → H₂O; the leftover ions form the salt.</text>
</svg>
