<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#047857">Lewis dot structures: single, double and triple bonds</text>

  <g font-family="Arial, sans-serif">
    <rect x="20" y="70" width="140" height="180" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
    <text x="90" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">Hydrogen H₂</text>
    <text x="75" y="170" text-anchor="middle" font-size="26" font-weight="bold" fill="#166534">H</text>
    <text x="105" y="170" text-anchor="middle" font-size="26" font-weight="bold" fill="#166534">H</text>
    <circle cx="88" cy="170" r="2.5" fill="#eab308"/>
    <circle cx="92" cy="170" r="2.5" fill="#eab308"/>
    <text x="90" y="225" text-anchor="middle" font-size="12" fill="#166534">single bond (1 pair)</text>

    <rect x="175" y="70" width="140" height="180" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="245" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">Chlorine Cl₂</text>
    <text x="230" y="175" text-anchor="middle" font-size="24" font-weight="bold" fill="#1e40af">Cl</text>
    <text x="260" y="175" text-anchor="middle" font-size="24" font-weight="bold" fill="#1e40af">Cl</text>
    <circle cx="243" cy="170" r="2.5" fill="#eab308"/>
    <circle cx="247" cy="170" r="2.5" fill="#eab308"/>
    <circle cx="222" cy="150" r="2.5" fill="#eab308"/>
    <circle cx="222" cy="180" r="2.5" fill="#eab308"/>
    <circle cx="212" cy="170" r="2.5" fill="#eab308"/>
    <circle cx="268" cy="150" r="2.5" fill="#eab308"/>
    <circle cx="268" cy="180" r="2.5" fill="#eab308"/>
    <circle cx="278" cy="170" r="2.5" fill="#eab308"/>
    <text x="245" y="225" text-anchor="middle" font-size="12" fill="#1e40af">single bond (1 pair)</text>

    <rect x="330" y="70" width="140" height="180" rx="10" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
    <text x="400" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400e">Oxygen O₂</text>
    <text x="388" y="175" text-anchor="middle" font-size="24" font-weight="bold" fill="#92400e">O</text>
    <text x="412" y="175" text-anchor="middle" font-size="24" font-weight="bold" fill="#92400e">O</text>
    <circle cx="397" cy="166" r="2.5" fill="#eab308"/>
    <circle cx="403" cy="166" r="2.5" fill="#eab308"/>
    <circle cx="397" cy="174" r="2.5" fill="#eab308"/>
    <circle cx="403" cy="174" r="2.5" fill="#eab308"/>
    <circle cx="380" cy="165" r="2.5" fill="#eab308"/>
    <circle cx="380" cy="175" r="2.5" fill="#eab308"/>
    <circle cx="420" cy="165" r="2.5" fill="#eab308"/>
    <circle cx="420" cy="175" r="2.5" fill="#eab308"/>
    <text x="400" y="225" text-anchor="middle" font-size="12" fill="#92400e">double bond (2 pairs)</text>

    <rect x="485" y="70" width="140" height="180" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="555" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#991b1b">Nitrogen N₂</text>
    <text x="543" y="175" text-anchor="middle" font-size="24" font-weight="bold" fill="#991b1b">N</text>
    <text x="567" y="175" text-anchor="middle" font-size="24" font-weight="bold" fill="#991b1b">N</text>
    <circle cx="552" cy="164" r="2.5" fill="#eab308"/>
    <circle cx="558" cy="164" r="2.5" fill="#eab308"/>
    <circle cx="552" cy="171" r="2.5" fill="#eab308"/>
    <circle cx="558" cy="171" r="2.5" fill="#eab308"/>
    <circle cx="552" cy="178" r="2.5" fill="#eab308"/>
    <circle cx="558" cy="178" r="2.5" fill="#eab308"/>
    <circle cx="535" cy="170" r="2.5" fill="#eab308"/>
    <circle cx="575" cy="170" r="2.5" fill="#eab308"/>
    <text x="555" y="225" text-anchor="middle" font-size="12" fill="#991b1b">triple bond (3 pairs)</text>
  </g>

  <text x="320" y="276" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">Dots are valence electrons; a shared pair is a bond</text>
  <text x="320" y="296" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">More shared pairs mean a shorter, stronger bond</text>
  <text x="320" y="344" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Nitrogen's triple bond makes N₂ gas very unreactive</text>
</svg>
