<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#64748b"/></marker>
    <marker id="arA" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#c2410c"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#c2410c">Electromagnetic induction</text>

  <g>
    <rect x="340" y="90" width="200" height="26" rx="3" fill="none" stroke="#c2410c" stroke-width="2.5"/>
    <rect x="340" y="122" width="200" height="26" rx="3" fill="none" stroke="#c2410c" stroke-width="2.5"/>
    <rect x="340" y="154" width="200" height="26" rx="3" fill="none" stroke="#c2410c" stroke-width="2.5"/>
    <text x="440" y="146" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#c2410c">coil of wire</text>
    <line x1="340" y1="90" x2="340" y2="180" stroke="#c2410c" stroke-width="2"/>
    <line x1="540" y1="90" x2="540" y2="180" stroke="#c2410c" stroke-width="2"/>
    <line x1="340" y1="90" x2="250" y2="90" stroke="#475569" stroke-width="2"/>
    <line x1="340" y1="180" x2="250" y2="180" stroke="#475569" stroke-width="2"/>
  </g>
  <text x="300" y="72" font-family="Arial, sans-serif" font-size="12" fill="#475569">wires to galvanometer</text>

  <g transform="translate(150,110)">
    <circle cx="0" cy="0" r="40" fill="#fffdf7" stroke="#475569" stroke-width="2"/>
    <line x1="-28" y1="0" x2="-8" y2="0" stroke="#475569" stroke-width="2"/>
    <line x1="8" y1="0" x2="28" y2="0" stroke="#475569" stroke-width="2"/>
    <line x1="-26" y1="0" x2="26" y2="0" stroke="#dc2626" stroke-width="2" transform="rotate(35)"/>
    <text x="-4" y="-6" font-family="Arial, sans-serif" font-size="11" fill="#dc2626">needle</text>
    <text x="0" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155">galvanometer</text>
    <text x="0" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#475569">(current detector)</text>
  </g>

  <line x1="250" y1="135" x2="290" y2="135" stroke="#475569" stroke-width="2"/>

  <rect x="200" y="240" width="90" height="110" rx="6" fill="#dc2626"/>
  <text x="245" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">N</text>
  <text x="245" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#ffffff">bar magnet</text>
  <line x1="290" y1="295" x2="345" y2="295" stroke="#c2410c" stroke-width="2.5" marker-end="url(#arA)"/>
  <text x="318" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#c2410c">push in</text>
  <text x="318" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#475569">pull out</text>

  <path d="M370,60 Q560,60 560,300" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <path d="M400,60 Q590,120 560,300" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="520" y="90" font-family="Arial, sans-serif" font-size="11" fill="#166534">changing magnetic field</text>

  <text x="320" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Moving the magnet changes the flux through the coil, inducing a current; a steady magnet induces nothing.</text>
</svg>
