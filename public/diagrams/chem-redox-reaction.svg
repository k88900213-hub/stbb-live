<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#047857"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#047857">Redox: zinc loses electrons, copper gains them</text>

  <g font-family="Arial, sans-serif">
    <rect x="70" y="110" width="200" height="120" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
    <text x="170" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#92400e">ZINC</text>
    <circle cx="170" cy="185" r="24" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>
    <text x="170" y="190" text-anchor="middle" font-size="16" font-weight="bold" fill="#334155">Zn</text>
    <text x="170" y="245" text-anchor="middle" font-size="12" fill="#475569">loses 2 electrons</text>

    <rect x="370" y="110" width="200" height="120" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="470" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e40af">COPPER</text>
    <circle cx="440" cy="185" r="24" fill="#fdba74" stroke="#c2410c" stroke-width="2"/>
    <text x="440" y="190" text-anchor="middle" font-size="16" font-weight="bold" fill="#7c2d12">Cu²⁺</text>
    <circle cx="500" cy="185" r="24" fill="#fdba74" stroke="#c2410c" stroke-width="2"/>
    <text x="500" y="190" text-anchor="middle" font-size="16" font-weight="bold" fill="#7c2d12">Cu</text>
    <text x="470" y="245" text-anchor="middle" font-size="12" fill="#475569">gains 2 electrons</text>

    <line x1="270" y1="160" x2="370" y2="160" stroke="#047857" stroke-width="3" marker-end="url(#arG)"/>
    <line x1="270" y1="195" x2="370" y2="195" stroke="#047857" stroke-width="3" marker-end="url(#arG)"/>
    <circle cx="300" cy="160" r="8" fill="#eab308"/>
    <circle cx="310" cy="195" r="8" fill="#eab308"/>
    <text x="320" y="136" text-anchor="middle" font-size="12" font-weight="bold" fill="#047857">2e⁻</text>
  </g>

  <rect x="170" y="265" width="300" height="46" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="320" y="293" text-anchor="middle" font-size="14" font-weight="bold" fill="#166534">OIL RIG - Oxidation Is Loss, Reduction Is Gain</text>

  <text x="320" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Zn + Cu²⁺ goes to Zn²⁺ + Cu: the two halves always happen together</text>
</svg>
