<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#c2410c">Screw gauge (micrometer): reading to 0.01 mm</text>

  <g transform="translate(120,110)">
    <rect x="0" y="0" width="200" height="70" rx="6" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
    <text x="100" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#92400e">anvil</text>
    <text x="100" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#92400e">(fixed)</text>
    <line x1="200" y1="20" x2="330" y2="20" stroke="#475569" stroke-width="6"/>
    <rect x="330" y="0" width="30" height="70" rx="4" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
    <text x="345" y="94" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155">spindle</text>
    <ellipse cx="300" cy="35" rx="26" ry="26" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
    <ellipse cx="300" cy="35" rx="20" ry="20" fill="none" stroke="#94a3b8" stroke-width="1"/>
    <g stroke="#475569" stroke-width="1.5">
      <line x1="300" y1="15" x2="300" y2="55"/><line x1="284" y1="25" x2="316" y2="45"/>
      <line x1="284" y1="45" x2="316" y2="25"/><line x1="280" y1="35" x2="320" y2="35"/>
    </g>
    <line x1="300" y1="35" x2="300" y2="15" stroke="#dc2626" stroke-width="2.2"/>
    <text x="300" y="80" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#475569">circular scale (100 divisions)</text>
    <rect x="470" y="-20" width="40" height="110" rx="5" fill="#fda4af" stroke="#be123c" stroke-width="1.5"/>
    <text x="490" y="-38" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155">ratchet</text>
    <line x1="360" y1="20" x2="470" y2="20" stroke="#475569" stroke-width="6"/>
  </g>

  <text x="120" y="240" font-family="Arial, sans-serif" font-size="14" fill="#334155">pitch = 1 mm per turn</text>
  <text x="120" y="262" font-family="Arial, sans-serif" font-size="14" fill="#334155">least count = pitch ÷ 100 divisions = 0.01 mm</text>
  <text x="120" y="284" font-family="Arial, sans-serif" font-size="14" fill="#334155">reading = main scale + (circular division × least count)</text>
  <rect x="120" y="300" width="80" height="34" rx="6" fill="#dc2626"/>
  <text x="160" y="322" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">wire / coin</text>
  <line x1="200" y1="310" x2="282" y2="80" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#a)"/>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#94a3b8"/></marker></defs>
</svg>
