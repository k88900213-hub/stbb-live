<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#dc2626"/></marker>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#2563eb"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#0369a1">The human heart and double circulation</text>

  <path d="M210,84 C 296,86 316,180 210,268 C 104,180 124,86 210,84 Z" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
  <line x1="210" y1="128" x2="210" y2="240" stroke="#b91c1c" stroke-width="2.5"/>
  <line x1="150" y1="180" x2="270" y2="180" stroke="#b91c1c" stroke-width="2.5"/>

  <g fill="#fff7ed" stroke="#b91c1c" stroke-width="2">
    <path d="M158,132 L168,160 L148,166 Z"/>
    <path d="M262,132 L252,160 L272,166 Z"/>
  </g>

  <g stroke="#b91c1c" stroke-width="2.5" fill="#fecaca">
    <path d="M186,150 C 176,90 190,80 196,66 L204,66 C 208,84 196,92 200,120 Z"/>
    <path d="M230,150 C 240,86 228,74 222,58 L214,58 C 210,78 222,88 218,116 Z"/>
  </g>
  <path d="M196,66 L196,52 M204,66 L204,52 M222,58 L222,44 M214,58 L214,44" stroke="#b91c1c" stroke-width="2.5"/>
  <path d="M256,150 Q300,150 320,120 Q338,96 332,70" fill="none" stroke="#b91c1c" stroke-width="3"/>
  <path d="M158,250 Q140,280 138,302" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arB)"/>

  <text x="178" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#7f1d1d">RA</text>
  <text x="242" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#7f1d1d">LA</text>
  <text x="178" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#7f1d1d">RV</text>
  <text x="242" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#7f1d1d">LV</text>

  <g stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3" fill="none">
    <line x1="252" y1="150" x2="320" y2="150"/>
    <line x1="252" y1="210" x2="320" y2="210"/>
    <line x1="196" y1="60" x2="150" y2="44"/>
    <line x1="218" y1="50" x2="150" y2="30"/>
    <line x1="138" y1="302" x2="80" y2="318"/>
  </g>
  <text x="330" y="145" font-family="Arial, sans-serif" font-size="11" fill="#334155">aorta</text>
  <text x="140" y="40" font-family="Arial, sans-serif" font-size="11" fill="#334155">pulmonary artery</text>
  <text x="60" y="336" font-family="Arial, sans-serif" font-size="11" fill="#334155">vena cava</text>
  <text x="286" y="178" font-family="Arial, sans-serif" font-size="10" fill="#334155">valves</text>

  <ellipse cx="480" cy="108" rx="52" ry="40" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="480" y="103" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e40af">LUNGS</text>
  <text x="480" y="117" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#1e40af">CO₂ out, O₂ in</text>

  <ellipse cx="480" cy="258" rx="56" ry="44" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="480" y="253" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#166534">BODY</text>
  <text x="480" y="267" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#166534">O₂ to tissues, CO₂ in</text>

  <path d="M214,66 Q360,40 428,80" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ar)"/>
  <path d="M332,70 Q430,60 430,68" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ar)"/>
  <path d="M480,148 Q470,180 460,200 L430,232" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ar)"/>
  <path d="M320,240 Q400,300 428,262" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arB)"/>

  <text x="366" y="58" font-family="Arial, sans-serif" font-size="10" fill="#dc2626">pulmonary artery (deoxygenated)</text>
  <text x="468" y="196" font-family="Arial, sans-serif" font-size="10" fill="#dc2626">aorta → body (oxygenated)</text>
  <text x="370" y="292" font-family="Arial, sans-serif" font-size="10" fill="#2563eb">vena cava → right atrium</text>
  <text x="452" y="158" font-family="Arial, sans-serif" font-size="10" fill="#475569">pulmonary veins (oxygenated) ←</text>

  <rect x="90" y="316" width="460" height="30" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="320" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#166534">Right side pumps to the lungs (pulmonary circulation); left side pumps around the body</text>
  <text x="320" y="344" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#166534">(systemic circulation). Thick-walled left ventricle does the heavier work.</text>
</svg>
