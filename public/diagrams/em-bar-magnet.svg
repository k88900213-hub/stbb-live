<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#64748b"/></marker>
    <marker id="arA" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#c2410c"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#c2410c">Magnetic field lines of a bar magnet</text>

  <rect x="240" y="150" width="160" height="54" rx="8" fill="#475569"/>
  <rect x="240" y="150" width="80" height="54" rx="8" fill="#dc2626"/>
  <text x="280" y="183" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">N</text>
  <text x="360" y="183" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">S</text>

  <g fill="none" stroke="#c2410c" stroke-width="2">
    <path d="M240,155 Q90,60 240,185" marker-end="url(#arA)"/>
    <path d="M240,158 Q70,100 240,188" marker-end="url(#arA)"/>
    <path d="M240,160 Q40,120 240,190" marker-end="url(#arA)"/>
    <path d="M240,163 Q20,170 240,192" marker-end="url(#arA)"/>
    <path d="M240,168 Q30,240 240,196" marker-end="url(#arA)"/>
    <path d="M240,172 Q60,290 240,199" marker-end="url(#arA)"/>
    <path d="M240,177 Q100,310 240,203" marker-end="url(#arA)"/>
    <path d="M240,192 Q150,330 240,204" marker-end="url(#arA)"/>
  </g>
  <path d="M240,155 Q80,55 240,185" fill="none" stroke="#c2410c" stroke-width="2"/>
  <text x="150" y="92" font-family="Arial, sans-serif" font-size="12" fill="#475569">field lines run from N to S</text>
  <text x="90" y="330" font-family="Arial, sans-serif" font-size="11" fill="#475569">lines bunch together at the poles — field strongest there</text>

  <text x="320" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#475569">inside the magnet the lines complete the loop, S to N</text>

  <rect x="120" y="300" width="400" height="1" fill="none"/>
  <text x="320" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Magnetic field lines leave the north pole, enter the south pole, and never cross.</text>
</svg>
