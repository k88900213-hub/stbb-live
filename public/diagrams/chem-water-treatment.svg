<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#64748b"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#047857">Stages of water treatment</text>

  <g font-family="Arial, sans-serif">
    <rect x="30" y="120" width="90" height="80" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="75" y="150" text-anchor="middle" font-size="12" fill="#1e40af" font-weight="bold">river</text>
    <text x="75" y="170" text-anchor="middle" font-size="10.5" fill="#1e40af">raw water in</text>
    <path d="M45,200 Q60,215 75,200 Q90,185 105,200" fill="none" stroke="#2563eb" stroke-width="1.6"/>

    <rect x="150" y="120" width="90" height="80" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
    <text x="195" y="150" text-anchor="middle" font-size="12" fill="#334155" font-weight="bold">screening</text>
    <text x="195" y="170" text-anchor="middle" font-size="10.5" fill="#475569">large debris removed</text>
    <line x1="175" y1="130" x2="215" y2="130" stroke="#475569" stroke-width="1.5"/>
    <line x1="175" y1="142" x2="215" y2="142" stroke="#475569" stroke-width="1.5"/>
    <line x1="175" y1="154" x2="215" y2="154" stroke="#475569" stroke-width="1.5"/>
    <line x1="175" y1="166" x2="215" y2="166" stroke="#475569" stroke-width="1.5"/>

    <rect x="270" y="120" width="90" height="80" rx="8" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
    <text x="315" y="150" text-anchor="middle" font-size="11.5" fill="#92400e" font-weight="bold">coagulation</text>
    <text x="315" y="168" text-anchor="middle" font-size="10.5" fill="#92400e">+ flocculation</text>
    <text x="315" y="186" text-anchor="middle" font-size="10.5" fill="#92400e">particles clump</text>

    <rect x="390" y="120" width="90" height="80" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
    <text x="435" y="150" text-anchor="middle" font-size="12" fill="#334155" font-weight="bold">sedimentation</text>
    <text x="435" y="170" text-anchor="middle" font-size="10.5" fill="#475569">sludge settles out</text>

    <rect x="510" y="120" width="90" height="80" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="555" y="150" text-anchor="middle" font-size="12" fill="#991b1b" font-weight="bold">filtration</text>
    <text x="555" y="170" text-anchor="middle" font-size="10.5" fill="#991b1b">sand and gravel beds</text>

    <rect x="30" y="240" width="90" height="80" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
    <text x="75" y="270" text-anchor="middle" font-size="12" fill="#166534" font-weight="bold">disinfection</text>
    <text x="75" y="288" text-anchor="middle" font-size="10.5" fill="#166534">chlorine / ozone / UV</text>
    <text x="75" y="306" text-anchor="middle" font-size="10.5" fill="#166534">kills pathogens</text>

    <rect x="150" y="240" width="90" height="80" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="195" y="270" text-anchor="middle" font-size="12" fill="#1e40af" font-weight="bold">clean water</text>
    <text x="195" y="290" text-anchor="middle" font-size="10.5" fill="#1e40af">safe to drink</text>
  </g>

  <line x1="122" y1="160" x2="148" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="242" y1="160" x2="268" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="362" y1="160" x2="388" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="482" y1="160" x2="508" y2="160" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M555,200 C555,220 122,220 122,238" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="122" y1="238" x2="148" y2="238" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="110" y="330" width="420" height="24" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="320" y="346" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#166534">Chlorine keeps working through the pipes; ozone and UV leave no taste but act only at the plant.</text>
</svg>
