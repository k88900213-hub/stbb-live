<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#64748b"/></marker>
    <marker id="arA" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#c2410c"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#c2410c">Image formation by a concave mirror</text>

  <line x1="70" y1="180" x2="420" y2="180" stroke="#64748b" stroke-width="1.5"/>
  <path d="M245,102 A90,90 0 0 0 245,258" fill="none" stroke="#475569" stroke-width="4"/>
  <g stroke="#94a3b8" stroke-width="1">
    <line x1="266" y1="118" x2="257" y2="130"/>
    <line x1="276" y1="145" x2="266" y2="155"/>
    <line x1="276" y1="215" x2="266" y2="205"/>
    <line x1="266" y1="242" x2="257" y2="230"/>
  </g>

  <line x1="120" y1="105" x2="120" y2="180" stroke="#dc2626" stroke-width="4"/>
  <line x1="120" y1="105" x2="108" y2="115" stroke="#dc2626" stroke-width="2"/>
  <line x1="120" y1="105" x2="132" y2="115" stroke="#dc2626" stroke-width="2"/>
  <text x="60" y="100" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#dc2626">object</text>

  <line x1="243" y1="180" x2="243" y2="205" stroke="#16a34a" stroke-width="4"/>
  <line x1="243" y1="205" x2="231" y2="195" stroke="#16a34a" stroke-width="2"/>
  <line x1="243" y1="205" x2="255" y2="195" stroke="#16a34a" stroke-width="2"/>
  <text x="150" y="250" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#166534">real, inverted image</text>

  <line x1="120" y1="105" x2="250" y2="105" stroke="#c2410c" stroke-width="2.5" marker-end="url(#arA)"/>
  <line x1="250" y1="105" x2="243" y2="205" stroke="#c2410c" stroke-width="2.5" marker-end="url(#arA)"/>

  <line x1="120" y1="105" x2="245" y2="180" stroke="#c2410c" stroke-width="2.5" marker-end="url(#arA)"/>
  <line x1="245" y1="180" x2="286" y2="205" stroke="#c2410c" stroke-width="2.5"/>
  <line x1="286" y1="205" x2="360" y2="205" stroke="#c2410c" stroke-width="2.5" marker-end="url(#arA)"/>

  <line x1="120" y1="105" x2="200" y2="180" stroke="#c2410c" stroke-width="2.5" marker-end="url(#arA)"/>
  <line x1="200" y1="180" x2="243" y2="205" stroke="#c2410c" stroke-width="2.5" marker-end="url(#arA)"/>

  <text x="252" y="170" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#334155">parallel ray → through F</text>
  <text x="262" y="198" font-family="Arial, sans-serif" font-size="11" fill="#475569">ray through F → parallel</text>
  <text x="196" y="160" font-family="Arial, sans-serif" font-size="11" fill="#475569">ray through C returns</text>

  <text x="290" y="172" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#334155">P</text>
  <text x="243" y="172" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#334155">F</text>
  <text x="192" y="172" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#334155">C</text>
  <text x="330" y="165" font-family="Arial, sans-serif" font-size="11" fill="#475569">principal axis</text>
  <text x="295" y="228" font-family="Arial, sans-serif" font-size="11" fill="#475569">mirror</text>

  <rect x="100" y="276" width="440" height="32" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="320" y="289" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#166534">object beyond C → real, inverted, diminished image between C and F</text>
  <text x="320" y="304" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#166534">object between P and F → virtual, upright, magnified image behind the mirror</text>

  <text x="320" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Three special rays: parallel, through the focus, and through the centre of curvature.</text>
</svg>
