<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#64748b"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#047857">Interconversion of states of matter</text>

  <g font-family="Arial, sans-serif">
    <rect x="270" y="70" width="100" height="52" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="320" y="102" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e40af">LIQUID</text>

    <rect x="95" y="252" width="110" height="52" rx="8" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
    <text x="150" y="284" text-anchor="middle" font-size="15" font-weight="bold" fill="#92400e">SOLID</text>

    <rect x="435" y="252" width="110" height="52" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
    <text x="490" y="284" text-anchor="middle" font-size="15" font-weight="bold" fill="#166534">GAS</text>

    <line x1="265" y1="118" x2="175" y2="250" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
    <line x1="175" y1="250" x2="265" y2="118" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
    <text x="196" y="180" font-size="12" fill="#047857">melting</text>
    <text x="196" y="196" font-size="12" fill="#dc2626">freezing</text>

    <line x1="375" y1="118" x2="465" y2="250" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
    <line x1="465" y1="250" x2="375" y2="118" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
    <text x="448" y="180" font-size="12" fill="#047857">vaporisation</text>
    <text x="448" y="196" font-size="12" fill="#dc2626">condensation</text>

    <path d="M205,252 C250,300 390,300 435,252" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
    <path d="M435,252 C390,300 250,300 205,252" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
    <text x="320" y="316" text-anchor="middle" font-size="12" fill="#047857">sublimation</text>
    <text x="320" y="332" text-anchor="middle" font-size="12" fill="#dc2626">deposition</text>
  </g>

  <text x="320" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Every change of state is reversible and involves absorbing or releasing heat</text>
</svg>
