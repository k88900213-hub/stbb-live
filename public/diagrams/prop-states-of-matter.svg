<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#c2410c">The three states of matter at the particle level</text>
  <g transform="translate(55,90)">
    <rect x="0" y="0" width="170" height="150" rx="10" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
    <text x="85" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#92400e">SOLID</text>
    <g>
      <circle cx="45" cy="55" r="12" fill="#c2410c"/><circle cx="125" cy="55" r="12" fill="#c2410c"/>
      <circle cx="85" cy="95" r="12" fill="#c2410c"/><circle cx="45" cy="135" r="12" fill="#c2410c"/>
      <circle cx="125" cy="135" r="12" fill="#c2410c"/>
    </g>
    <text x="85" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#475569">fixed shape and volume</text>
    <rect x="235" y="0" width="170" height="150" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="320" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1e40af">LIQUID</text>
    <g>
      <circle cx="280" cy="55" r="10" fill="#2563eb"/><circle cx="330" cy="70" r="10" fill="#2563eb"/>
      <circle cx="370" cy="55" r="10" fill="#2563eb"/><circle cx="300" cy="110" r="10" fill="#2563eb"/>
      <circle cx="355" cy="120" r="10" fill="#2563eb"/>
    </g>
    <text x="320" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#475569">fixed volume, any shape</text>
    <rect x="470" y="0" width="170" height="150" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
    <text x="555" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#166534">GAS</text>
    <g>
      <circle cx="505" cy="55" r="8" fill="#16a34a"/><circle cx="590" cy="80" r="8" fill="#16a34a"/>
      <circle cx="540" cy="115" r="8" fill="#16a34a"/><circle cx="615" cy="45" r="8" fill="#16a34a"/>
      <circle cx="560" cy="70" r="8" fill="#16a34a"/>
    </g>
    <text x="555" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#475569">no fixed shape or volume</text>
  </g>
  <text x="320" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">particles: tightly packed · loosely bonded · free to wander</text>
</svg>
