<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#64748b"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#047857">Amino acids join by peptide bonds</text>

  <g font-family="Arial, sans-serif" stroke="#475569" stroke-width="2">
    <text x="320" y="66" text-anchor="middle" font-size="13" fill="#334155">one amino acid</text>
    <line x1="180" y1="120" x2="180" y2="180" stroke-width="2.5"/>
    <line x1="180" y1="120" x2="140" y2="96" />
    <line x1="180" y1="120" x2="220" y2="96" />
    <line x1="180" y1="120" x2="238" y2="120" />
    <line x1="180" y1="120" x2="122" y2="120" />
    <circle cx="180" cy="120" r="6" fill="#334155"/>
    <text x="140" y="90" text-anchor="middle" font-size="11">NH₂</text>
    <text x="220" y="90" text-anchor="middle" font-size="11">R</text>
    <text x="250" y="124" font-size="11">COOH</text>
    <text x="110" y="124" text-anchor="end" font-size="11">H</text>
  </g>

  <line x1="280" y1="120" x2="320" y2="120" stroke="#c2410c" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="300" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#c2410c">condensation</text>
  <text x="300" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#c2410c">– H₂O</text>

  <g font-family="Arial, sans-serif" stroke="#475569" stroke-width="2">
    <line x1="345" y1="120" x2="345" y2="180" stroke-width="2.5"/>
    <line x1="345" y1="120" x2="305" y2="96"/>
    <line x1="345" y1="120" x2="385" y2="96"/>
    <line x1="345" y1="120" x2="403" y2="120"/>
    <circle cx="345" cy="120" r="6" fill="#334155"/>
    <text x="305" y="90" text-anchor="middle" font-size="11">NH₂</text>
    <text x="385" y="90" text-anchor="middle" font-size="11">R'</text>
    <text x="415" y="124" font-size="11">COOH</text>
  </g>

  <line x1="440" y1="120" x2="500" y2="120" stroke="#047857" stroke-width="2.5" marker-end="url(#ar)"/>

  <g font-family="Arial, sans-serif">
    <text x="540" y="110" text-anchor="middle" font-size="12.5" fill="#047857" font-weight="bold">dipeptide</text>
    <text x="540" y="132" text-anchor="middle" font-size="11.5" fill="#166534">joined by a</text>
    <text x="540" y="150" text-anchor="middle" font-size="11.5" fill="#166534">peptide bond</text>
    <rect x="498" y="160" width="84" height="22" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
    <text x="540" y="176" text-anchor="middle" font-size="11" fill="#991b1b">CONH</text>
  </g>

  <rect x="110" y="216" width="420" height="70" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="320" y="242" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" fill="#166534">Many amino acids in a chain make a protein.</text>
  <text x="320" y="262" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" fill="#166534">The –CO–NH– link between units is the peptide bond.</text>

  <rect x="110" y="310" width="420" height="34" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="320" y="332" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" fill="#166534">Water is released in each condensation step; the sequence of R-groups decides the protein.</text>
</svg>
