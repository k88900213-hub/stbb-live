<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#c2410c"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#c2410c">The solenoid and electromagnet</text>

  <rect x="150" y="176" width="340" height="48" rx="8" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <g stroke="#64748b" stroke-width="3">
    <line x1="165" y1="176" x2="185" y2="224"/>
    <line x1="195" y1="176" x2="215" y2="224"/>
    <line x1="225" y1="176" x2="245" y2="224"/>
    <line x1="255" y1="176" x2="275" y2="224"/>
    <line x1="285" y1="176" x2="305" y2="224"/>
    <line x1="315" y1="176" x2="335" y2="224"/>
    <line x1="345" y1="176" x2="365" y2="224"/>
    <line x1="375" y1="176" x2="395" y2="224"/>
    <line x1="405" y1="176" x2="425" y2="224"/>
    <line x1="435" y1="176" x2="455" y2="224"/>
    <line x1="465" y1="176" x2="480" y2="215"/>
  </g>

  <line x1="150" y1="200" x2="118" y2="200" stroke="#c2410c" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="100" y="194" font-family="Arial, sans-serif" font-size="11" fill="#c2410c">current in</text>
  <line x1="490" y1="200" x2="522" y2="200" stroke="#c2410c" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="530" y="194" font-family="Arial, sans-serif" font-size="11" fill="#c2410c">current out</text>

  <text x="150" y="166" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#dc2626">N</text>
  <text x="490" y="166" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#dc2626">S</text>

  <g stroke="#c2410c" stroke-width="2">
    <line x1="168" y1="188" x2="476" y2="188" marker-end="url(#ar)"/>
    <line x1="168" y1="200" x2="476" y2="200" marker-end="url(#ar)"/>
    <line x1="168" y1="212" x2="476" y2="212" marker-end="url(#ar)"/>
  </g>
  <text x="200" y="182" font-family="Arial, sans-serif" font-size="11" fill="#475569">uniform field inside, running S to N</text>

  <path d="M150,188 C 60,110 580,110 490,188" fill="none" stroke="#c2410c" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M150,212 C 60,290 580,290 490,212" fill="none" stroke="#c2410c" stroke-width="2" marker-end="url(#ar)"/>
  <text x="320" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#475569">outside the coil the lines run N to S</text>

  <rect x="120" y="268" width="400" height="46" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="320" y="286" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#166534">A solenoid behaves like a bar magnet. Insert a soft iron core</text>
  <text x="320" y="302" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#166534">and it becomes an electromagnet — magnetic only while current flows.</text>

  <text x="320" y="342" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Strength grows with more turns, more current, or an iron core (B ∝ nI).</text>
</svg>
