<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#047857">The pH scale: acid, neutral and alkaline</text>

  <g>
    <rect x="80" y="80" width="34" height="44" fill="#dc2626"/>
    <rect x="114" y="80" width="34" height="44" fill="#ef4444"/>
    <rect x="148" y="80" width="34" height="44" fill="#f97316"/>
    <rect x="182" y="80" width="34" height="44" fill="#facc15"/>
    <rect x="216" y="80" width="34" height="44" fill="#a3e635"/>
    <rect x="250" y="80" width="34" height="44" fill="#22c55e"/>
    <rect x="284" y="80" width="34" height="44" fill="#10b981"/>
    <rect x="318" y="80" width="34" height="44" fill="#14b8a6"/>
    <rect x="352" y="80" width="34" height="44" fill="#06b6d4"/>
    <rect x="386" y="80" width="34" height="44" fill="#3b82f6"/>
    <rect x="420" y="80" width="34" height="44" fill="#2563eb"/>
    <rect x="454" y="80" width="34" height="44" fill="#6366f1"/>
    <rect x="488" y="80" width="34" height="44" fill="#8b5cf6"/>
    <rect x="522" y="80" width="34" height="44" fill="#a855f7"/>
    <rect x="556" y="80" width="34" height="44" fill="#7c3aed"/>
  </g>
  <text x="80" y="146" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155">0</text>
  <text x="80" y="166" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#991b1b">acid</text>
  <text x="335" y="146" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#334155">7</text>
  <text x="335" y="166" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#065f46">neutral</text>
  <text x="573" y="146" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155">14</text>
  <text x="573" y="166" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#4c1d95">alkaline</text>

  <line x1="80" y1="188" x2="590" y2="188" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>

  <g font-family="Arial, sans-serif" font-size="12.5" fill="#334155">
    <circle cx="120" cy="216" r="5" fill="#dc2626"/>
    <text x="134" y="220">stomach acid — pH 1</text>
    <circle cx="120" cy="242" r="5" fill="#f97316"/>
    <text x="134" y="246">lemon juice — pH 2</text>
    <circle cx="400" cy="216" r="5" fill="#10b981"/>
    <text x="414" y="220">pure water — pH 7</text>
    <circle cx="400" cy="242" r="5" fill="#3b82f6"/>
    <text x="414" y="246">soap — pH 9</text>
    <circle cx="400" cy="268" r="5" fill="#7c3aed"/>
    <text x="414" y="272">bleach — pH 13</text>
  </g>

  <rect x="110" y="316" width="420" height="30" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="320" y="336" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" fill="#166534">pH = −log₁₀[H⁺]; each unit of pH is a tenfold change in hydrogen ion concentration.</text>
</svg>
