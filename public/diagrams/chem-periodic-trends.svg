<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#047857"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#047857">Periodic trends across periods and down groups</text>

  <g font-family="Arial, sans-serif">
    <rect x="250" y="118" width="26" height="26" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="280" y="118" width="26" height="26" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="310" y="118" width="26" height="26" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="340" y="118" width="26" height="26" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="250" y="148" width="26" height="26" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="280" y="148" width="26" height="26" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="310" y="148" width="26" height="26" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="340" y="148" width="26" height="26" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="250" y="178" width="26" height="26" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="280" y="178" width="26" height="26" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="310" y="178" width="26" height="26" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="340" y="178" width="26" height="26" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="250" y="208" width="26" height="26" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="280" y="208" width="26" height="26" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="310" y="208" width="26" height="26" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="340" y="208" width="26" height="26" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>

    <text x="320" y="98" text-anchor="middle" font-size="12" fill="#047857">ionization energy ↑</text>
    <text x="320" y="112" text-anchor="middle" font-size="12" fill="#047857">electronegativity ↑</text>
    <line x1="250" y1="128" x2="366" y2="128" stroke="#047857" stroke-width="3" marker-end="url(#arG)"/>
    <text x="320" y="145" text-anchor="middle" font-size="11" fill="#475569">atomic size ↓</text>

    <text x="228" y="150" text-anchor="end" font-size="12" fill="#047857">atomic size ↑</text>
    <text x="228" y="168" text-anchor="end" font-size="12" fill="#047857">metallic ↑</text>
    <text x="228" y="186" text-anchor="end" font-size="12" fill="#047857">ionization ↓</text>
    <line x1="242" y1="244" x2="242" y2="120" stroke="#047857" stroke-width="3" marker-end="url(#arG)"/>

    <text x="408" y="92" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">Across a period</text>
    <text x="408" y="112" text-anchor="middle" font-size="12" fill="#334155">atomic size ↓</text>
    <text x="408" y="130" text-anchor="middle" font-size="12" fill="#334155">ionization energy ↑</text>
    <text x="408" y="148" text-anchor="middle" font-size="12" fill="#334155">electronegativity ↑</text>
    <text x="408" y="166" text-anchor="middle" font-size="12" fill="#334155">metallic character ↓</text>
    <text x="408" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">Down a group</text>
    <text x="408" y="220" text-anchor="middle" font-size="12" fill="#334155">atomic size ↑</text>
    <text x="408" y="238" text-anchor="middle" font-size="12" fill="#334155">ionization energy ↓</text>
    <text x="408" y="256" text-anchor="middle" font-size="12" fill="#334155">electronegativity ↓</text>
    <text x="408" y="274" text-anchor="middle" font-size="12" fill="#334155">metallic character ↑</text>
  </g>

  <text x="320" y="322" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">Fluorine is the most electronegative; francium the most metallic</text>
  <text x="320" y="344" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">These trends let chemists predict an element's behaviour from its position</text>
</svg>
