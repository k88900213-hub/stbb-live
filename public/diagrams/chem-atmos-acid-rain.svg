<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#64748b"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#047857">Acid rain: formation and damage</text>

  <g>
    <rect x="70" y="150" width="60" height="90" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
    <rect x="85" y="110" width="30" height="42" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
    <line x1="100" y1="95" x2="100" y2="110" stroke="#475569" stroke-width="2.5"/>
    <path d="M86,95 q7,-10 14,0 q7,-10 14,0" fill="#94a3b8"/>
    <text x="100" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" fill="#334155">factory</text>
  </g>
  <g stroke="#94a3b8" stroke-width="2">
    <line x1="100" y1="95" x2="200" y2="70"/>
    <line x1="100" y1="95" x2="220" y2="85"/>
    <line x1="100" y1="95" x2="210" y2="100"/>
  </g>
  <text x="160" y="62" font-family="Arial, sans-serif" font-size="12" fill="#334155" font-weight="bold">SO₂ + NOₓ</text>
  <text x="160" y="118" font-family="Arial, sans-serif" font-size="11" fill="#64748b">from fuels and vehicles</text>

  <path d="M230,90 Q320,60 410,90 Q440,100 460,95" fill="none" stroke="#64748b" stroke-width="2"/>
  <text x="330" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#475569">gases dissolve in rain clouds</text>

  <g stroke="#2563eb" stroke-width="2">
    <line x1="330" y1="105" x2="330" y2="150"/>
    <line x1="360" y1="108" x2="360" y2="155"/>
    <line x1="390" y1="105" x2="390" y2="150"/>
    <line x1="420" y1="108" x2="420" y2="155"/>
    <line x1="300" y1="108" x2="300" y2="155"/>
  </g>
  <text x="360" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" fill="#1e40af" font-weight="bold">acid rain (pH below 5.6)</text>

  <rect x="80" y="205" width="90" height="70" rx="4" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
  <path d="M95,275 L95,240 L110,225 L125,240 L125,275 Z" fill="#f59e0b"/>
  <text x="125" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" fill="#92400e">buildings eaten</text>

  <g>
    <line x1="340" y1="205" x2="340" y2="280" stroke="#16a34a" stroke-width="4"/>
    <line x1="340" y1="225" x2="315" y2="245" stroke="#16a34a" stroke-width="3"/>
    <line x1="340" y1="245" x2="365" y2="265" stroke="#16a34a" stroke-width="3"/>
    <line x1="340" y1="265" x2="320" y2="285" stroke="#16a34a" stroke-width="3"/>
    <text x="300" y="200" font-family="Arial, sans-serif" font-size="10.5" fill="#166534">trees damaged</text>
  </g>

  <ellipse cx="500" cy="250" rx="60" ry="28" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5"/>
  <g fill="#166534">
    <path d="M470,245 q8,-10 16,0 q8,-10 16,0" stroke="#0f766e" stroke-width="1.2"/>
  </g>
  <text x="500" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" fill="#1e40af">lakes acidified</text>

  <rect x="110" y="318" width="420" height="26" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="320" y="336" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#166534">SO₂ and NOₓ form sulfuric and nitric acids that travel far on the wind.</text>
</svg>
