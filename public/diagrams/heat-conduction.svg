<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#c2410c"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#c2410c">Conduction: heat passes along a metal rod</text>
  <g transform="translate(110,120)">
    <rect x="0" y="0" width="400" height="46" rx="6" fill="#fca5a5" stroke="#dc2626" stroke-width="1.5"/>
    <text x="30" y="29" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7f1d1d">hot flame</text>
    <g stroke="#dc2626" stroke-width="2" marker-end="url(#ar)">
      <line x1="35" y1="46" x2="35" y2="80"/>
      <line x1="115" y1="46" x2="115" y2="80"/>
      <line x1="195" y1="46" x2="195" y2="80"/>
      <line x1="275" y1="46" x2="275" y2="80"/>
      <line x1="355" y1="46" x2="355" y2="80"/>
    </g>
    <g>
      <circle cx="80" cy="55" r="5" fill="#f87171"/><circle cx="160" cy="55" r="5" fill="#fb923c"/>
      <circle cx="240" cy="55" r="5" fill="#facc15"/><circle cx="320" cy="55" r="5" fill="#4ade80"/>
      <circle cx="400" cy="55" r="5" fill="#60a5fa"/>
    </g>
    <text x="120" y="110" font-family="Arial, sans-serif" font-size="12" fill="#334155">hot end → cold end · dots show temperature dropping along the rod</text>
    <text x="120" y="132" font-family="Arial, sans-serif" font-size="12" fill="#334155">metals are the best conductors (free electrons carry the energy)</text>
  </g>
  <text x="320" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">cooking pans are metal for conduction, with plastic handles to stop it</text>
</svg>
