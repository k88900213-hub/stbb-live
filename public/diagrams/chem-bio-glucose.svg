<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#047857">Glucose: the cell's energy sugar</text>

  <g stroke="#475569" stroke-width="2.5" fill="none">
    <polygon points="300,95 360,125 360,190 300,220 240,190 240,125"/>
  </g>
  <circle cx="360" cy="157" r="34" fill="#fef2f2"/>
  <circle cx="360" cy="157" r="34" fill="none" stroke="#dc2626" stroke-width="2.5"/>
  <text x="360" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#991b1b">O</text>

  <g fill="#334155">
    <circle cx="300" cy="95" r="5"/><circle cx="360" cy="125" r="5"/>
    <circle cx="360" cy="190" r="5"/><circle cx="300" cy="220" r="5"/>
    <circle cx="240" cy="190" r="5"/><circle cx="240" cy="125" r="5"/>
  </g>

  <text x="300" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155">CH₂OH</text>
  <text x="377" y="120" font-family="Arial, sans-serif" font-size="12" fill="#334155">H</text>
  <text x="377" y="196" font-family="Arial, sans-serif" font-size="12" fill="#334155">H</text>
  <text x="300" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155">OH</text>
  <text x="222" y="196" font-family="Arial, sans-serif" font-size="12" fill="#334155">H</text>
  <text x="222" y="120" font-family="Arial, sans-serif" font-size="12" fill="#334155">OH</text>

  <text x="300" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#047857">C₆H₁₂O₆</text>
  <text x="300" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155">hexose (six-carbon) sugar</text>

  <rect x="420" y="90" width="170" height="60" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="505" y="116" text-anchor="middle" font-size="12.5" fill="#166534" font-family="Arial, sans-serif">found in fruits, honey</text>
  <text x="505" y="136" text-anchor="middle" font-size="12.5" fill="#166534" font-family="Arial, sans-serif">and blood</text>

  <rect x="420" y="165" width="170" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="505" y="191" text-anchor="middle" font-size="12.5" fill="#1e40af" font-family="Arial, sans-serif">broken down in</text>
  <text x="505" y="211" text-anchor="middle" font-size="12.5" fill="#1e40af" font-family="Arial, sans-serif">respiration → energy (ATP)</text>

  <rect x="110" y="318" width="420" height="30" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="320" y="338" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" fill="#166534">Glucose is the universal fuel of cells; starch, glycogen and cellulose are built from it.</text>
</svg>
