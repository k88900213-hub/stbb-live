<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#047857"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#047857">Galvanic (voltaic) cell: zinc and copper</text>

  <g font-family="Arial, sans-serif">
    <path d="M130,140 h110 l6,150 h-122 z" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
    <text x="190" y="180" text-anchor="middle" font-size="11" fill="#92400e">ZnSO₄</text>
    <path d="M404,140 h110 l6,150 h-122 z" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="465" y="180" text-anchor="middle" font-size="11" fill="#1e40af">CuSO₄</text>

    <rect x="172" y="120" width="20" height="170" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>
    <text x="182" y="318" text-anchor="middle" font-size="12" fill="#334155">zinc (anode) −</text>
    <rect x="448" y="120" width="20" height="170" fill="#b45309" stroke="#7c2d12" stroke-width="2"/>
    <text x="458" y="318" text-anchor="middle" font-size="12" fill="#334155">copper (cathode) +</text>

    <path d="M130,150 Q190,90 260,110 L380,110 Q450,90 510,150" fill="none" stroke="#475569" stroke-width="3"/>
    <text x="320" y="98" text-anchor="middle" font-size="11" fill="#334155">salt bridge</text>

    <line x1="182" y1="120" x2="182" y2="66" stroke="#475569" stroke-width="2.5"/>
    <line x1="458" y1="120" x2="458" y2="66" stroke="#475569" stroke-width="2.5"/>
    <circle cx="320" cy="58" r="18" fill="#ffffff" stroke="#475569" stroke-width="2"/>
    <text x="320" y="63" text-anchor="middle" font-size="14" font-weight="bold" fill="#334155">V</text>
    <line x1="182" y1="66" x2="302" y2="58" stroke="#475569" stroke-width="2.5"/>
    <line x1="338" y1="58" x2="458" y2="66" stroke="#475569" stroke-width="2.5"/>
    <path d="M210,58 C250,44 270,44 292,52" stroke="#047857" stroke-width="3" fill="none" marker-end="url(#arG)"/>
    <text x="250" y="36" text-anchor="middle" font-size="11" font-weight="bold" fill="#047857">e⁻ flow</text>

    <circle cx="205" cy="240" r="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="205" y="244" text-anchor="middle" font-size="10" font-weight="bold" fill="#166534">Zn²⁺</text>
    <circle cx="430" cy="240" r="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="430" y="244" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e40af">Cu²⁺</text>
  </g>

  <text x="320" y="344" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Spontaneous redox drives electrons from zinc to copper, lighting the circuit</text>
</svg>
