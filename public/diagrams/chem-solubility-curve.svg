<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#047857">Solubility curves for two common solids</text>

  <g font-family="Arial, sans-serif">
    <line x1="100" y1="60" x2="100" y2="280" stroke="#475569" stroke-width="2"/>
    <line x1="100" y1="280" x2="570" y2="280" stroke="#475569" stroke-width="2"/>
    <text x="40" y="60" text-anchor="middle" font-size="12" fill="#334155">g / 100 g</text>
    <text x="40" y="78" text-anchor="middle" font-size="12" fill="#334155">water</text>
    <text x="320" y="312" text-anchor="middle" font-size="12" fill="#334155">temperature (°C)</text>

    <g stroke="#94a3b8" stroke-width="1" font-size="10" fill="#64748b">
      <line x1="100" y1="233" x2="570" y2="233"/>
      <line x1="100" y1="186" x2="570" y2="186"/>
      <line x1="100" y1="139" x2="570" y2="139"/>
      <line x1="100" y1="92" x2="570" y2="92"/>
      <text x="92" y="284">0</text>
      <text x="188" y="284">20</text>
      <text x="276" y="284">40</text>
      <text x="364" y="284">60</text>
      <text x="452" y="284">80</text>
      <text x="540" y="284">100</text>
      <text x="88" y="237">50</text>
      <text x="88" y="190">100</text>
      <text x="88" y="143">150</text>
      <text x="88" y="96">200</text>
    </g>

    <polyline points="100,280 194,280 288,279 382,279 476,278 570,277" fill="none" stroke="#2563eb" stroke-width="3"/>
    <text x="505" y="270" font-size="13" font-weight="bold" fill="#2563eb">NaCl</text>

    <polyline points="100,280 152,260 204,230 256,192 308,150 360,104 412,58" fill="none" stroke="#dc2626" stroke-width="3"/>
    <text x="300" y="92" font-size="13" font-weight="bold" fill="#dc2626">KNO₃</text>
  </g>

  <text x="320" y="336" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">KNO₃ is far more soluble when hot; NaCl hardly changes</text>
  <text x="320" y="354" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Solubility = mass of solute per 100 g water at a given temperature</text>
</svg>
