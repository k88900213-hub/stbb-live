<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#047857">The benzene ring: a stable ring of six carbons</text>

  <g stroke="#475569" stroke-width="2.5" fill="none">
    <polygon points="320,90 400,135 400,225 320,270 240,225 240,135"/>
  </g>
  <circle cx="320" cy="180" r="52" fill="none" stroke="#047857" stroke-width="2"/>

  <g fill="#334155">
    <circle cx="320" cy="90" r="6"/>
    <circle cx="400" cy="135" r="6"/>
    <circle cx="400" cy="225" r="6"/>
    <circle cx="320" cy="270" r="6"/>
    <circle cx="240" cy="225" r="6"/>
    <circle cx="240" cy="135" r="6"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="12" fill="#334155">
    <text x="320" y="82" text-anchor="middle">C</text>
    <text x="414" y="139">C</text>
    <text x="414" y="230">C</text>
    <text x="320" y="288" text-anchor="middle">C</text>
    <text x="212" y="230">C</text>
    <text x="212" y="139">C</text>
  </g>

  <text x="320" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#047857">C₆H₆</text>

  <rect x="90" y="120" width="110" height="70" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="145" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#166534">six carbon atoms</text>
  <text x="145" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#166534">in a flat ring</text>

  <rect x="440" y="120" width="110" height="70" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="495" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1e40af">delocalised</text>
  <text x="495" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1e40af">π electrons (circle)</text>

  <rect x="110" y="330" width="420" height="24" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="320" y="346" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#166534">Delocalised electrons make benzene unusually stable — it does not react like an alkene.</text>
</svg>
