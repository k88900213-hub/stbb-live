<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#047857"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#047857">Ionic bond: sodium donates its outer electron to chlorine</text>

  <g font-family="Arial, sans-serif">
    <text x="170" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">Sodium (2, 8, 1)</text>
    <circle cx="170" cy="140" r="30" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle cx="170" cy="140" r="52" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle cx="170" cy="140" r="74" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle cx="170" cy="140" r="14" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="170" y="144" text-anchor="middle" font-size="11" font-weight="bold" fill="#991b1b">11+</text>
    <circle cx="170" cy="110" r="5" fill="#eab308"/>
    <circle cx="170" cy="170" r="5" fill="#eab308"/>
    <circle cx="222" cy="140" r="5" fill="#eab308"/>
    <circle cx="118" cy="140" r="5" fill="#eab308"/>
    <circle cx="206" cy="114" r="5" fill="#eab308"/>
    <circle cx="134" cy="114" r="5" fill="#eab308"/>
    <circle cx="206" cy="166" r="5" fill="#eab308"/>
    <circle cx="134" cy="166" r="5" fill="#eab308"/>
    <circle cx="244" cy="140" r="5" fill="#eab308"/>
    <circle cx="222" cy="98" r="5" fill="#eab308"/>
    <circle cx="170" cy="66" r="5" fill="#eab308"/>
    <circle cx="118" cy="98" r="5" fill="#eab308"/>
    <circle cx="96" cy="140" r="5" fill="#eab308"/>

    <text x="470" y="78" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">Chlorine (2, 8, 7)</text>
    <circle cx="470" cy="140" r="30" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle cx="470" cy="140" r="52" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle cx="470" cy="140" r="74" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle cx="470" cy="140" r="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="470" y="144" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e40af">17+</text>
    <circle cx="470" cy="110" r="5" fill="#eab308"/>
    <circle cx="470" cy="170" r="5" fill="#eab308"/>
    <circle cx="522" cy="140" r="5" fill="#eab308"/>
    <circle cx="418" cy="140" r="5" fill="#eab308"/>
    <circle cx="506" cy="114" r="5" fill="#eab308"/>
    <circle cx="434" cy="114" r="5" fill="#eab308"/>
    <circle cx="506" cy="166" r="5" fill="#eab308"/>
    <circle cx="434" cy="166" r="5" fill="#eab308"/>
    <circle cx="544" cy="140" r="5" fill="#eab308"/>
    <circle cx="522" cy="98" r="5" fill="#eab308"/>
    <circle cx="470" cy="66" r="5" fill="#eab308"/>
    <circle cx="418" cy="98" r="5" fill="#eab308"/>
    <circle cx="396" cy="140" r="5" fill="#eab308"/>
    <circle cx="544" cy="98" r="5" fill="#eab308"/>
    <circle cx="522" cy="182" r="5" fill="#eab308"/>

    <path d="M248,70 C310,50 350,50 396,70" stroke="#047857" stroke-width="3" fill="none" marker-end="url(#arG)"/>
    <text x="322" y="44" text-anchor="middle" font-size="12" font-weight="bold" fill="#047857">one electron transferred</text>
  </g>

  <text x="170" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#92400e">Na⁺ (2, 8)</text>
  <circle cx="170" cy="282" r="18" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="170" y="288" text-anchor="middle" font-size="13" font-weight="bold" fill="#991b1b">Na⁺</text>
  <text x="470" y="252" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1e40af">Cl⁻ (2, 8, 8)</text>
  <circle cx="470" cy="282" r="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="470" y="288" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">Cl⁻</text>
  <line x1="196" y1="282" x2="444" y2="282" stroke="#475569" stroke-width="2" marker-end="url(#arG)"/>
  <line x1="444" y1="282" x2="196" y2="282" stroke="#475569" stroke-width="2" marker-end="url(#arG)"/>
  <text x="320" y="274" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#475569">electrostatic attraction</text>

  <text x="320" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Oppositely charged ions attract to build a giant sodium chloride crystal lattice</text>
</svg>
