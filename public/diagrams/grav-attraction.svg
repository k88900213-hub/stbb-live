<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <marker id="arA" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#c2410c"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#c2410c">Newton's law of gravitation</text>
  <circle cx="170" cy="180" r="46" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
  <text x="170" y="186" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#92400e">m₁</text>
  <circle cx="470" cy="180" r="30" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="470" y="186" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#1e40af">m₂</text>
  <line x1="216" y1="180" x2="438" y2="180" stroke="#c2410c" stroke-width="3" marker-end="url(#arA)"/>
  <line x1="438" y1="200" x2="220" y2="200" stroke="#c2410c" stroke-width="3" marker-end="url(#arA)"/>
  <line x1="170" y1="226" x2="470" y2="226" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="320" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">distance r between the centres</text>
  <rect x="120" y="268" width="400" height="56" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="320" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#166534">F = G·m₁·m₂ / r²</text>
  <text x="320" y="312" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#166534">double the distance → the force falls to one quarter</text>
</svg>
