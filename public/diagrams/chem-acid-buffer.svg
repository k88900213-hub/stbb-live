<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#64748b"/></marker>
    <marker id="arA" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#c2410c"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#047857">How a buffer resists pH change</text>

  <rect x="195" y="130" width="250" height="110" rx="10" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <text x="320" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#334155">HA ⇌ H⁺ + A⁻</text>
  <text x="320" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#475569">weak acid + its conjugate base</text>
  <text x="320" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#475569">pH stays almost constant</text>

  <rect x="30" y="145" width="120" height="80" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="90" y="176" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#991b1b">add acid (H⁺)</text>
  <text x="90" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#991b1b">A⁻ absorbs the H⁺</text>
  <line x1="150" y1="185" x2="192" y2="185" stroke="#c2410c" stroke-width="2.5" marker-end="url(#arA)"/>

  <rect x="490" y="145" width="120" height="80" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="550" y="176" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1e40af">add base (OH⁻)</text>
  <text x="550" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1e40af">HA neutralises the OH⁻</text>
  <line x1="448" y1="185" x2="488" y2="185" stroke="#c2410c" stroke-width="2.5" marker-end="url(#arA)"/>

  <rect x="110" y="316" width="420" height="30" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="320" y="336" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" fill="#166534">The weak acid mops up added base; its conjugate base mops up added acid.</text>
</svg>
