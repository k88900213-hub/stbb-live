<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#64748b"/></marker>
    <marker id="arA" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#c2410c"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#c2410c">Dispersion of white light by a prism</text>

  <polygon points="300,150 380,150 340,250" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <text x="340" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155">glass prism</text>

  <line x1="140" y1="170" x2="300" y2="172" stroke="#334155" stroke-width="2.5"/>
  <path d="M140,170 Q200,168 300,172" fill="none" stroke="#334155" stroke-width="5"/>
  <circle cx="160" cy="170" r="6" fill="#fffdf7" stroke="#334155" stroke-width="1.5"/>
  <text x="120" y="156" font-family="Arial, sans-serif" font-size="12" fill="#475569">white light</text>
  <line x1="140" y1="170" x2="180" y2="170" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>

  <g stroke-width="3">
    <line x1="380" y1="172" x2="470" y2="120" stroke="#dc2626"/>
    <line x1="380" y1="172" x2="500" y2="140" stroke="#f97316"/>
    <line x1="380" y1="172" x2="510" y2="166" stroke="#eab308"/>
    <line x1="380" y1="172" x2="505" y2="194" stroke="#16a34a"/>
    <line x1="380" y1="172" x2="495" y2="218" stroke="#2563eb"/>
    <line x1="380" y1="172" x2="480" y2="240" stroke="#7c3aed"/>
    <line x1="380" y1="172" x2="462" y2="258" stroke="#dc2626"/>
  </g>
  <text x="470" y="108" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#dc2626">red</text>
  <text x="495" y="150" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#eab308">yellow</text>
  <text x="520" y="186" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#16a34a">green</text>
  <text x="512" y="230" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2563eb">blue</text>
  <text x="448" y="272" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#7c3aed">violet</text>
  <path d="M470,120 A20,20 0 0 0 462,258" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="540" y="272" font-family="Arial, sans-serif" font-size="11" fill="#475569">ROYGBIV</text>

  <rect x="170" y="292" width="300" height="30" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="320" y="312" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#166534">Red bends least, violet bends most — each colour slows differently in glass.</text>

  <text x="320" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">White light is a mixture of colours; the prism separates them by refraction.</text>
</svg>
