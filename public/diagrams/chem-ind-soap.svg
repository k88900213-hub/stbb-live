<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#64748b"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#047857">Saponification: fat + alkali → soap + glycerol</text>

  <g font-family="Arial, sans-serif">
    <text x="120" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">fat (triglyceride)</text>
    <line x1="60" y1="120" x2="180" y2="120" stroke="#b45309" stroke-width="2"/>
    <path d="M90,120 C110,120 115,140 140,140 C165,140 170,120 190,120" fill="none" stroke="#b45309" stroke-width="2"/>
    <path d="M90,140 C110,140 115,160 140,160 C165,160 170,140 190,140" fill="none" stroke="#b45309" stroke-width="2"/>
    <path d="M90,160 C110,160 115,180 140,180 C165,180 170,160 190,160" fill="none" stroke="#b45309" stroke-width="2"/>

    <rect x="230" y="105" width="90" height="70" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="275" y="138" text-anchor="middle" font-size="12" fill="#1e40af" font-weight="bold">NaOH</text>
    <text x="275" y="158" text-anchor="middle" font-size="10.5" fill="#1e40af">(alkali, heat)</text>
  </g>

  <line x1="340" y1="140" x2="400" y2="140" stroke="#c2410c" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="370" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#c2410c">saponification</text>

  <g font-family="Arial, sans-serif">
    <text x="500" y="90" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">soap (sodium salts</text>
    <text x="500" y="106" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">of fatty acids)</text>
    <circle cx="500" cy="140" r="12" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
    <path d="M490,140 C480,140 475,150 465,150" fill="none" stroke="#16a34a" stroke-width="1.5"/>
    <path d="M490,155 C480,155 475,165 465,165" fill="none" stroke="#16a34a" stroke-width="1.5"/>
    <text x="500" y="175" text-anchor="middle" font-size="11" fill="#166534">tail = dissolves grease</text>
    <text x="500" y="192" text-anchor="middle" font-size="11" fill="#166534">head = stays in water</text>

    <rect x="450" y="205" width="100" height="40" rx="8" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
    <text x="500" y="230" text-anchor="middle" font-size="11.5" fill="#92400e" font-weight="bold">glycerol</text>
  </g>

  <rect x="110" y="280" width="420" height="34" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="320" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" fill="#166534">Triglyceride + 3NaOH → 3 soap + glycerol.</text>
  <text x="320" y="314" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#166534">Sodium soaps are hard bars; potassium soaps are soft liquid soaps.</text>
</svg>
