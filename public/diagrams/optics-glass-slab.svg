<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#64748b"/></marker>
    <marker id="arA" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#c2410c"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#c2410c">Refraction through a glass slab</text>

  <rect x="220" y="110" width="200" height="140" fill="#bfdbfe" fill-opacity="0.4" stroke="#2563eb" stroke-width="2"/>
  <text x="320" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e40af">glass</text>
  <text x="130" y="80" font-family="Arial, sans-serif" font-size="12" fill="#475569">air</text>
  <text x="320" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#475569">air</text>

  <line x1="140" y1="35" x2="250" y2="110" stroke="#c2410c" stroke-width="2.5" marker-end="url(#arA)"/>
  <line x1="250" y1="70" x2="250" y2="150" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="250" y1="110" x2="330" y2="250" stroke="#c2410c" stroke-width="2.5" marker-end="url(#arA)"/>
  <line x1="330" y1="215" x2="330" y2="285" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="330" y1="250" x2="455" y2="325" stroke="#c2410c" stroke-width="2.5" marker-end="url(#arA)"/>

  <line x1="250" y1="110" x2="455" y2="250" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="420" y="170" font-family="Arial, sans-serif" font-size="11" fill="#475569">undeviated path</text>
  <line x1="330" y1="250" x2="455" y2="250" stroke="#dc2626" stroke-width="2.5" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="395" y="243" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#dc2626">lateral displacement</text>

  <path d="M243,95 A18,18 0 0 0 252,103" fill="none" stroke="#dc2626" stroke-width="1.5"/>
  <text x="228" y="88" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">i</text>
  <path d="M257,133 A16,16 0 0 1 264,140" fill="none" stroke="#dc2626" stroke-width="1.5"/>
  <text x="270" y="135" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">r</text>
  <path d="M337,276 A15,15 0 0 0 345,272" fill="none" stroke="#dc2626" stroke-width="1.5"/>
  <text x="352" y="282" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">e</text>

  <text x="180" y="55" font-family="Arial, sans-serif" font-size="11" fill="#475569">incident ray</text>
  <text x="290" y="150" font-family="Arial, sans-serif" font-size="11" fill="#475569">bends toward the normal</text>
  <text x="352" y="318" font-family="Arial, sans-serif" font-size="11" fill="#475569">emerges parallel,</text>
  <text x="352" y="332" font-family="Arial, sans-serif" font-size="11" fill="#475569">only shifted sideways</text>

  <rect x="100" y="310" width="440" height="30" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="320" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#166534">The emergent ray is parallel to the incident ray — a slab only shifts light sideways.</text>

  <text x="320" y="354" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#64748b">Entry: ray bends toward the normal (into glass). Exit: ray bends away from the normal (into air).</text>
</svg>
