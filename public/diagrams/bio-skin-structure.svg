<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#64748b"/></marker>
    <marker id="arA" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#c2410c"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="26" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#0369a1">Structure of the human skin</text>

  <rect x="90" y="60" width="460" height="42" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="110" y="84" font-family="Arial, sans-serif" font-size="12" fill="#991b1b">epidermis</text>
  <text x="175" y="84" font-family="Arial, sans-serif" font-size="12" fill="#991b1b">(flat dead cells with keratin)</text>

  <rect x="90" y="102" width="460" height="160" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="110" y="126" font-family="Arial, sans-serif" font-size="12" fill="#991b1b">dermis</text>

  <rect x="90" y="262" width="460" height="56" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
  <text x="110" y="292" font-family="Arial, sans-serif" font-size="12" fill="#92400e">hypodermis (fat cells — insulation and energy store)</text>

  <line x1="200" y1="175" x2="200" y2="70" stroke="#78350f" stroke-width="5"/>
  <text x="212" y="126" font-family="Arial, sans-serif" font-size="11" fill="#92400e">hair</text>
  <ellipse cx="200" cy="190" rx="12" ry="20" fill="#fcd34d" stroke="#b45309" stroke-width="1.5"/>
  <text x="150" y="200" font-family="Arial, sans-serif" font-size="11" fill="#92400e">hair follicle</text>
  <circle cx="214" cy="172" r="6" fill="#fcd34d" stroke="#b45309" stroke-width="1"/>
  <circle cx="226" cy="180" r="6" fill="#fcd34d" stroke="#b45309" stroke-width="1"/>
  <circle cx="218" cy="188" r="6" fill="#fcd34d" stroke="#b45309" stroke-width="1"/>
  <text x="244" y="180" font-family="Arial, sans-serif" font-size="11" fill="#92400e">sebaceous gland</text>

  <path d="M320,150 C300,140 290,120 300,100 C310,90 330,92 335,108" stroke="#dc2626" stroke-width="3" fill="none"/>
  <path d="M335,108 C310,170 340,200 320,240 C315,252 325,258 330,248" stroke="#dc2626" stroke-width="3" fill="none"/>
  <path d="M330,248 C340,210 310,180 320,150" stroke="#dc2626" stroke-width="3" fill="none"/>
  <text x="356" y="130" font-family="Arial, sans-serif" font-size="11" fill="#991b1b">sweat gland</text>
  <text x="356" y="230" font-family="Arial, sans-serif" font-size="11" fill="#991b1b">(coiled duct)</text>

  <path d="M430,150 C460,140 480,150 460,165 C440,178 420,170 430,150" stroke="#dc2626" stroke-width="2.5" fill="none"/>
  <text x="452" y="140" font-family="Arial, sans-serif" font-size="11" fill="#991b1b">blood</text>
  <text x="452" y="153" font-family="Arial, sans-serif" font-size="11" fill="#991b1b">capillaries</text>

  <path d="M520,160 L525,180 L535,185 M525,180 L528,200" stroke="#64748b" stroke-width="2.5" fill="none"/>
  <text x="500" y="225" font-family="Arial, sans-serif" font-size="11" fill="#334155">nerve ending</text>

  <text x="90" y="336" font-family="Arial, sans-serif" font-size="11" fill="#334155">sweat cools the body; arterioles widen (vasodilation) or narrow (vasocontraction) to lose or save heat</text>
  <text x="320" y="352" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">epidermis protects, dermis regulates temperature, hypodermis insulates</text>
</svg>
