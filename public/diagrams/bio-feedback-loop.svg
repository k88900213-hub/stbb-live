<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#64748b"/></marker>
    <marker id="arA" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#c2410c"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="26" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#0369a1">Negative feedback: keeping the internal environment constant</text>

  <rect x="245" y="48" width="150" height="52" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="320" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#166534">Normal condition</text>
  <text x="320" y="86" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#166534">(set point, 37 °C)</text>

  <rect x="465" y="170" width="150" height="52" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="540" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1e40af">Receptors detect</text>
  <text x="540" y="208" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1e40af">a change</text>

  <rect x="245" y="292" width="150" height="52" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="320" y="312" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#991b1b">Control centre</text>
  <text x="320" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#991b1b">(brain / hypothalamus)</text>

  <rect x="25" y="170" width="150" height="52" rx="8" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
  <text x="100" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#92400e">Effectors respond</text>
  <text x="100" y="208" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#92400e">(sweat, shiver, vessels)</text>

  <path d="M395,72 Q470,95 500,160" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M540,222 Q480,260 395,288" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M245,308 Q180,275 170,225" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M100,168 Q140,110 235,82" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ar)"/>

  <text x="470" y="152" font-family="Arial, sans-serif" font-size="11" fill="#334155">temperature rises</text>
  <text x="455" y="266" font-family="Arial, sans-serif" font-size="11" fill="#334155">message sent</text>
  <text x="176" y="286" font-family="Arial, sans-serif" font-size="11" fill="#334155">correction ordered</text>
  <text x="150" y="140" font-family="Arial, sans-serif" font-size="11" fill="#334155">condition restored</text>

  <rect x="25" y="300" width="590" height="44" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="320" y="318" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155">Hot day: sweat and widening vessels cool the body. Cold day: shivering and narrowed vessels warm it.</text>
  <text x="320" y="338" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Negative feedback always opposes the disturbance and brings the condition back to the set point</text>
</svg>
