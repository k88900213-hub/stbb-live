<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#64748b"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#047857">The greenhouse effect: heat in, heat trapped</text>

  <circle cx="100" cy="80" r="34" fill="#facc15"/>
  <text x="100" y="86" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#78350f">SUN</text>

  <g stroke="#f59e0b" stroke-width="2.5">
    <line x1="130" y1="70" x2="230" y2="120"/>
    <line x1="130" y1="90" x2="230" y2="160"/>
  </g>
  <text x="180" y="105" font-family="Arial, sans-serif" font-size="11.5" fill="#b45309">sunlight</text>

  <path d="M80,210 Q160,190 240,210 Q320,190 400,210 Q480,190 560,210" fill="none" stroke="#f59e0b" stroke-width="3"/>
  <text x="70" y="232" font-family="Arial, sans-serif" font-size="11.5" fill="#b45309">greenhouse-gas layer</text>
  <g font-family="Arial, sans-serif" font-size="11" fill="#92400e">
    <text x="250" y="205">CO₂</text>
    <text x="350" y="200">CH₄</text>
    <text x="450" y="205">H₂O</text>
  </g>

  <path d="M120,290 Q240,270 360,290 Q480,270 540,290" fill="none" stroke="#2563eb" stroke-width="4"/>
  <text x="320" y="318" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1e40af">EARTH</text>

  <g stroke="#dc2626" stroke-width="2.5" marker-end="url(#ar)">
    <line x1="180" y1="270" x2="170" y2="215"/>
    <line x1="280" y1="272" x2="270" y2="220"/>
    <line x1="400" y1="272" x2="410" y2="220"/>
    <line x1="480" y1="270" x2="490" y2="215"/>
  </g>
  <text x="300" y="255" font-family="Arial, sans-serif" font-size="11.5" fill="#991b1b">infrared (heat) re-emitted by Earth</text>

  <path d="M430,215 C460,190 500,185 530,200" fill="none" stroke="#991b1b" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="540" y="200" font-family="Arial, sans-serif" font-size="11.5" fill="#991b1b">some escapes</text>

  <rect x="110" y="330" width="420" height="24" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="320" y="346" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#166534">Greenhouse gases trap infrared — a little keeps us warm, too much drives global warming.</text>
</svg>
