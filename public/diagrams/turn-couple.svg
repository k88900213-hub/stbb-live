<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#64748b"/></marker>
    <marker id="arA" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#c2410c"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#c2410c">A couple: two equal, opposite, parallel forces</text>
  <g transform="translate(320,170)">
    <line x1="-160" y1="0" x2="160" y2="0" stroke="#475569" stroke-width="5"/>
    <line x1="-160" y1="-60" x2="-160" y2="60" stroke="#c2410c" stroke-width="3.5" marker-end="url(#arA)"/>
    <text x="-150" y="-72" text-anchor="end" font-family="Arial, sans-serif" font-size="14" fill="#c2410c">F</text>
    <line x1="160" y1="60" x2="160" y2="-60" stroke="#16a34a" stroke-width="3.5" marker-end="url(#ar)"/>
    <text x="160" y="74" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#16a34a">F</text>
    <line x1="-160" y1="0" x2="160" y2="0" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="0" y="-26" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">separation s</text>
  </g>
  <rect x="120" y="272" width="400" height="52" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="320" y="294" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#166534">torque of a couple = F × s</text>
  <text x="320" y="314" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#166534">a couple only rotates — it has no net push · steering wheel, screwdriver</text>
</svg>
