<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#64748b"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#047857">The water cycle</text>

  <circle cx="100" cy="70" r="30" fill="#facc15"/>
  <text x="100" y="76" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#78350f">SUN</text>

  <path d="M60,300 Q140,280 220,300 Q300,280 380,300 Q460,280 540,300" fill="none" stroke="#2563eb" stroke-width="4"/>
  <path d="M60,318 Q140,300 220,318 Q300,300 380,318 Q460,300 540,318" fill="none" stroke="#2563eb" stroke-width="4"/>
  <text x="120" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1e40af">ocean</text>

  <g stroke="#c2410c" stroke-width="2.5" marker-end="url(#ar)">
    <line x1="180" y1="296" x2="180" y2="210"/>
    <line x1="220" y1="296" x2="220" y2="215"/>
  </g>
  <text x="200" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#c2410c" font-weight="bold">evaporation</text>

  <ellipse cx="330" cy="150" rx="90" ry="26" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <ellipse cx="300" cy="140" rx="60" ry="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <ellipse cx="370" cy="160" rx="55" ry="16" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="330" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#075985" font-weight="bold">clouds: condensation</text>

  <g stroke="#3b82f6" stroke-width="2" marker-end="url(#ar)">
    <line x1="310" y1="176" x2="310" y2="235"/>
    <line x1="350" y1="176" x2="350" y2="235"/>
  </g>
  <text x="330" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1e40af" font-weight="bold">precipitation</text>

  <g stroke="#64748b" stroke-width="2.5" marker-end="url(#ar)">
    <line x1="430" y1="180" x2="430" y2="255"/>
    <line x1="470" y1="180" x2="470" y2="255"/>
  </g>
  <text x="450" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#475569" font-weight="bold">runoff</text>

  <rect x="520" y="240" width="70" height="60" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="555" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1e40af">lake</text>
  <text x="555" y="288" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" fill="#64748b">groundwater</text>

  <rect x="110" y="336" width="420" height="22" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="320" y="351" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#166534">Solar energy drives water endlessly: evaporation → condensation → precipitation → runoff.</text>
</svg>
