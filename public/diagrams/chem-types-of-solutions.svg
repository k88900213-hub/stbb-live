<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#047857">Types of solutions</text>

  <g font-family="Arial, sans-serif">
    <rect x="25" y="80" width="185" height="200" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
    <text x="117" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#166534">Solid in liquid</text>
    <path d="M57,150 l5,120 h110 l5,-120 z" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <g fill="#ffffff" stroke="#94a3b8" stroke-width="1">
      <rect x="70" y="244" width="12" height="10" rx="2"/>
      <rect x="88" y="248" width="12" height="10" rx="2"/>
      <rect x="106" y="243" width="12" height="10" rx="2"/>
      <rect x="124" y="247" width="12" height="10" rx="2"/>
    </g>
    <circle cx="82" cy="185" r="3" fill="#059669"/>
    <circle cx="105" cy="200" r="3" fill="#059669"/>
    <circle cx="125" cy="185" r="3" fill="#059669"/>
    <text x="117" y="265" text-anchor="middle" font-size="12" fill="#1e40af">salt in water</text>

    <rect x="227" y="80" width="185" height="200" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="320" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e40af">Gas in liquid</text>
    <path d="M265,150 l5,120 h100 l5,-120 z" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
    <rect x="262" y="142" width="116" height="10" rx="3" fill="#e2e8f0" stroke="#475569" stroke-width="1"/>
    <g fill="none" stroke="#7c2d12" stroke-width="1.5">
      <circle cx="285" cy="205" r="6"/>
      <circle cx="310" cy="225" r="8"/>
      <circle cx="340" cy="200" r="6"/>
      <circle cx="355" cy="228" r="7"/>
      <circle cx="295" cy="240" r="6"/>
      <circle cx="330" cy="245" r="8"/>
    </g>
    <text x="320" y="265" text-anchor="middle" font-size="12" fill="#92400e">CO₂ in soda</text>

    <rect x="429" y="80" width="185" height="200" rx="10" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
    <text x="522" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#92400e">Solid in solid</text>
    <rect x="485" y="145" width="75" height="75" rx="6" fill="#fbbf24" stroke="#b45309" stroke-width="1.5"/>
    <g fill="#92400e">
      <circle cx="500" cy="160" r="4"/>
      <circle cx="520" cy="175" r="4"/>
      <circle cx="540" cy="155" r="4"/>
      <circle cx="510" cy="195" r="4"/>
      <circle cx="535" cy="195" r="4"/>
      <circle cx="548" cy="180" r="4"/>
    </g>
    <text x="522" y="250" text-anchor="middle" font-size="12" fill="#92400e">brass (Cu + Zn)</text>
  </g>

  <text x="320" y="312" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">A solution is any homogeneous mixture — of solids, liquids or gases</text>
  <text x="320" y="332" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">Air is a solution of gases; alloys are solutions of solids</text>
  <text x="320" y="352" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Fish breathe dissolved oxygen; the fizz in cola is dissolved carbon dioxide</text>
</svg>
