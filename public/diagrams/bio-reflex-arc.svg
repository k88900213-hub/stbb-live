<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#64748b"/></marker>
    <marker id="arA" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#c2410c"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="26" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#0369a1">The reflex arc</text>

  <ellipse cx="80" cy="200" rx="32" ry="24" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
  <rect x="55" y="160" width="12" height="28" rx="6" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
  <rect x="80" y="158" width="12" height="30" rx="6" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
  <rect x="102" y="162" width="12" height="26" rx="6" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
  <circle cx="80" cy="200" r="6" fill="#dc2626"/>
  <text x="80" y="242" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155">receptor in skin</text>
  <text x="80" y="256" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155">(stimulus: heat)</text>

  <path d="M112,195 C160,180 210,150 260,148" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#ar)"/>
  <text x="160" y="172" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155">sensory neuron</text>

  <rect x="258" y="120" width="124" height="120" rx="14" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="320" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155">spinal cord</text>
  <path d="M300,170 h16 v14 h16 v-14 M300,200 h16 v-14 h16 v14" stroke="#94a3b8" stroke-width="5" fill="none"/>
  <text x="392" y="160" font-family="Arial, sans-serif" font-size="11" fill="#475569">grey matter</text>
  <text x="392" y="190" font-family="Arial, sans-serif" font-size="11" fill="#475569">interneuron</text>

  <path d="M382,220 C410,245 440,250 465,232" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#ar)"/>
  <text x="440" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155">motor neuron</text>

  <ellipse cx="500" cy="215" rx="48" ry="22" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
  <line x1="538" y1="215" x2="565" y2="215" stroke="#b45309" stroke-width="5"/>
  <text x="500" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155">effector</text>
  <text x="500" y="272" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155">(muscle)</text>

  <circle cx="80" cy="180" r="9" fill="#fff" stroke="#c2410c" stroke-width="1.5"/>
  <text x="80" y="184" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#c2410c">1</text>
  <circle cx="190" cy="152" r="9" fill="#fff" stroke="#c2410c" stroke-width="1.5"/>
  <text x="190" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#c2410c">2</text>
  <circle cx="320" cy="180" r="9" fill="#fff" stroke="#c2410c" stroke-width="1.5"/>
  <text x="320" y="184" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#c2410c">3</text>
  <circle cx="430" cy="252" r="9" fill="#fff" stroke="#c2410c" stroke-width="1.5"/>
  <text x="430" y="256" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#c2410c">4</text>
  <circle cx="515" cy="200" r="9" fill="#fff" stroke="#c2410c" stroke-width="1.5"/>
  <text x="515" y="204" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#c2410c">5</text>

  <text x="320" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155">1 receptor → 2 sensory neuron → 3 interneuron (in spinal cord) → 4 motor neuron → 5 effector</text>
  <text x="320" y="334" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">the reflex arc is fast and automatic — it is completed in the spinal cord without the brain</text>
</svg>
