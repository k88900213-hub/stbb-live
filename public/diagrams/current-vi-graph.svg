<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#64748b"/></marker>
    <marker id="arA" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#c2410c"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#c2410c">Ohmic and non-ohmic V–I graphs</text>

  <g transform="translate(70,70)">
    <text x="160" y="18" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#334155">Ohmic (metal wire, constant T)</text>
    <line x1="40" y1="30" x2="40" y2="200" stroke="#475569" stroke-width="2"/>
    <line x1="40" y1="200" x2="280" y2="200" stroke="#475569" stroke-width="2"/>
    <line x1="40" y1="200" x2="272" y2="48" stroke="#c2410c" stroke-width="3" marker-end="url(#arA)"/>
    <text x="24" y="48" font-family="Arial, sans-serif" font-size="11" fill="#475569">V</text>
    <text x="284" y="212" font-family="Arial, sans-serif" font-size="11" fill="#475569">I</text>
    <text x="150" y="232" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#166534">straight line through the origin</text>
    <text x="150" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#166534">constant resistance (slope = R)</text>
  </g>

  <g transform="translate(350,70)">
    <text x="160" y="18" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#334155">Non-ohmic (filament lamp)</text>
    <line x1="40" y1="30" x2="40" y2="200" stroke="#475569" stroke-width="2"/>
    <line x1="40" y1="200" x2="280" y2="200" stroke="#475569" stroke-width="2"/>
    <path d="M40,200 Q160,198 268,52" fill="none" stroke="#c2410c" stroke-width="3"/>
    <text x="24" y="48" font-family="Arial, sans-serif" font-size="11" fill="#475569">V</text>
    <text x="284" y="212" font-family="Arial, sans-serif" font-size="11" fill="#475569">I</text>
    <text x="150" y="232" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#991b1b">curve bends upward</text>
    <text x="150" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#991b1b">resistance grows as the filament heats</text>
  </g>

  <text x="320" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">A straight V–I graph means Ohm's law holds; a curved one means the resistance changes with current.</text>
</svg>
