<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#64748b"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#c2410c">Friction opposes relative motion between surfaces</text>
  <rect x="170" y="130" width="220" height="66" rx="6" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
  <text x="280" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#92400e">block</text>
  <line x1="390" y1="163" x2="540" y2="163" stroke="#16a34a" stroke-width="3.5" marker-end="url(#ar)"/>
  <text x="460" y="152" font-family="Arial, sans-serif" font-size="13" fill="#16a34a">applied force</text>
  <line x1="390" y1="200" x2="200" y2="200" stroke="#dc2626" stroke-width="3.5" marker-end="url(#ar)"/>
  <text x="290" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#dc2626">friction</text>
  <rect x="150" y="196" width="420" height="24" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <g stroke="#94a3b8" stroke-width="1.5">
    <line x1="170" y1="196" x2="170" y2="220"/><line x1="220" y1="196" x2="220" y2="220"/>
    <line x1="270" y1="196" x2="270" y2="220"/><line x1="320" y1="196" x2="320" y2="220"/>
    <line x1="370" y1="196" x2="370" y2="220"/><line x1="420" y1="196" x2="420" y2="220"/>
    <line x1="470" y1="196" x2="470" y2="220"/><line x1="520" y1="196" x2="520" y2="220"/>
  </g>
  <rect x="120" y="256" width="400" height="58" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="320" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#166534">f = µ·N — friction is proportional to the normal force N</text>
  <text x="320" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#166534">µ is the coefficient of friction between the two surfaces</text>
</svg>
