<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#c2410c"/></marker>
    <marker id="arB" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#2563eb"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#c2410c">Convection: hot fluid rises, cold fluid sinks</text>
  <g transform="translate(200,70)">
    <rect x="40" y="0" width="200" height="230" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2.5"/>
    <rect x="40" y="200" width="200" height="30" fill="#f59e0b"/>
    <text x="140" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#fff">heat source</text>
    <path d="M 140 150 A 60 60 0 0 1 210 95" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#ar)"/>
    <path d="M 140 150 A 60 60 0 0 0 70 95" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arB)"/>
    <circle cx="140" cy="150" r="9" fill="#c2410c"/>
    <text x="140" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fff">hot</text>
    <text x="110" y="60" font-family="Arial, sans-serif" font-size="12" fill="#dc2626">rises (less dense)</text>
    <text x="160" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#2563eb">sinks (denser)</text>
  </g>
  <rect x="120" y="280" width="400" height="44" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="320" y="307" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#166534">a convection current is a circulating flow driven by density changes</text>
</svg>
