<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#64748b"/></marker>
    <marker id="arA" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#c2410c"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#c2410c">Archimedes' principle: upthrust equals displaced weight</text>
  <rect x="180" y="90" width="280" height="210" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="180" y1="175" x2="460" y2="175" stroke="#0ea5e9" stroke-width="3"/>
  <text x="200" y="167" font-family="Arial, sans-serif" font-size="12" fill="#075985">water level</text>
  <rect x="270" y="135" width="100" height="90" rx="6" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
  <text x="320" y="186" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#92400e">block</text>
  <line x1="320" y1="135" x2="320" y2="60" stroke="#16a34a" stroke-width="3" marker-end="url(#arA)"/>
  <text x="350" y="72" font-family="Arial, sans-serif" font-size="13" fill="#16a34a">upthrust</text>
  <line x1="320" y1="225" x2="320" y2="285" stroke="#64748b" stroke-width="3" marker-end="url(#ar)"/>
  <text x="350" y="272" font-family="Arial, sans-serif" font-size="13" fill="#64748b">weight</text>
  <text x="70" y="120" font-family="Arial, sans-serif" font-size="12" fill="#334155">floats when</text>
  <text x="70" y="138" font-family="Arial, sans-serif" font-size="12" fill="#334155">upthrust = weight</text>
  <text x="320" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">ships float because their hollow shape displaces a huge weight of water</text>
</svg>
