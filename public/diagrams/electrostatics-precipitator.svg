<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#64748b"/></marker>
    <marker id="arA" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#c2410c"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#c2410c">The electrostatic precipitator</text>

  <rect x="100" y="80" width="360" height="170" rx="10" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <text x="280" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#334155">duct through which smoke passes</text>

  <g stroke="#94a3b8" stroke-width="1.5">
    <line x1="140" y1="110" x2="140" y2="230"/>
    <line x1="180" y1="110" x2="180" y2="230"/>
    <line x1="220" y1="110" x2="220" y2="230"/>
    <line x1="260" y1="110" x2="260" y2="230"/>
    <line x1="300" y1="110" x2="300" y2="230"/>
    <line x1="340" y1="110" x2="340" y2="230"/>
    <line x1="380" y1="110" x2="380" y2="230"/>
    <line x1="420" y1="110" x2="420" y2="230"/>
  </g>
  <text x="280" y="258" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#334155">negative wires (ionize the dust)</text>

  <rect x="120" y="120" width="16" height="90" rx="3" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
  <rect x="424" y="120" width="16" height="90" rx="3" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
  <text x="128" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#92400e">+ plate</text>
  <text x="432" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#92400e">+ plate</text>

  <g>
    <circle cx="190" cy="150" r="6" fill="#475569"/>
    <circle cx="230" cy="180" r="5" fill="#475569"/>
    <circle cx="310" cy="150" r="6" fill="#475569"/>
    <circle cx="360" cy="170" r="5" fill="#475569"/>
    <circle cx="400" cy="150" r="6" fill="#475569"/>
    <path d="M120,150 L170,150 M300,180 L424,180" stroke="#c2410c" stroke-width="2" marker-end="url(#arA)"/>
  </g>
  <text x="250" y="290" font-family="Arial, sans-serif" font-size="11" fill="#c2410c">dust particles pick up charge and are pulled onto the plates</text>

  <line x1="100" y1="140" x2="70" y2="140" stroke="#64748b" stroke-width="2"/>
  <text x="62" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#475569">dirty</text>
  <text x="62" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#475569">gas in</text>
  <line x1="460" y1="140" x2="490" y2="140" stroke="#16a34a" stroke-width="2"/>
  <text x="505" y="130" font-family="Arial, sans-serif" font-size="11" fill="#166534">clean</text>
  <text x="505" y="148" font-family="Arial, sans-serif" font-size="11" fill="#166534">gas out</text>

  <text x="320" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Charged dust is attracted to the oppositely charged plates, leaving the outgoing gas clean.</text>
</svg>
