<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <marker id="arA" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#c2410c"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#c2410c">Moment of a force: turning effect = force × lever arm</text>
  <g transform="translate(90,120)">
    <line x1="0" y1="80" x2="460" y2="80" stroke="#475569" stroke-width="5"/>
    <polygon points="100,60 130,100 70,100" fill="#94a3b8"/>
    <polygon points="115,20 145,60 85,60" fill="#cbd5e1"/>
    <line x1="115" y1="60" x2="115" y2="20" stroke="#64748b" stroke-width="2"/>
    <line x1="115" y1="0" x2="115" y2="20" stroke="#c2410c" stroke-width="4"/>
    <text x="145" y="12" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#c2410c">pivot</text>
    <line x1="60" y1="80" x2="60" y2="170" stroke="#16a34a" stroke-width="3.5" marker-end="url(#arA)"/>
    <text x="16" y="132" font-family="Arial, sans-serif" font-size="14" fill="#16a34a">force F</text>
    <line x1="60" y1="80" x2="230" y2="80" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="120" y="70" font-family="Arial, sans-serif" font-size="13" fill="#475569">lever arm d</text>
    <path d="M 140 120 A 45 45 0 0 0 165 97" fill="none" stroke="#c2410c" stroke-width="2" marker-end="url(#arA)"/>
  </g>
  <rect x="120" y="268" width="400" height="56" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="320" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#166534">moment (Nm) = force (N) × perpendicular distance (m)</text>
  <text x="320" y="312" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#166534">a longer spanner gives a bigger turning effect with the same push</text>
</svg>
