<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#64748b"/></marker>
    <marker id="arA" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#c2410c"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#c2410c">An AC generator</text>

  <rect x="90" y="120" width="54" height="130" rx="6" fill="#dc2626"/>
  <text x="117" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">N</text>
  <rect x="496" y="120" width="54" height="130" rx="6" fill="#2563eb"/>
  <text x="523" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffffff">S</text>

  <line x1="144" y1="185" x2="496" y2="185" stroke="#c2410c" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="320" y="106" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#475569">magnetic field</text>

  <g transform="translate(320,185)">
    <circle cx="0" cy="0" r="62" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
    <g transform="rotate(35)">
      <rect x="-46" y="-12" width="92" height="24" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
      <line x1="-46" y1="-12" x2="-46" y2="12" stroke="#92400e" stroke-width="2"/>
      <line x1="46" y1="-12" x2="46" y2="12" stroke="#92400e" stroke-width="2"/>
      <line x1="-60" y1="0" x2="60" y2="0" stroke="#92400e" stroke-width="2.5"/>
    </g>
    <text x="0" y="-76" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#92400e">rotating coil</text>
  </g>
  <text x="320" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#475569">turned by the turbine</text>

  <rect x="300" y="290" width="40" height="16" rx="8" fill="#475569"/>
  <text x="320" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#334155">slip rings</text>
  <rect x="294" y="316" width="52" height="6" rx="3" fill="#94a3b8"/>
  <text x="290" y="346" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#475569">brushes</text>
  <line x1="346" y1="319" x2="560" y2="319" stroke="#c2410c" stroke-width="2.5" marker-end="url(#arA)"/>
  <text x="470" y="308" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#c2410c">alternating current out</text>

  <text x="320" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Rotating the coil in the field keeps changing the flux through it, so an alternating voltage is induced.</text>
</svg>
