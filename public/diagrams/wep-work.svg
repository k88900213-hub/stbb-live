<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <marker id="arA" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#c2410c"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#c2410c">Work = force × distance along the force</text>
  <rect x="120" y="150" width="130" height="70" rx="8" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
  <text x="185" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#92400e">box</text>
  <line x1="250" y1="185" x2="420" y2="185" stroke="#c2410c" stroke-width="4" marker-end="url(#arA)"/>
  <text x="350" y="172" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#c2410c">force F</text>
  <line x1="175" y1="255" x2="380" y2="255" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arA)"/>
  <text x="250" y="276" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">displacement d</text>
  <rect x="120" y="290" width="400" height="44" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="320" y="318" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#166534">W = F·d · unit joule (J) = N·m</text>
</svg>
