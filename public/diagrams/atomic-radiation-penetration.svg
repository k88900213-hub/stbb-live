<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#64748b"/></marker>
    <marker id="arA" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#c2410c"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#c2410c">Penetrating power of alpha, beta and gamma</text>

  <g transform="translate(60,90)">
    <circle cx="0" cy="60" r="5" fill="#475569"/>
    <line x1="0" y1="60" x2="28" y2="60" stroke="#475569" stroke-width="1.5"/>
    <text x="0" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#475569">source</text>
  </g>

  <rect x="120" y="40" width="400" height="22" rx="3" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
  <text x="320" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#92400e">paper</text>
  <rect x="120" y="70" width="400" height="22" rx="3" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
  <text x="320" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#334155">aluminium</text>
  <rect x="120" y="100" width="400" height="22" rx="3" fill="#64748b"/>
  <text x="320" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">thick lead</text>

  <line x1="90" y1="44" x2="205" y2="44" stroke="#dc2626" stroke-width="3" marker-end="url(#arA)"/>
  <circle cx="215" cy="44" r="7" fill="none" stroke="#dc2626" stroke-width="2"/>
  <line x1="205" y1="44" x2="222" y2="44" stroke="#dc2626" stroke-width="2" marker-end="url(#arA)"/>
  <text x="240" y="40" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#dc2626">alpha</text>
  <text x="240" y="54" font-family="Arial, sans-serif" font-size="10" fill="#991b1b">stopped by paper</text>

  <line x1="90" y1="81" x2="240" y2="81" stroke="#2563eb" stroke-width="3" marker-end="url(#arA)"/>
  <circle cx="250" cy="81" r="7" fill="none" stroke="#2563eb" stroke-width="2"/>
  <line x1="240" y1="81" x2="257" y2="81" stroke="#2563eb" stroke-width="2" marker-end="url(#arA)"/>
  <line x1="257" y1="81" x2="345" y2="81" stroke="#2563eb" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="350" y="77" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2563eb">beta</text>
  <text x="350" y="91" font-family="Arial, sans-serif" font-size="10" fill="#1e40af">stopped by a few mm of aluminium</text>

  <line x1="90" y1="111" x2="200" y2="111" stroke="#16a34a" stroke-width="3" marker-end="url(#arA)"/>
  <path d="M200,111 Q230,99 260,111 Q290,123 320,111 Q350,99 380,111 Q410,123 440,111 Q470,99 500,111 Q530,123 560,111" fill="none" stroke="#16a34a" stroke-width="2.5"/>
  <text x="560" y="102" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#166534">gamma</text>
  <text x="520" y="146" font-family="Arial, sans-serif" font-size="10" fill="#166534">only reduced by thick lead</text>

  <rect x="120" y="170" width="400" height="60" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="320" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#166534">Ionization vs penetration trade off</text>
  <text x="320" y="208" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#166534">alpha ionizes strongly but stops easily; gamma ionizes rarely but penetrates deeply.</text>
  <text x="320" y="224" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#166534">Shielding: paper, then aluminium, then lead — depending on the radiation.</text>

  <text x="320" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Alpha is stopped by paper, beta by aluminium, and gamma only by thick lead or concrete.</text>
</svg>
