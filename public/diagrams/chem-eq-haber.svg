<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#64748b"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#047857">Haber process: yield versus rate — the compromise at 450 °C</text>

  <line x1="90" y1="280" x2="580" y2="280" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="90" y1="280" x2="90" y2="60" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <text x="584" y="300" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#334155">temperature</text>
  <text x="58" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155">amount</text>

  <g font-family="Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">
    <text x="90" y="296">100</text><text x="188" y="296">200</text>
    <text x="286" y="296">300</text><text x="384" y="296">400</text>
    <text x="482" y="296">500</text><text x="580" y="296">600</text>
  </g>

  <path d="M120,95 C200,110 330,150 540,260" fill="none" stroke="#047857" stroke-width="2.5"/>
  <text x="150" y="90" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#047857">NH₃ yield</text>

  <path d="M120,260 C200,230 330,185 540,100" fill="none" stroke="#c2410c" stroke-width="2.5"/>
  <text x="450" y="92" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#c2410c">reaction rate</text>

  <rect x="425" y="80" width="45" height="200" fill="#ecfdf5" stroke="#16a34a" stroke-width="1" opacity="0.85"/>
  <text x="447" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#047857">450 °C</text>

  <rect x="110" y="316" width="420" height="30" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="320" y="336" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" fill="#166534">Low temperature favours NH₃; the iron catalyst lets 450 °C run fast enough to be economic.</text>
</svg>
