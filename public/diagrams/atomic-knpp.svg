<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#64748b"/></marker>
    <marker id="arA" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#c2410c"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#c2410c">Karachi Nuclear Power Project (K-2 and K-3)</text>

  <path d="M60,290 Q320,270 580,290 L580,310 L60,310 Z" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="320" y="306" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1e40af">Arabian Sea (cooling water)</text>

  <g transform="translate(160,110)">
    <path d="M0,180 Q20,150 40,180 Q60,150 80,180 Q100,150 120,180 L120,190 L0,190 Z" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
    <path d="M60,180 Q60,140 60,110" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <text x="60" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#475569">cooling tower</text>
    <path d="M180,170 Q200,40 260,170" fill="none" stroke="#e2e8f0" stroke-width="4"/>
    <path d="M170,120 A70,50 0 1 1 250,120" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
    <text x="210" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#334155">K-2</text>
    <text x="210" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#475569">reactor containment</text>
    <text x="210" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#475569">grid: March 2021</text>
  </g>

  <g transform="translate(360,110)">
    <path d="M0,180 Q20,150 40,180 Q60,150 80,180 Q100,150 120,180 L120,190 L0,190 Z" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
    <path d="M60,180 Q60,140 60,110" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <text x="60" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#475569">cooling tower</text>
    <path d="M180,170 Q200,40 260,170" fill="none" stroke="#e2e8f0" stroke-width="4"/>
    <path d="M170,120 A70,50 0 1 1 250,120" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
    <text x="210" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#334155">K-3</text>
    <text x="210" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#475569">reactor containment</text>
    <text x="210" y="214" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#475569">grid: March 2022</text>
  </g>

  <line x1="430" y1="130" x2="500" y2="130" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arA)"/>
  <text x="468" y="118" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#166534">to national grid</text>
  <rect x="500" y="150" width="120" height="46" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="560" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#166534">passive safety</text>
  <text x="560" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#166534">systems cool the reactor</text>
  <text x="560" y="196" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#166534">without power or operators</text>

  <rect x="140" y="250" width="360" height="30" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="320" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#166534">Pressurized-water reactors (ACP1000) — clean electricity without carbon dioxide</text>

  <text x="320" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">K-2 and K-3 add thousands of megawatts of clean nuclear power to Pakistan's grid.</text>
</svg>
