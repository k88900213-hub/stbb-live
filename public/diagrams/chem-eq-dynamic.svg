<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#64748b"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#047857">Dynamic equilibrium: forward rate = reverse rate</text>

  <line x1="90" y1="280" x2="580" y2="280" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="90" y1="280" x2="90" y2="60" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <text x="584" y="300" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#334155">time</text>
  <text x="58" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155">rate</text>

  <path d="M110,90 C200,102 320,160 420,190" fill="none" stroke="#047857" stroke-width="2.5"/>
  <text x="140" y="84" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#047857">forward rate</text>

  <path d="M110,280 C200,266 320,216 420,190" fill="none" stroke="#c2410c" stroke-width="2.5"/>
  <text x="150" y="272" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#c2410c">reverse rate</text>

  <line x1="110" y1="190" x2="560" y2="190" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5,4"/>
  <line x1="420" y1="280" x2="420" y2="60" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5,4"/>
  <text x="432" y="84" font-family="Arial, sans-serif" font-size="12" fill="#334155">rates become equal</text>
  <text x="432" y="268" font-family="Arial, sans-serif" font-size="12" fill="#334155">equilibrium</text>

  <rect x="110" y="316" width="420" height="30" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="320" y="336" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" fill="#166534">Both reactions still happen at equal rates — concentrations stay constant, no net change.</text>
</svg>
