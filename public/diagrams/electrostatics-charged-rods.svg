<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#64748b"/></marker>
    <marker id="arA" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#c2410c"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#c2410c">Two plastic rods repel after rubbing with wool</text>

  <line x1="150" y1="90" x2="150" y2="250" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="490" y1="90" x2="490" y2="250" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="130" y="74" width="40" height="18" rx="3" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <rect x="470" y="74" width="40" height="18" rx="3" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <text x="150" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#475569">string</text>
  <text x="490" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#475569">string</text>

  <rect x="118" y="96" width="64" height="170" rx="10" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
  <rect x="458" y="96" width="64" height="170" rx="10" fill="#fde68a" stroke="#b45309" stroke-width="2"/>
  <text x="150" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#dc2626">−</text>
  <text x="490" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#dc2626">−</text>
  <text x="150" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#92400e">plastic rod</text>
  <text x="490" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#92400e">plastic rod</text>

  <line x1="215" y1="180" x2="300" y2="180" stroke="#c2410c" stroke-width="2.5" marker-end="url(#arA)"/>
  <line x1="425" y1="180" x2="340" y2="180" stroke="#c2410c" stroke-width="2.5" marker-end="url(#arA)"/>
  <text x="320" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#c2410c">repel</text>

  <rect x="210" y="210" width="220" height="46" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="320" y="228" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#991b1b">Both rods gained electrons from the wool,</text>
  <text x="320" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#991b1b">so both carry the same negative charge.</text>

  <text x="320" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Like charges repel — the two similarly charged rods push each other apart.</text>
</svg>
