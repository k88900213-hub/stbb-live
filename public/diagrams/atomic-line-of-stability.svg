<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#64748b"/></marker>
    <marker id="arA" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#c2410c"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#c2410c">The line of stability</text>

  <line x1="90" y1="70" x2="90" y2="300" stroke="#475569" stroke-width="2"/>
  <line x1="90" y1="300" x2="590" y2="300" stroke="#475569" stroke-width="2"/>
  <text x="70" y="90" font-family="Arial, sans-serif" font-size="12" fill="#334155">N</text>
  <text x="70" y="308" font-family="Arial, sans-serif" font-size="12" fill="#334155">(neutrons)</text>
  <text x="600" y="308" font-family="Arial, sans-serif" font-size="12" fill="#334155">Z (protons)</text>
  <line x1="90" y1="90" x2="430" y2="90" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="90" y1="90" x2="90" y2="300" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="270" y="82" font-family="Arial, sans-serif" font-size="11" fill="#475569">N = Z line</text>

  <path d="M90,290 Q180,210 280,180 Q400,150 560,120" fill="none" stroke="#c2410c" stroke-width="8" stroke-linecap="round" opacity="0.55"/>
  <path d="M90,290 Q180,210 280,180 Q400,150 560,120" fill="none" stroke="#c2410c" stroke-width="2.5" stroke-dasharray="1 0"/>
  <text x="300" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#c2410c">line of stability</text>
  <text x="300" y="206" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#c2410c">(stable nuclei)</text>

  <g fill="#475569">
    <circle cx="120" cy="270" r="4"/><circle cx="150" cy="255" r="4"/><circle cx="180" cy="240" r="4"/>
    <circle cx="210" cy="225" r="4"/><circle cx="240" cy="215" r="4"/><circle cx="270" cy="205" r="4"/>
    <circle cx="300" cy="195" r="4"/><circle cx="330" cy="186" r="4"/><circle cx="360" cy="178" r="4"/>
    <circle cx="400" cy="168" r="4"/><circle cx="440" cy="158" r="4"/><circle cx="480" cy="148" r="4"/>
    <circle cx="520" cy="138" r="4"/><circle cx="555" cy="128" r="4"/>
  </g>

  <rect x="110" y="90" width="130" height="70" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="175" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#991b1b">unstable</text>
  <text x="175" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#991b1b">too many protons</text>
  <text x="175" y="144" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#991b1b">→ beta-plus / decay</text>

  <rect x="420" y="90" width="150" height="70" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="495" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#991b1b">unstable</text>
  <text x="495" y="128" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#991b1b">too many neutrons</text>
  <text x="495" y="144" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#991b1b">→ beta-minus decay</text>

  <text x="320" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Light nuclei are stable at N ≈ Z; heavy nuclei need extra neutrons to stay bound.</text>
</svg>
