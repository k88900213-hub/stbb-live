<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <marker id="arG" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#047857"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#047857">The dissolving process: polar water surrounds each solute particle</text>

  <g font-family="Arial, sans-serif">
    <path d="M150,140 l6,158 h328 l6,-158 z" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
    <rect x="150" y="134" width="340" height="10" rx="3" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
    <text x="320" y="120" text-anchor="middle" font-size="12" fill="#334155">water (solvent)</text>

    <g fill="#ffffff" stroke="#94a3b8" stroke-width="1.5">
      <rect x="190" y="278" width="22" height="18" rx="3"/>
      <rect x="218" y="284" width="20" height="16" rx="3"/>
      <rect x="205" y="262" width="20" height="16" rx="3"/>
      <rect x="244" y="276" width="20" height="16" rx="3"/>
    </g>
    <text x="216" y="320" text-anchor="middle" font-size="11" fill="#92400e">sugar crystal</text>

    <circle cx="360" cy="230" r="16" fill="#fecaca" stroke="#dc2626" stroke-width="2"/>
    <text x="360" y="235" text-anchor="middle" font-size="12" font-weight="bold" fill="#991b1b">Na⁺</text>

    <g>
      <circle cx="325" cy="205" r="8" fill="#ef4444"/>
      <circle cx="321" cy="200" r="3.5" fill="#ffffff"/>
      <circle cx="329" cy="200" r="3.5" fill="#ffffff"/>
      <circle cx="395" cy="205" r="8" fill="#ef4444"/>
      <circle cx="391" cy="200" r="3.5" fill="#ffffff"/>
      <circle cx="399" cy="200" r="3.5" fill="#ffffff"/>
      <circle cx="360" cy="190" r="8" fill="#ef4444"/>
      <circle cx="356" cy="185" r="3.5" fill="#ffffff"/>
      <circle cx="364" cy="185" r="3.5" fill="#ffffff"/>
      <circle cx="360" cy="260" r="8" fill="#ef4444"/>
      <circle cx="356" cy="255" r="3.5" fill="#ffffff"/>
      <circle cx="364" cy="255" r="3.5" fill="#ffffff"/>
    </g>
    <text x="360" y="288" text-anchor="middle" font-size="11" fill="#1e40af">hydration shell</text>

    <path d="M252,270 C300,245 320,240 344,232" stroke="#047857" stroke-width="2" fill="none" marker-end="url(#arG)"/>
    <path d="M268,276 C310,258 330,250 352,244" stroke="#047857" stroke-width="2" fill="none" marker-end="url(#arG)"/>
    <path d="M244,282 C290,268 320,258 356,246" stroke="#047857" stroke-width="2" fill="none" marker-end="url(#arG)"/>
  </g>

  <text x="320" y="336" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">Water molecules pull ions and molecules apart, one by one</text>
  <text x="320" y="354" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">This is why salt and sugar disappear when stirred into water</text>
</svg>
