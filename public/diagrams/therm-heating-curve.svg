<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#c2410c">Heating curve: ice to water to steam</text>
  <g transform="translate(70,60)">
    <line x1="0" y1="240" x2="520" y2="240" stroke="#475569" stroke-width="2"/>
    <line x1="0" y1="240" x2="0" y2="20" stroke="#475569" stroke-width="2"/>
    <text x="260" y="262" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#334155">heat added →</text>
    <text x="-10" y="55" transform="rotate(-90,-10,140)" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#334155">temperature</text>
    <g stroke="#94a3b8" stroke-width="1">
      <line x1="0" y1="160" x2="520" y2="160"/><line x1="0" y1="100" x2="520" y2="100"/>
      <line x1="130" y1="20" x2="130" y2="240"/><line x1="260" y1="20" x2="260" y2="240"/><line x1="390" y1="20" x2="390" y2="240"/>
    </g>
    <polyline points="0,200 130,100 130,100 260,100 260,40 390,40 390,40 520,40" fill="none" stroke="#c2410c" stroke-width="3.5" stroke-linejoin="round"/>
    <text x="20" y="220" font-family="Arial, sans-serif" font-size="12" fill="#334155">ice warms</text>
    <text x="110" y="150" font-family="Arial, sans-serif" font-size="12" fill="#16a34a">0 °C — melting (flat)</text>
    <text x="210" y="85" font-family="Arial, sans-serif" font-size="12" fill="#334155">water warms</text>
    <text x="360" y="120" font-family="Arial, sans-serif" font-size="12" fill="#16a34a">100 °C — boiling (flat)</text>
    <text x="420" y="60" font-family="Arial, sans-serif" font-size="12" fill="#334155">steam warms</text>
  </g>
  <text x="320" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">during melting and boiling the temperature is steady — latent heat is absorbed</text>
</svg>
