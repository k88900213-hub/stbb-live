<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#047857">Layers of the atmosphere</text>

  <rect x="200" y="55" width="280" height="26" rx="4" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="340" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#3730a3">exosphere (outermost, into space)</text>

  <rect x="200" y="83" width="280" height="34" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="340" y="104" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#5b21b6">thermosphere (85–600 km, auroras)</text>

  <rect x="200" y="119" width="280" height="34" rx="4" fill="#cffafe" stroke="#0891b2" stroke-width="1.5"/>
  <text x="340" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#155e75">mesosphere (50–85 km, meteors burn)</text>

  <rect x="200" y="155" width="280" height="46" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="340" y="176" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#14532d">stratosphere (12–50 km)</text>
  <rect x="250" y="182" width="180" height="14" rx="4" fill="#86efac"/>
  <text x="340" y="193" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold" fill="#14532d">ozone layer</text>

  <rect x="200" y="203" width="280" height="46" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="340" y="224" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#1e40af">troposphere (0–12 km, weather)</text>
  <path d="M250,240 q10,-8 20,0 q10,-8 20,0" fill="none" stroke="#94a3b8" stroke-width="1.6"/>
  <path d="M390,244 q10,-8 20,0 q10,-8 20,0" fill="none" stroke="#94a3b8" stroke-width="1.6"/>

  <rect x="120" y="255" width="400" height="28" rx="4" fill="#b45309" stroke="#92400e" stroke-width="1.5"/>
  <text x="320" y="274" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" font-weight="bold" fill="#ffffff">earth's surface</text>

  <g font-family="Arial, sans-serif" font-size="11.5" fill="#475569">
    <text x="496" y="72">≈ 500 km up</text>
    <text x="496" y="104">auroras</text>
    <text x="496" y="140">coldest</text>
    <text x="496" y="176">dry and stable</text>
    <text x="496" y="224">most water vapour</text>
  </g>

  <rect x="110" y="316" width="420" height="30" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="320" y="336" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" fill="#166534">Temperature falls through the troposphere but rises in the stratosphere because of ozone.</text>
</svg>
