<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#64748b"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#047857">Fractional distillation of crude oil</text>

  <line x1="300" y1="108" x2="300" y2="260" stroke="#c2410c" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="292" y="180" text-anchor="end" font-family="Arial, sans-serif" font-size="11.5" fill="#c2410c">hot vapour rises</text>

  <g>
    <rect x="150" y="70" width="220" height="220" rx="6" fill="#fff7ed" stroke="#b45309" stroke-width="2"/>
    <line x1="150" y1="120" x2="370" y2="120" stroke="#b45309" stroke-width="1.5"/>
    <line x1="150" y1="170" x2="370" y2="170" stroke="#b45309" stroke-width="1.5"/>
    <line x1="150" y1="220" x2="370" y2="220" stroke="#b45309" stroke-width="1.5"/>
    <line x1="150" y1="150" x2="370" y2="150" stroke="#b45309" stroke-width="1.5"/>
    <line x1="150" y1="200" x2="370" y2="200" stroke="#b45309" stroke-width="1.5"/>
    <line x1="150" y1="250" x2="370" y2="250" stroke="#b45309" stroke-width="1.5"/>
  </g>

  <g font-family="Arial, sans-serif" font-size="12" fill="#334155">
    <text x="395" y="100">gases / LPG (C₁–C₄)</text>
    <text x="395" y="140">petrol (C₅–C₁₂)</text>
    <text x="395" y="173">kerosene (C₁₂–C₁₆)</text>
    <text x="395" y="223">diesel (C₁₅–C₁₈)</text>
    <text x="395" y="248">lubricating oil / wax</text>
    <text x="395" y="278">bitumen (heavy)</text>
  </g>

  <line x1="80" y1="270" x2="148" y2="270" stroke="#475569" stroke-width="2" marker-end="url(#ar)"/>
  <text x="80" y="262" font-family="Arial, sans-serif" font-size="12" fill="#334155">crude oil</text>

  <g>
    <path d="M250,290 L250,318 L260,318 L260,322 L240,322 L240,318 L250,318 Z" fill="#fde68a" stroke="#b45309" stroke-width="1"/>
    <text x="250" y="312" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#92400e">flame</text>
  </g>
  <text x="320" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#92400e">hot at the bottom, cool at the top</text>

  <rect x="110" y="336" width="420" height="20" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="320" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#166534">Short-chain hydrocarbons boil low and rise highest; long chains condense near the bottom.</text>
</svg>
