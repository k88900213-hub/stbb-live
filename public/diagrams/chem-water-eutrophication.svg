<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#64748b"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#047857">Eutrophication: nutrients turn a lake green</text>

  <g>
    <rect x="60" y="70" width="120" height="70" rx="6" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
    <line x1="60" y1="90" x2="180" y2="90" stroke="#16a34a" stroke-width="3"/>
    <line x1="60" y1="100" x2="150" y2="100" stroke="#16a34a" stroke-width="3"/>
    <line x1="60" y1="110" x2="160" y2="110" stroke="#16a34a" stroke-width="3"/>
    <text x="120" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#92400e">fertiliser runoff</text>
  </g>

  <line x1="180" y1="115" x2="230" y2="160" stroke="#c2410c" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="180" y="140" font-family="Arial, sans-serif" font-size="11.5" fill="#c2410c">N, P</text>

  <rect x="240" y="80" width="330" height="200" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <path d="M250,110 Q320,90 390,110 Q460,90 560,110" fill="none" stroke="#16a34a" stroke-width="3"/>
  <text x="330" y="102" font-family="Arial, sans-serif" font-size="12" fill="#166534" font-weight="bold">algae bloom on the surface</text>

  <g stroke="#94a3b8" stroke-width="1.5">
    <line x1="290" y1="150" x2="290" y2="250"/>
    <line x1="340" y1="150" x2="340" y2="250"/>
    <line x1="390" y1="150" x2="390" y2="250"/>
    <line x1="440" y1="150" x2="440" y2="250"/>
  </g>
  <text x="340" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#1e40af">sunlight blocked →</text>
  <text x="340" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#1e40af">plants below die</text>
  <text x="340" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#1e40af">decay consumes dissolved oxygen</text>

  <g>
    <path d="M480,180 l12,-14 l12,14 Z" fill="#64748b"/>
    <path d="M500,180 l12,-14 l12,14 Z" fill="#64748b"/>
    <text x="500" y="150" font-family="Arial, sans-serif" font-size="11.5" fill="#475569" font-weight="bold">fish die</text>
  </g>

  <rect x="110" y="310" width="420" height="36" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="320" y="326" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" fill="#166534">1 fertilisers → 2 algal bloom → 3 oxygen falls → 4 aquatic life dies.</text>
  <text x="320" y="341" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#166534">Phosphate detergents and farm runoff are the main culprits.</text>
</svg>
