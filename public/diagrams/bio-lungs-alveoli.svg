    <path d="M426,196 L426,230 M426,230 L400,250 M426,230 L452,250 M426,230 L426,258"/>
  </g>
  <g fill="#fda4af" stroke="#be123c" stroke-width="1">
    <circle cx="184" cy="254" r="4.5"/><circle cx="198" cy="260" r="4.5"/><circle cx="212" cy="256" r="4.5"/>
    <circle cx="232" cy="254" r="4.5"/><circle cx="396" cy="254" r="4.5"/><circle cx="412" cy="260" r="4.5"/>
    <circle cx="428" cy="258" r="4.5"/><circle cx="448" cy="254" r="4.5"/>
