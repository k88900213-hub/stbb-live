  <path d="M130,312 Q200,292 320,308 Q440,292 510,312" fill="none" stroke="#64748b" stroke-width="2"/>
  <text x="320" y="332" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155">diaphragm (the sheet of muscle below the lungs)</text>

  <text x="320" y="352" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">air path: nasal cavity → trachea → bronchi → bronchioles → alveoli</text>
