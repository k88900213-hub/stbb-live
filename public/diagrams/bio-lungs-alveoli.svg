<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#64748b"/></marker>
    <marker id="arA" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#c2410c"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="26" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#0369a1">The human respiratory system: airways and alveoli</text>

  <g fill="#cbd5e1" stroke="#475569">
    <path d="M282,46 L358,46 L352,78 L288,78 Z"/>
    <rect x="308" y="78" width="24" height="18"/>
    <path d="M316,96 L316,152" stroke-width="12" fill="none"/>
    <path d="M316,152 L316,172 L238,196 L214,196" stroke-width="7" fill="none"/>
    <path d="M316,152 L316,172 L402,196 L426,196" stroke-width="7" fill="none"/>
  </g>
  <text x="298" y="66" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155">nasal cavity</text>
  <text x="366" y="70" font-family="Arial, sans-serif" font-size="12" fill="#334155">larynx</text>
  <text x="294" y="130" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#334155">trachea</text>
  <text x="150" y="188" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#334155">bronchi</text>

  <ellipse cx="196" cy="248" rx="76" ry="62" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
  <ellipse cx="444" cy="248" rx="82" ry="64" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>

