  <text x="444" y="326" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#92400e">right lung</text>

  <circle cx="548" cy="120" r="48" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <circle cx="534" cy="112" r="8" fill="#fda4af" stroke="#be123c" stroke-width="1"/>
  <circle cx="556" cy="108" r="8" fill="#fda4af" stroke="#be123c" stroke-width="1"/>
  <circle cx="548" cy="128" r="8" fill="#fda4af" stroke="#be123c" stroke-width="1"/>
  <circle cx="568" cy="124" r="8" fill="#fda4af" stroke="#be123c" stroke-width="1"/>
  <circle cx="528" cy="126" r="8" fill="#fda4af" stroke="#be123c" stroke-width="1"/>
  <text x="548" y="184" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155">alveoli (air sacs)</text>
