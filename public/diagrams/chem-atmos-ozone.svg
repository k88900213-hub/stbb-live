<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#c2410c"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#047857">The ozone layer shields Earth from ultraviolet radiation</text>

  <circle cx="120" cy="70" r="36" fill="#facc15"/>
  <text x="120" y="76" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#78350f">SUN</text>

  <g stroke="#c2410c" stroke-width="2.5">
    <line x1="150" y1="85" x2="280" y2="150" marker-end="url(#ar)"/>
    <line x1="150" y1="70" x2="280" y2="130" marker-end="url(#ar)"/>
    <line x1="150" y1="55" x2="280" y2="110" marker-end="url(#ar)"/>
  </g>
  <text x="215" y="95" font-family="Arial, sans-serif" font-size="12" fill="#c2410c" font-weight="bold">UV-B, UV-C</text>

  <rect x="280" y="100" width="280" height="70" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="420" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#14532d">ozone layer (stratosphere)</text>
  <g font-family="Arial, sans-serif" font-size="12" fill="#14532d">
    <circle cx="310" cy="150" r="7" fill="none" stroke="#14532d" stroke-width="1.5"/>
    <circle cx="340" cy="160" r="7" fill="none" stroke="#14532d" stroke-width="1.5"/>
    <circle cx="375" cy="150" r="7" fill="none" stroke="#14532d" stroke-width="1.5"/>
    <circle cx="410" cy="160" r="7" fill="none" stroke="#14532d" stroke-width="1.5"/>
    <circle cx="445" cy="150" r="7" fill="none" stroke="#14532d" stroke-width="1.5"/>
    <text x="310" y="147">O₃</text><text x="340" y="157">O₃</text>
    <text x="375" y="147">O₃</text><text x="410" y="157">O₃</text>
    <text x="445" y="147">O₃</text>
  </g>

  <g stroke="#c2410c" stroke-width="2" opacity="0.45">
    <line x1="300" y1="170" x2="330" y2="240"/>
    <line x1="350" y1="170" x2="370" y2="240"/>
    <line x1="420" y1="170" x2="430" y2="240"/>
    <line x1="490" y1="170" x2="500" y2="240"/>
  </g>

  <path d="M80,290 Q120,270 160,290 Q200,270 240,290 Q280,270 320,290 Q360,270 400,290 Q440,270 480,290 Q520,270 560,290" fill="none" stroke="#2563eb" stroke-width="4"/>
  <text x="320" y="318" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" fill="#1e40af" font-weight="bold">life on earth — protected from harmful UV</text>

  <rect x="110" y="330" width="420" height="24" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="320" y="346" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#166534">O₂ + UV → 2O, then O₂ + O → O₃ — ozone is made and destroyed by sunlight itself.</text>
</svg>
