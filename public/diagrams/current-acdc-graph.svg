<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#64748b"/></marker>
    <marker id="arA" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#c2410c"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#c2410c">Direct current and alternating current</text>

  <text x="160" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#334155">Direct current (DC)</text>
  <line x1="80" y1="110" x2="80" y2="220" stroke="#475569" stroke-width="1.5"/>
  <line x1="80" y1="220" x2="290" y2="220" stroke="#475569" stroke-width="1.5"/>
  <line x1="80" y1="150" x2="290" y2="150" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5 4"/>
  <line x1="80" y1="150" x2="280" y2="150" stroke="#c2410c" stroke-width="3" marker-end="url(#arA)"/>
  <text x="60" y="154" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#475569">I</text>
  <text x="185" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#475569">constant value, one direction</text>

  <text x="470" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#334155">Alternating current (AC, 50 Hz)</text>
  <line x1="380" y1="110" x2="380" y2="220" stroke="#475569" stroke-width="1.5"/>
  <line x1="380" y1="220" x2="590" y2="220" stroke="#475569" stroke-width="1.5"/>
  <line x1="380" y1="165" x2="590" y2="165" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5 4"/>
  <path d="M380,165 Q396,165 404,128 T428,202 T452,128 T476,202 T500,128 T524,202 T548,128 T566,172" fill="none" stroke="#c2410c" stroke-width="3"/>
  <text x="375" y="130" font-family="Arial, sans-serif" font-size="11" fill="#16a34a">+</text>
  <text x="375" y="205" font-family="Arial, sans-serif" font-size="11" fill="#dc2626">−</text>
  <line x1="404" y1="218" x2="428" y2="218" stroke="#dc2626" stroke-width="2" marker-end="url(#ar)"/>
  <text x="416" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#dc2626">one cycle = 1/50 s = 0.02 s</text>
  <text x="485" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#475569">reverses direction every half cycle</text>

  <text x="320" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Batteries give steady DC; the mains gives AC that reverses direction 100 times per second in Pakistan.</text>
</svg>
