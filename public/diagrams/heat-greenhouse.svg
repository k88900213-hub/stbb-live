<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#c2410c"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#c2410c">Greenhouse effect in a greenhouse</text>
  <g transform="translate(170,90)">
    <path d="M40,200 L40,60 Q150,20 260,60 L260,200 Z" fill="#dbeafe" stroke="#475569" stroke-width="2"/>
    <rect x="40" y="200" width="220" height="26" fill="#94a3b8"/>
    <g stroke="#94a3b8" stroke-width="1.5">
      <line x1="40" y1="60" x2="260" y2="60"/><line x1="100" y1="40" x2="100" y2="200"/>
      <line x1="200" y1="40" x2="200" y2="200"/>
    </g>
    <path d="M60,60 Q90,20 130,15" fill="none" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#ar)"/>
    <text x="60" y="55" font-family="Arial, sans-serif" font-size="11" fill="#b45309">sunlight in</text>
    <path d="M240,70 Q210,100 200,140" fill="none" stroke="#dc2626" stroke-width="2.5"/>
    <path d="M190,150 Q205,170 210,190" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#ar)"/>
    <text x="245" y="130" font-family="Arial, sans-serif" font-size="11" fill="#dc2626">heat trapped inside</text>
    <rect x="100" y="150" width="80" height="24" rx="4" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
    <text x="140" y="166" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#92400e">plants</text>
  </g>
  <text x="320" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#334155">glass lets short-wavelength light in but blocks the longer heat waves escaping</text>
  <text x="320" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">the Earth's atmosphere does the same — greenhouse gases keep the planet warm</text>
</svg>
