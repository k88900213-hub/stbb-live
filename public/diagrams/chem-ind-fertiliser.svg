<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#047857">Fertilisers replace the NPK nutrients</text>

  <g>
    <rect x="60" y="200" width="180" height="120" rx="6" fill="#92400e"/>
    <rect x="60" y="200" width="180" height="26" fill="#78350f"/>
    <text x="150" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#ffffff" font-weight="bold">NPK fertiliser bag</text>
    <text x="150" y="260" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#fde68a">N · P · K</text>
    <text x="150" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#fde68a">15 · 15 · 15</text>
    <text x="150" y="302" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" fill="#fde68a">urea, ammonium nitrate,</text>
    <text x="150" y="316" text-anchor="middle" font-family="Arial, sans-serif" font-size="10.5" fill="#fde68a">superphosphate, potash</text>
  </g>

  <g stroke="#c2410c" stroke-width="2.5" marker-end="url(#ar)">
    <line x1="245" y1="240" x2="300" y2="210"/>
    <line x1="245" y1="270" x2="300" y2="250"/>
    <line x1="245" y1="300" x2="300" y2="290"/>
  </g>

  <g font-family="Arial, sans-serif">
    <text x="272" y="210" font-size="14" font-weight="bold" fill="#c2410c">N</text>
    <text x="272" y="250" font-size="14" font-weight="bold" fill="#c2410c">P</text>
    <text x="272" y="290" font-size="14" font-weight="bold" fill="#c2410c">K</text>

    <rect x="330" y="60" width="260" height="60" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
    <text x="460" y="86" text-anchor="middle" font-size="12" fill="#166534" font-weight="bold">N — nitrogen</text>
    <text x="460" y="106" text-anchor="middle" font-size="11" fill="#166534">proteins, chlorophyll, growth</text>

    <rect x="330" y="130" width="260" height="60" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="460" y="156" text-anchor="middle" font-size="12" fill="#1e40af" font-weight="bold">P — phosphorus</text>
    <text x="460" y="176" text-anchor="middle" font-size="11" fill="#1e40af">DNA, membranes, energy (ATP)</text>

    <rect x="330" y="200" width="260" height="60" rx="8" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
    <text x="460" y="226" text-anchor="middle" font-size="12" fill="#92400e" font-weight="bold">K — potassium</text>
    <text x="460" y="246" text-anchor="middle" font-size="11" fill="#92400e">water balance, enzymes</text>

    <text x="460" y="290" text-anchor="middle" font-size="11.5" fill="#475569">roots absorb the dissolved nutrients</text>
  </g>

  <line x1="340" y1="320" x2="340" y2="275" stroke="#64748b" stroke-width="2"/>
  <line x1="400" y1="320" x2="400" y2="275" stroke="#64748b" stroke-width="2"/>
  <path d="M340,320 Q370,300 400,320" fill="none" stroke="#64748b" stroke-width="2"/>

  <rect x="110" y="330" width="420" height="24" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="320" y="346" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#166534">Crops remove these nutrients; fertilisers replace them — but excess washes away as pollution.</text>
</svg>
