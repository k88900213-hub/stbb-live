<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#64748b"/></marker>
    <marker id="arA" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#c2410c"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#c2410c">Myopia and hypermetropia and their correction</text>

  <g transform="translate(30,50)">
    <text x="90" y="14" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">Myopia (short-sight)</text>
    <ellipse cx="60" cy="60" rx="52" ry="34" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <ellipse cx="30" cy="60" rx="12" ry="34" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
    <text x="34" y="64" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#92400e">lens</text>
    <line x1="20" y1="34" x2="108" y2="60" stroke="#c2410c" stroke-width="2"/>
    <line x1="20" y1="86" x2="108" y2="60" stroke="#c2410c" stroke-width="2"/>
    <line x1="104" y1="60" x2="118" y2="60" stroke="#dc2626" stroke-width="4"/>
    <text x="102" y="44" font-family="Arial, sans-serif" font-size="10" fill="#dc2626">focus</text>
    <text x="118" y="72" font-family="Arial, sans-serif" font-size="10" fill="#475569">retina</text>
    <text x="60" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#991b1b">image forms in front of the retina</text>
    <path d="M20,60 L8,60" stroke="#64748b" stroke-width="3"/>
    <path d="M20,60 A16,16 0 0 0 10,52" fill="none" stroke="#64748b" stroke-width="2"/>
    <text x="-2" y="140" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2563eb">Concave lens</text>
    <text x="60" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1e40af">spreads the rays so they meet on the retina</text>
  </g>

  <g transform="translate(340,50)">
    <text x="90" y="14" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">Hypermetropia (long-sight)</text>
    <ellipse cx="60" cy="60" rx="40" ry="34" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <ellipse cx="30" cy="60" rx="12" ry="34" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
    <text x="34" y="64" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#92400e">lens</text>
    <line x1="20" y1="34" x2="100" y2="70" stroke="#c2410c" stroke-width="2"/>
    <line x1="20" y1="86" x2="100" y2="70" stroke="#c2410c" stroke-width="2"/>
    <line x1="92" y1="70" x2="106" y2="70" stroke="#dc2626" stroke-width="4"/>
    <text x="104" y="46" font-family="Arial, sans-serif" font-size="10" fill="#dc2626">focus</text>
    <text x="96" y="88" font-family="Arial, sans-serif" font-size="10" fill="#475569">retina</text>
    <text x="60" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#991b1b">image would form behind the retina</text>
    <path d="M6,60 L18,60" stroke="#64748b" stroke-width="3"/>
    <path d="M14,48 L22,56 L30,60" fill="none" stroke="#64748b" stroke-width="2.5"/>
    <text x="0" y="140" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2563eb">Convex lens</text>
    <text x="60" y="156" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1e40af">converges the rays to meet on the retina</text>
  </g>

  <text x="320" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Short-sight needs a concave lens; long-sight needs a convex lens — each bends the rays so they focus exactly on the retina.</text>
</svg>
