<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#64748b"/></marker>
    <marker id="arA" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#c2410c"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#c2410c">Image formation by a convex lens</text>

  <line x1="40" y1="180" x2="600" y2="180" stroke="#64748b" stroke-width="1.5"/>
  <path d="M320,90 Q360,180 320,270 Q280,180 320,90 Z" fill="#bfdbfe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="320" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1e40af">O</text>

  <circle cx="240" cy="180" r="3.5" fill="#c2410c"/>
  <circle cx="160" cy="180" r="3.5" fill="#c2410c"/>
  <circle cx="400" cy="180" r="3.5" fill="#c2410c"/>
  <circle cx="480" cy="180" r="3.5" fill="#c2410c"/>
  <text x="240" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#334155">F</text>
  <text x="160" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#334155">2F</text>
  <text x="400" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#334155">F′</text>
  <text x="480" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#334155">2F′</text>
  <text x="540" y="170" font-family="Arial, sans-serif" font-size="11" fill="#475569">principal axis</text>

  <line x1="80" y1="110" x2="80" y2="180" stroke="#dc2626" stroke-width="4"/>
  <line x1="80" y1="110" x2="68" y2="120" stroke="#dc2626" stroke-width="2"/>
  <line x1="80" y1="110" x2="92" y2="120" stroke="#dc2626" stroke-width="2"/>
  <text x="45" y="100" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#dc2626">object</text>

  <line x1="440" y1="180" x2="440" y2="215" stroke="#16a34a" stroke-width="4"/>
  <line x1="440" y1="215" x2="428" y2="205" stroke="#16a34a" stroke-width="2"/>
  <line x1="440" y1="215" x2="452" y2="205" stroke="#16a34a" stroke-width="2"/>
  <text x="470" y="250" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#166534">real, inverted image</text>

  <line x1="80" y1="110" x2="318" y2="110" stroke="#c2410c" stroke-width="2.5" marker-end="url(#arA)"/>
  <line x1="318" y1="110" x2="440" y2="215" stroke="#c2410c" stroke-width="2.5" marker-end="url(#arA)"/>
  <text x="270" y="100" font-family="Arial, sans-serif" font-size="11" fill="#c2410c">parallel ray → passes through F′</text>

  <line x1="80" y1="110" x2="320" y2="180" stroke="#c2410c" stroke-width="2.5" marker-end="url(#arA)"/>
  <line x1="320" y1="180" x2="440" y2="215" stroke="#c2410c" stroke-width="2.5" marker-end="url(#arA)"/>
  <text x="160" y="162" font-family="Arial, sans-serif" font-size="11" fill="#c2410c">ray through O — no bending</text>

  <line x1="80" y1="110" x2="240" y2="180" stroke="#c2410c" stroke-width="2.5" marker-end="url(#arA)"/>
  <line x1="240" y1="180" x2="320" y2="215" stroke="#c2410c" stroke-width="2.5" marker-end="url(#arA)"/>
  <line x1="320" y1="215" x2="545" y2="215" stroke="#c2410c" stroke-width="2.5" marker-end="url(#arA)"/>
  <text x="360" y="205" font-family="Arial, sans-serif" font-size="11" fill="#c2410c">ray through F → emerges parallel</text>

  <rect x="90" y="284" width="460" height="32" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="320" y="298" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#166534">object beyond 2F → real, inverted, diminished image between F′ and 2F′</text>
  <text x="320" y="313" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#166534">object inside F → virtual, upright, enlarged image on the same side (magnifying glass)</text>

  <text x="320" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">The same three special rays work for mirrors and for lenses.</text>
</svg>
