<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#64748b"/></marker>
    <marker id="arA" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#c2410c"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#c2410c">Damping in a car shock absorber</text>

  <text x="160" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#334155">The shock absorber</text>
  <rect x="70" y="160" width="180" height="16" rx="4" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <text x="160" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155">car body (spring)</text>
  <path d="M110,176 L110,220" stroke="#94a3b8" stroke-width="3"/>
  <path d="M130,176 L130,200 L210,200 L210,176 M170,176 L170,200" stroke="#94a3b8" stroke-width="3" fill="none"/>
  <path d="M110,220 L210,220 M130,208 L130,232 M170,208 L170,232 M190,208 L190,232 M150,208 L150,232" stroke="#475569" stroke-width="2.5"/>
  <text x="160" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#475569">spring coils (flexible)</text>
  <rect x="105" y="255" width="110" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="160" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1e40af">piston in oil</text>
  <text x="160" y="282" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#1e40af">(friction converts energy to heat)</text>
  <rect x="60" y="289" width="200" height="12" rx="3" fill="#475569"/>
  <text x="160" y="318" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155">wheel / road</text>

  <line x1="320" y1="100" x2="320" y2="310" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="475" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#334155">The damped oscillation</text>
  <line x1="345" y1="90" x2="345" y2="280" stroke="#475569" stroke-width="1.5"/>
  <line x1="345" y1="280" x2="610" y2="280" stroke="#475569" stroke-width="1.5"/>
  <line x1="345" y1="185" x2="610" y2="185" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4"/>
  <path d="M345,185 Q360,185 368,140 T391,230 T414,160 T437,215 T460,175 T483,205 T506,188 T529,196 T552,192 T575,195 T598,193" fill="none" stroke="#c2410c" stroke-width="3"/>
  <text x="380" y="122" font-family="Arial, sans-serif" font-size="12" fill="#dc2626">peaks shrink</text>
  <text x="480" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#475569">time</text>

  <text x="320" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#64748b">The oil and spring waste the bounce as heat, so the car settles quickly after each bump.</text>
</svg>
