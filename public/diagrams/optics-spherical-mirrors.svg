<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#64748b"/></marker>
    <marker id="arA" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 z" fill="#c2410c"/></marker>
  </defs>
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#c2410c">Spherical mirrors: concave and convex</text>

  <text x="160" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#334155">Concave mirror — converges light</text>
  <line x1="70" y1="190" x2="300" y2="190" stroke="#64748b" stroke-width="1.5"/>
  <path d="M200,103 A100,100 0 0 0 200,277" fill="none" stroke="#475569" stroke-width="4"/>
  <g stroke="#94a3b8" stroke-width="1">
    <line x1="232" y1="118" x2="222" y2="130"/>
    <line x1="240" y1="145" x2="229" y2="155"/>
    <line x1="240" y1="175" x2="229" y2="180"/>
    <line x1="240" y1="205" x2="229" y2="200"/>
    <line x1="240" y1="235" x2="229" y2="225"/>
  </g>

  <line x1="70" y1="128" x2="232" y2="128" stroke="#c2410c" stroke-width="2.5" marker-end="url(#arA)"/>
  <line x1="232" y1="128" x2="200" y2="190" stroke="#c2410c" stroke-width="2.5" marker-end="url(#arA)"/>
  <line x1="70" y1="160" x2="245" y2="160" stroke="#c2410c" stroke-width="2.5" marker-end="url(#arA)"/>
  <line x1="245" y1="160" x2="200" y2="190" stroke="#c2410c" stroke-width="2.5" marker-end="url(#arA)"/>

  <line x1="150" y1="190" x2="250" y2="190" stroke="#16a34a" stroke-width="2" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <line x1="200" y1="190" x2="250" y2="190" stroke="#dc2626" stroke-width="2" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="185" y="185" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#16a34a">R</text>
  <text x="215" y="185" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#dc2626">f</text>

  <text x="248" y="215" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#334155">P</text>
  <text x="196" y="215" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#334155">F</text>
  <text x="140" y="215" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#334155">C</text>
  <text x="150" y="235" font-family="Arial, sans-serif" font-size="11" fill="#475569">pole on the reflecting side</text>
  <text x="70" y="110" font-family="Arial, sans-serif" font-size="11" fill="#475569">parallel rays</text>
  <text x="196" y="262" font-family="Arial, sans-serif" font-size="11" fill="#475569">rays meet at the real focus F</text>

  <line x1="390" y1="190" x2="580" y2="190" stroke="#64748b" stroke-width="1.5"/>
  <path d="M360,138 A60,60 0 0 1 360,242" fill="none" stroke="#475569" stroke-width="4"/>
  <g stroke="#94a3b8" stroke-width="1">
    <line x1="356" y1="118" x2="366" y2="130"/>
    <line x1="352" y1="150" x2="364" y2="158"/>
    <line x1="352" y1="230" x2="364" y2="222"/>
    <line x1="356" y1="262" x2="366" y2="250"/>
  </g>

  <line x1="366" y1="135" x2="250" y2="55" stroke="#c2410c" stroke-width="2.5" marker-end="url(#arA)"/>
  <line x1="360" y1="190" x2="366" y2="135" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="338" y1="160" x2="250" y2="100" stroke="#c2410c" stroke-width="2.5" marker-end="url(#arA)"/>
  <line x1="360" y1="190" x2="338" y2="160" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="500" y="135" font-family="Arial, sans-serif" font-size="11" fill="#475569">parallel rays</text>

  <line x1="330" y1="190" x2="390" y2="190" stroke="#16a34a" stroke-width="2" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <text x="348" y="185" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#16a34a">R</text>
  <text x="322" y="215" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#334155">P</text>
  <text x="356" y="215" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#334155">F</text>
  <text x="386" y="215" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#334155">C</text>
  <text x="322" y="270" font-family="Arial, sans-serif" font-size="11" fill="#475569">reflected rays spread as if</text>
  <text x="322" y="284" font-family="Arial, sans-serif" font-size="11" fill="#475569">coming from the virtual focus F</text>

  <text x="320" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#c2410c">C = centre of curvature, P = pole, F = principal focus, f = focal length, R = radius of curvature</text>

  <rect x="100" y="316" width="440" height="30" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.5"/>
  <text x="320" y="336" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#166534">f = R/2 — the focus lies halfway between the pole and the centre of curvature</text>

  <text x="320" y="356" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#64748b">Concave mirrors gather light to a real focus; convex mirrors spread it from a virtual focus behind the mirror.</text>
</svg>
