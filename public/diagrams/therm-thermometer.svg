<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360">
  <rect width="640" height="360" fill="#fffdf7"/>
  <text x="320" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#c2410c">A liquid-in-glass thermometer</text>
  <rect x="285" y="60" width="70" height="14" rx="7" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
  <rect x="285" y="74" width="70" height="190" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <rect x="293" y="78" width="54" height="182" fill="#ffffff"/>
  <line x1="300" y1="78" x2="300" y2="258" stroke="#b91c1c" stroke-width="6"/>
  <circle cx="320" cy="266" r="13" fill="#b91c1c"/>
  <text x="320" y="271" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fff">Hg</text>
  <g stroke="#94a3b8" stroke-width="1">
    <line x1="292" y1="100" x2="302" y2="100"/><line x1="292" y1="140" x2="302" y2="140"/>
    <line x1="292" y1="180" x2="302" y2="180"/><line x1="292" y1="220" x2="302" y2="220"/>
  </g>
  <text x="282" y="104" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#334155">50</text>
  <text x="282" y="144" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#334155">30</text>
  <text x="282" y="184" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#334155">10</text>
  <text x="282" y="224" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#334155">−10</text>
  <text x="320" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#334155">mercury or coloured alcohol expands uniformly</text>
  <text x="110" y="110" font-family="Arial, sans-serif" font-size="13" fill="#334155">heat the bulb and the liquid expands,</text>
  <text x="110" y="130" font-family="Arial, sans-serif" font-size="13" fill="#334155">climbing the capillary tube</text>
  <text x="110" y="150" font-family="Arial, sans-serif" font-size="13" fill="#334155">— the height reads the temperature</text>
  <text x="320" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">fixed points: 0 °C ice point · 100 °C steam point</text>
</svg>
